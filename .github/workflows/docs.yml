name: Documentação

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Validar Markdown, YAML e OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar YAML
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github docs/03-arquitetura/api

      - name: Validar OpenAPI 3.1
        run: |
          pip install --quiet openapi-spec-validator
          openapi-spec-validator docs/03-arquitetura/api/openapi.yaml

      - name: Verificar links internos
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress 'README.md' 'CONTRIBUTING.md' 'docs/**/*.md'
          fail: true

  diagramas:
    name: Renderizar diagramas PlantUML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar todos os .puml (falha em erro de sintaxe)
        run: |
          for dir in $(find docs -name '*.puml' -exec dirname {} \; | sort -u); do
            docker run --rm -v "$PWD/$dir:/data" -w /data plantuml/plantuml:1.2024.7 -tsvg -charset UTF-8 -failfast2 -o /tmp/img "*.puml"
          done
