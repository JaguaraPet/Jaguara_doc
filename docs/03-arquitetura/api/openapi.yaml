openapi: 3.1.0
info:
  title: Jaguara API
  version: 1.0.0
  summary: API REST da plataforma Jaguara (tutores e empresas Enterprise).
  description: |
    Contrato da API do Jaguara (tarefa JAG-68). Os recursos seguem o modelo de classes
    (docs/04-modelagem/MOD-01-modelo-de-classes.md) e os casos de uso (docs/02-requisitos/REQ-04).
    Erros usam o formato application/problem+json (RFC 9457) com o campo `codigo` de negócio.
    Datas em ISO 8601 (UTC). Paginação por `pagina` e `tamanho`.
  contact:
    name: Equipe Jaguara
  license:
    name: Uso acadêmico
    identifier: CC-BY-4.0
servers:
  - url: https://api.homologacao.jaguarapet.com.br/v1
    description: Homologação
  - url: http://localhost:3000/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Autenticação
  - name: Pets
  - name: Saúde
  - name: Rotina
  - name: Financeiro
  - name: Catálogo e agenda
  - name: Solicitações e agendamentos
  - name: Atendimentos
  - name: Empresa
  - name: Comunicação
  - name: Privacidade
  - name: Administração
  - name: Webhooks

paths:
  /auth/cadastro/tutor:
    post:
      tags: [Autenticação]
      summary: Cadastrar tutor (UC-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroTutor' }
      responses:
        '201':
          description: Conta criada com status PENDENTE_CONFIRMACAO; e-mail de confirmação enviado (RN02).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/cadastro/empresa:
    post:
      tags: [Autenticação]
      summary: Cadastrar empresa Enterprise (UC-32)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroEmpresa' }
      responses:
        '201':
          description: Conta criada; aguardando confirmação do e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/confirmacao:
    post:
      tags: [Autenticação]
      summary: Confirmar e-mail (RN02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: "Conta ativada." }
        '410': { $ref: '#/components/responses/Expirado' }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar usuário (UC-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string, format: password }
      responses:
        '200':
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '423':
          description: Conta bloqueada por 5 minutos após 5 falhas (RN03).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /auth/renovacao:
    post:
      tags: [Autenticação]
      summary: Renovar o access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Novos tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerrar a sessão atual
      responses:
        '204': { description: "Sessão encerrada." }
  /auth/senha/recuperacao:
    post:
      tags: [Autenticação]
      summary: Solicitar link de recuperação de senha (UC-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: "Se o e-mail existir, um link válido por 2 horas é enviado (RN05)." }
  /auth/senha/redefinicao:
    post:
      tags: [Autenticação]
      summary: Redefinir senha com o token recebido (UC-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, novaSenha]
              properties:
                token: { type: string }
                novaSenha: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: "Senha redefinida." }
        '410': { $ref: '#/components/responses/Expirado' }
        '422':
          description: Senha igual a uma das três últimas (RN06).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /pets:
    get:
      tags: [Pets]
      summary: Listar pets do tutor autenticado
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusPet' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de pets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPets' }
    post:
      tags: [Pets]
      summary: Cadastrar pet (UC-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '201':
          description: Pet criado com o tutor como responsável principal (RN09).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Consultar perfil do pet (UC-04, UC-22)
      description: Empresas só acessam com compartilhamento ativo ou agendamento (RN24, RN26).
      responses:
        '200':
          description: Perfil do pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Pets]
      summary: Editar pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '200':
          description: Pet atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    delete:
      tags: [Pets]
      summary: Excluir pet sem histórico (RN08)
      responses:
        '204': { description: "Pet excluído." }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/arquivamento:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Pets]
      summary: Arquivar pet
      responses:
        '204': { description: "Pet arquivado." }
  /pets/{petId}/responsaveis:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Pets]
      summary: Vincular responsável (UC-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, tipo]
              properties:
                email: { type: string, format: email }
                tipo: { $ref: '#/components/schemas/TipoResponsavel' }
      responses:
        '201': { description: "Vínculo criado." }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/compartilhamentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Pets]
      summary: Compartilhar perfil do pet (UC-11)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompartilhamentoEntrada' }
      responses:
        '201':
          description: Compartilhamento ativo com os escopos informados (RN15).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compartilhamento' }
  /pets/{petId}/linha-do-tempo:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Consultar linha do tempo do pet (UC-35)
      responses:
        '200':
          description: Eventos em ordem cronológica.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemLinhaDoTempo' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /pets/{petId}/vacinacoes:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Visualizar vacinação (UC-12)
      description: Retorna apenas registros válidos (RN16).
      responses:
        '200':
          description: Histórico vacinal.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vacinacao' }
    post:
      tags: [Saúde]
      summary: Cadastrar vacinação (UC-13)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacinacaoEntrada' }
      responses:
        '201':
          description: Vacinação registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacinacao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/tratamentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Saúde]
      summary: Cadastrar tratamento medicamentoso (UC-14)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TratamentoEntrada' }
      responses:
        '201': { description: "Tratamento ativo com lembretes agendados (RN18)." }
  /tratamentos/{tratamentoId}/finalizacao:
    parameters:
      - in: path
        name: tratamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Saúde]
      summary: Finalizar tratamento e cancelar lembretes
      responses:
        '204': { description: "Tratamento finalizado." }
  /pets/{petId}/exames:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Saúde]
      summary: Registrar exame (UC-36)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExameEntrada' }
      responses:
        '201': { description: "Exame registrado." }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /pets/{petId}/alergias:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Saúde]
      summary: Registrar alergia ou restrição (UC-37)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlergiaEntrada' }
      responses:
        '201': { description: "Alergia registrada." }
  /pets/{petId}/documentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Saúde]
      summary: Iniciar envio de documento (UC-34)
      description: Retorna uma URL assinada de envio válida por 5 minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo, nomeArquivo, tamanhoBytes]
              properties:
                titulo: { type: string }
                tipo: { $ref: '#/components/schemas/TipoDocumento' }
                nomeArquivo: { type: string }
                tamanhoBytes: { type: integer, maximum: 10485760 }
      responses:
        '201':
          description: Documento criado e URL de envio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentoId: { type: string, format: uuid }
                  urlEnvio: { type: string, format: uri }
  /pets/{petId}/eventos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Listar eventos do calendário (UC-10)
      parameters:
        - in: query
          name: de
          schema: { type: string, format: date-time }
        - in: query
          name: ate
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Eventos no período.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evento' }
    post:
      tags: [Rotina]
      summary: Criar evento (UC-10)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoEntrada' }
      responses:
        '201':
          description: Evento criado e lembrete agendado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/refeicoes:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Rotina]
      summary: Registrar refeição (UC-08)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataHora, alimento, quantidadeGramas]
              properties:
                dataHora: { type: string, format: date-time }
                alimento: { type: string }
                quantidadeGramas: { type: number, exclusiveMinimum: 0 }
      responses:
        '201':
          description: Refeição registrada; `limiteExcedido` indica alerta (RN12).
          content:
            application/json:
              schema:
                type: object
                properties:
                  consumoDoDia: { type: number }
                  limiteExcedido: { type: boolean }
  /pets/{petId}/despesas:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Financeiro]
      summary: Listar despesas (UC-06)
      responses:
        '200':
          description: Despesas do pet.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Despesa' }
    post:
      tags: [Financeiro]
      summary: Registrar despesa (UC-06)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DespesaEntrada' }
      responses:
        '201':
          description: Despesa registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Despesa' }
        '422': { $ref: '#/components/responses/Validacao' }
  /relatorios/despesas:
    get:
      tags: [Financeiro]
      summary: Emitir relatório de despesas (UC-07)
      parameters:
        - in: query
          name: petId
          schema: { type: string, format: uuid }
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Relatório em JSON ou PDF (RN11), conforme o cabeçalho Accept.
          content:
            application/json:
              schema: { type: object }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }

  /empresas/{empresaId}/servicos:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Visualizar catálogo de serviços (UC-33)
      responses:
        '200':
          description: Serviços ativos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Servico' }
    post:
      tags: [Catálogo e agenda]
      summary: Cadastrar serviço (UC-38)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicoEntrada' }
      responses:
        '201':
          description: Serviço criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servico' }
  /servicos/{servicoId}:
    parameters:
      - in: path
        name: servicoId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Catálogo e agenda]
      summary: Alterar serviço (UC-38)
      description: Alterar o preço não afeta agendamentos existentes (RN27).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicoEntrada' }
      responses:
        '200':
          description: Serviço atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servico' }
  /servicos/{servicoId}/horarios-disponiveis:
    parameters:
      - in: path
        name: servicoId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catálogo e agenda]
      summary: Consultar horários disponíveis (UC-40, RN40)
      parameters:
        - in: query
          name: data
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Horários livres.
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: date-time }
  /empresas/{empresaId}/horarios-atuacao:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    post:
      tags: [Catálogo e agenda]
      summary: Cadastrar horário de atuação (UC-24)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HorarioAtuacaoEntrada' }
      responses:
        '201': { description: "Horário registrado." }
        '409': { $ref: '#/components/responses/Conflito' }
  /empresas/{empresaId}/agenda:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Controlar agenda semanal (UC-24)
      parameters:
        - in: query
          name: semana
          required: true
          schema: { type: string, format: date }
        - in: query
          name: profissionalId
          schema: { type: string, format: uuid }
        - in: query
          name: recursoId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agendamentos e solicitações pendentes da semana.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agendamentos:
                    type: array
                    items: { $ref: '#/components/schemas/Agendamento' }
                  solicitacoesPendentes:
                    type: array
                    items: { $ref: '#/components/schemas/Solicitacao' }

  /solicitacoes:
    get:
      tags: [Solicitações e agendamentos]
      summary: Consultar solicitações (UC-41 empresa, UC-42 tutor)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusSolicitacao' }
      responses:
        '200':
          description: Solicitações do usuário autenticado.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Solicitacao' }
    post:
      tags: [Solicitações e agendamentos]
      summary: Solicitar agendamento de serviço (UC-40)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servicoId, petId, dataHoraDesejada]
              properties:
                servicoId: { type: string, format: uuid }
                petId: { type: string, format: uuid }
                dataHoraDesejada: { type: string, format: date-time }
                observacoes: { type: string }
      responses:
        '201':
          description: Solicitação PENDENTE (RN38, RN40).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Solicitacao' }
        '409': { $ref: '#/components/responses/Conflito' }
  /solicitacoes/{solicitacaoId}/aceite:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Aceitar solicitação e criar agendamento (UC-41)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profissionalId: { type: string, format: uuid }
                recursoId: { type: string, format: uuid }
      responses:
        '200':
          description: Solicitação ACEITA e agendamento criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '409': { $ref: '#/components/responses/Conflito' }
  /solicitacoes/{solicitacaoId}/recusa:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Recusar solicitação (UC-41)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3 }
      responses:
        '204': { description: "Solicitação RECUSADA." }
  /solicitacoes/{solicitacaoId}/cancelamento:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Cancelar solicitação (UC-42)
      responses:
        '204': { description: "Solicitação CANCELADA e horário liberado." }
        '409': { $ref: '#/components/responses/Conflito' }
  /solicitacoes/{solicitacaoId}/historico:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    get:
      tags: [Solicitações e agendamentos]
      summary: Histórico de status da solicitação (RN38)
      responses:
        '200':
          description: Mudanças de status em ordem.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoricoSolicitacao' }
  /agendamentos:
    post:
      tags: [Solicitações e agendamentos]
      summary: Agendar serviço pela empresa (UC-39)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgendamentoEntrada' }
      responses:
        '201':
          description: Agendamento criado e tutor notificado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '409': { $ref: '#/components/responses/Conflito' }
  /agendamentos/{agendamentoId}:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    patch:
      tags: [Solicitações e agendamentos]
      summary: Remarcar agendamento (UC-24)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataHoraInicio, dataHoraFim]
              properties:
                dataHoraInicio: { type: string, format: date-time }
                dataHoraFim: { type: string, format: date-time }
                profissionalId: { type: string, format: uuid }
                recursoId: { type: string, format: uuid }
      responses:
        '200':
          description: Agendamento remarcado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '409': { $ref: '#/components/responses/Conflito' }
  /agendamentos/{agendamentoId}/cancelamento:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Cancelar agendamento (UC-24)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string }
      responses:
        '204': { description: "Agendamento CANCELADO." }
  /agendamentos/{agendamentoId}/atendimento:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    post:
      tags: [Atendimentos]
      summary: Registrar serviços e atendimento (UC-23)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtendimentoEntrada' }
      responses:
        '201':
          description: Atendimento FINALIZADO com itens pelo preço contratado (RN27).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /atendimentos/{atendimentoId}:
    parameters:
      - in: path
        name: atendimentoId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Atendimentos]
      summary: Alterar atendimento finalizado com auditoria (RN28)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justificativa]
              properties:
                observacoesClinicas: { type: string }
                procedimentosRealizados: { type: string }
                justificativa: { type: string, minLength: 10 }
      responses:
        '200':
          description: Atendimento alterado e auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '422': { $ref: '#/components/responses/Validacao' }

  /empresas/{empresaId}/funcionarios:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Listar funcionários (UC-19)
      responses:
        '200':
          description: Funcionários da empresa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Funcionario' }
    post:
      tags: [Empresa]
      summary: Cadastrar funcionário (UC-19)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, cpf, email, perfilId]
              properties:
                nome: { type: string }
                cpf: { type: string, pattern: '^[0-9]{11}$' }
                email: { type: string, format: email }
                cargo: { type: string }
                perfilId: { type: string, format: uuid }
      responses:
        '201':
          description: Funcionário criado; ativo após confirmar o e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcionario' }
        '409': { $ref: '#/components/responses/Conflito' }
  /funcionarios/{funcionarioId}:
    parameters:
      - in: path
        name: funcionarioId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Empresa]
      summary: Alterar perfil de acesso do funcionário (UC-16)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perfilId]
              properties:
                perfilId: { type: string, format: uuid }
      responses:
        '200':
          description: Perfil alterado com efeito imediato (RN20).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcionario' }
    delete:
      tags: [Empresa]
      summary: Remover funcionário e revogar acessos (RN23)
      responses:
        '204': { description: "Funcionário removido." }
  /empresas/{empresaId}/clientes:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    post:
      tags: [Empresa]
      summary: Cadastrar cliente (UC-21)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tutorEmail, consentimentoLGPD]
              properties:
                tutorEmail: { type: string, format: email }
                observacoes: { type: string }
                consentimentoLGPD:
                  type: boolean
                  const: true
                  description: Obrigatório (RN25).
      responses:
        '201': { description: "Cliente vinculado." }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/pets-vinculados:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Consultar pets vinculados (UC-20, RN24)
      responses:
        '200':
          description: Pets com agendamento ou compartilhamento ativo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
  /empresas/{empresaId}/indicadores:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Emitir BI (UC-17, RN21)
      parameters:
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Indicadores da própria empresa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  atendimentos: { type: integer }
                  faturamento: { type: number }
                  taxaAceite: { type: number }
                  servicosMaisSolicitados:
                    type: array
                    items:
                      type: object
                      properties:
                        servico: { type: string }
                        quantidade: { type: integer }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /pagamentos:
    get:
      tags: [Financeiro]
      summary: Gerenciar pagamentos (UC-45)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusPagamento' }
        - in: query
          name: de
          schema: { type: string, format: date }
        - in: query
          name: ate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Pagamentos realizados (tutor) ou recebidos (empresa).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pagamento' }
    post:
      tags: [Financeiro]
      summary: Realizar pagamento (UC-44)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metodo]
              properties:
                agendamentoId: { type: string, format: uuid }
                assinaturaId: { type: string, format: uuid }
                metodo: { $ref: '#/components/schemas/MetodoPagamento' }
              oneOf:
                - required: [agendamentoId]
                - required: [assinaturaId]
      responses:
        '201':
          description: Pagamento PENDENTE com dados de cobrança (RN39).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pagamento' }
  /pagamentos/{pagamentoId}/reembolsos:
    parameters:
      - in: path
        name: pagamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Financeiro]
      summary: Solicitar reembolso (UC-45)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        '201': { description: "Reembolso EM_ANALISE." }
        '409': { $ref: '#/components/responses/Conflito' }

  /conversas:
    get:
      tags: [Comunicação]
      summary: Listar conversas (UC-43)
      responses:
        '200':
          description: Conversas do usuário.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversa' }
    post:
      tags: [Comunicação]
      summary: Iniciar conversa com empresa ou assistente (UC-43)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { $ref: '#/components/schemas/TipoConversa' }
                empresaId: { type: string, format: uuid }
                petId: { type: string, format: uuid }
      responses:
        '201':
          description: Conversa criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversa' }
        '402':
          description: Assistente exige assinatura PANTERA ativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /conversas/{conversaId}/mensagens:
    parameters:
      - in: path
        name: conversaId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Comunicação]
      summary: Enviar mensagem (também disponível por WebSocket)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conteudo]
              properties:
                conteudo: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Mensagem registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensagem' }

  /privacidade/consentimentos:
    get:
      tags: [Privacidade]
      summary: Consultar consentimentos (UC-46)
      responses:
        '200':
          description: Termos vigentes e consentimentos do usuário.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimento' }
    put:
      tags: [Privacidade]
      summary: Atualizar consentimentos opcionais (UC-46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [termoId, aceito]
                properties:
                  termoId: { type: string, format: uuid }
                  aceito: { type: boolean }
      responses:
        '204': { description: "Consentimentos atualizados e auditados." }
        '409':
          description: Termo obrigatório não pode ser revogado sem excluir a conta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /privacidade/solicitacoes:
    post:
      tags: [Privacidade]
      summary: Solicitar exportação, correção ou exclusão de dados (UC-46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo:
                  type: string
                  enum: [EXPORTACAO_DADOS, EXCLUSAO_DADOS, CORRECAO_DADOS]
                senha:
                  type: string
                  format: password
                  description: Obrigatória para exclusão.
      responses:
        '202': { description: "Pedido registrado; resposta em até 15 dias." }

  /admin/usuarios/{usuarioId}/status:
    parameters:
      - in: path
        name: usuarioId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Administração]
      summary: Bloquear, suspender ou reativar conta (UC-28)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, motivo]
              properties:
                status:
                  type: string
                  enum: [ATIVA, BLOQUEADA, SUSPENSA]
                motivo: { type: string }
      responses:
        '204': { description: "Status alterado e auditado (RN34)." }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /admin/logs:
    get:
      tags: [Administração]
      summary: Monitorar logs (UC-25)
      parameters:
        - in: query
          name: nivel
          schema:
            type: string
            enum: [INFO, ALERTA, CRITICO]
        - in: query
          name: de
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Registros de auditoria.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogAuditoria' }
  /admin/webhooks:
    post:
      tags: [Administração]
      summary: Cadastrar webhook (UC-30)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventos, metodoAutenticacao]
              properties:
                url: { type: string, format: uri, pattern: '^https://' }
                eventos:
                  type: array
                  minItems: 1
                  items: { type: string }
                metodoAutenticacao:
                  type: string
                  enum: [HMAC_SHA256]
      responses:
        '201': { description: "Webhook salvo (RN36)." }
        '422': { $ref: '#/components/responses/Validacao' }
  /webhooks/pagamentos:
    post:
      tags: [Webhooks]
      summary: Receber eventos do gateway de pagamento
      security: []
      parameters:
        - in: header
          name: X-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: "Evento processado." }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /health:
    get:
      tags: [Administração]
      summary: Verificação de saúde
      security: []
      responses:
        '200':
          description: API, banco e Redis disponíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PetId:
      in: path
      name: petId
      required: true
      schema: { type: string, format: uuid }
    EmpresaId:
      in: path
      name: empresaId
      required: true
      schema: { type: string, format: uuid }
    SolicitacaoId:
      in: path
      name: solicitacaoId
      required: true
      schema: { type: string, format: uuid }
    AgendamentoId:
      in: path
      name: agendamentoId
      required: true
      schema: { type: string, format: uuid }
    Pagina:
      in: query
      name: pagina
      schema: { type: integer, minimum: 1, default: 1 }
    Tamanho:
      in: query
      name: tamanho
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    NaoAutenticado:
      description: Não autenticado ou sessão expirada (RN04).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SemPermissao:
      description: Sem permissão para o recurso (RN20, RN24, RN26).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflito:
      description: Conflito de regra de negócio (ex. RN01, RN08, RN14, RN29) ou transição de estado inválida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Validacao:
      description: Dados inválidos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Expirado:
      description: Token expirado ou já utilizado (RN05).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
  schemas:
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          description: Código de negócio, por exemplo RN14_CONFLITO_AGENDA.
        campos:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensagem: { type: string }
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiraEm]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEm: { type: string, format: date-time }
    Endereco:
      type: object
      required: [cep, logradouro, numero, bairro, cidade, uf]
      properties:
        cep: { type: string, pattern: '^[0-9]{8}$' }
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string, pattern: '^[A-Z]{2}$' }
    CadastroTutor:
      type: object
      required: [nome, cpf, email, senha, aceiteTermos]
      properties:
        nome: { type: string }
        cpf: { type: string, pattern: '^[0-9]{11}$' }
        email: { type: string, format: email }
        telefone: { type: string }
        senha: { type: string, format: password, minLength: 8 }
        aceiteTermos: { type: boolean, const: true }
    CadastroEmpresa:
      type: object
      required: [cnpj, razaoSocial, nomeFantasia, tipo, email, senha, endereco, aceiteTermos]
      properties:
        cnpj: { type: string, pattern: '^[0-9]{14}$' }
        razaoSocial: { type: string }
        nomeFantasia: { type: string }
        tipo:
          type: string
          enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO]
        email: { type: string, format: email }
        senha: { type: string, format: password, minLength: 8 }
        endereco: { $ref: '#/components/schemas/Endereco' }
        aceiteTermos: { type: boolean, const: true }
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [PENDENTE_CONFIRMACAO, ATIVA, BLOQUEADA, SUSPENSA, INATIVA]
        perfil: { type: string }
    StatusPet:
      type: string
      enum: [ATIVO, ARQUIVADO, FALECIDO]
    TipoResponsavel:
      type: string
      enum: [PRINCIPAL, ADICIONAL]
    TipoDocumento:
      type: string
      enum: [RG_ANIMAL, CARTEIRA_VACINACAO, ATESTADO, RECEITA, LAUDO, PEDIGREE, OUTRO]
    PetEntrada:
      type: object
      required: [nome, racaId, sexo, castrado]
      properties:
        nome: { type: string }
        racaId: { type: string, format: uuid }
        dataNascimento: { type: string, format: date }
        sexo: { type: string, enum: [MACHO, FEMEA] }
        pesoKg: { type: number, exclusiveMinimum: 0 }
        cor: { type: string }
        microchip: { type: string }
        castrado: { type: boolean }
    Pet:
      allOf:
        - $ref: '#/components/schemas/PetEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            especie: { type: string }
            raca: { type: string }
            idade: { type: integer }
            status: { $ref: '#/components/schemas/StatusPet' }
            fotoUrl: { type: string, format: uri }
    PaginaPets:
      type: object
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Pet' }
        total: { type: integer }
        pagina: { type: integer }
    CompartilhamentoEntrada:
      type: object
      required: [escopos]
      properties:
        destinatarioEmail: { type: string, format: email }
        empresaId: { type: string, format: uuid }
        escopos:
          type: array
          minItems: 1
          items:
            type: string
            enum: [PERFIL_BASICO, VACINAS, EXAMES, MEDICAMENTOS, ALERGIAS, DOCUMENTOS, LINHA_DO_TEMPO, EDICAO_CLINICA]
        dataExpiracao: { type: string, format: date-time }
    Compartilhamento:
      allOf:
        - $ref: '#/components/schemas/CompartilhamentoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [ATIVO, REVOGADO, EXPIRADO] }
            link: { type: string, format: uri }
    VacinacaoEntrada:
      type: object
      required: [nomeVacina, dataAplicacao, responsavelAplicacao]
      properties:
        nomeVacina: { type: string }
        fabricante: { type: string }
        lote: { type: string }
        dataAplicacao: { type: string, format: date }
        dataProximaDose: { type: string, format: date }
        responsavelAplicacao: { type: string, minLength: 1 }
    Vacinacao:
      allOf:
        - $ref: '#/components/schemas/VacinacaoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            valido: { type: boolean }
    TratamentoEntrada:
      type: object
      required: [medicamento, dosagem, viaAdministracao, intervaloHoras, dataInicio]
      properties:
        medicamento: { type: string }
        dosagem: { type: string }
        viaAdministracao: { type: string }
        intervaloHoras: { type: integer, minimum: 1 }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
    ExameEntrada:
      type: object
      required: [tipoExame, dataRealizacao]
      properties:
        tipoExame: { type: string }
        dataRealizacao: { type: string, format: date }
        laboratorio: { type: string }
        resultado: { type: string }
        documentoId: { type: string, format: uuid }
    AlergiaEntrada:
      type: object
      required: [tipo, descricao, gravidade]
      properties:
        tipo: { type: string, enum: [ALERGIA, RESTRICAO_ALIMENTAR, RESTRICAO_MEDICAMENTOSA, OUTRA] }
        descricao: { type: string }
        gravidade: { type: string, enum: [LEVE, MODERADA, GRAVE] }
        dataIdentificacao: { type: string, format: date }
    ItemLinhaDoTempo:
      type: object
      properties:
        data: { type: string, format: date-time }
        tipo: { type: string, enum: [VACINACAO, EXAME, TRATAMENTO, EVENTO, ATENDIMENTO] }
        titulo: { type: string }
        referenciaId: { type: string, format: uuid }
    EventoEntrada:
      type: object
      required: [titulo, tipo, dataHoraInicio]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        tipo:
          type: string
          enum: [CONSULTA, VACINA, MEDICAMENTO, EXAME, CIRURGIA, BANHO_TOSA, HOSPEDAGEM, COMPROMISSO, OUTRO]
        dataHoraInicio: { type: string, format: date-time }
        dataHoraFim: { type: string, format: date-time }
        local: { type: string }
    Evento:
      allOf:
        - $ref: '#/components/schemas/EventoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            origem: { type: string, enum: [MANUAL, AGENDAMENTO, CALENDARIO_EXTERNO] }
    DespesaEntrada:
      type: object
      required: [descricao, valor, data, categoriaId]
      properties:
        descricao: { type: string }
        valor: { type: number, exclusiveMinimum: 0 }
        data: { type: string, format: date }
        categoriaId: { type: string, format: uuid }
    Despesa:
      allOf:
        - $ref: '#/components/schemas/DespesaEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            categoria: { type: string }
    ServicoEntrada:
      type: object
      required: [nome, descricao, categoria, preco, duracaoMinutos]
      properties:
        nome: { type: string }
        descricao: { type: string }
        categoria:
          type: string
          enum: [CONSULTA, EXAME, CIRURGIA, VACINACAO, BANHO_TOSA, HOSPEDAGEM, PET_SITTER, CRECHE, OUTRO]
        preco: { type: number, minimum: 0 }
        duracaoMinutos: { type: integer, minimum: 5 }
        ativo: { type: boolean, default: true }
    Servico:
      allOf:
        - $ref: '#/components/schemas/ServicoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
    HorarioAtuacaoEntrada:
      type: object
      required: [diaSemana, horaInicio, horaFim]
      properties:
        diaSemana:
          type: string
          enum: [SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO, DOMINGO]
        horaInicio: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        horaFim: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        funcionarioId: { type: string, format: uuid }
        recursoId: { type: string, format: uuid }
      oneOf:
        - required: [funcionarioId]
        - required: [recursoId]
    StatusSolicitacao:
      type: string
      enum: [PENDENTE, ACEITA, RECUSADA, CANCELADA, CONCLUIDA, ENCERRADA]
    Solicitacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        servicoId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        tutorId: { type: string, format: uuid }
        dataHoraDesejada: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/StatusSolicitacao' }
        motivoRecusa: { type: string }
    HistoricoSolicitacao:
      type: object
      properties:
        dataHora: { type: string, format: date-time }
        statusAnterior: { $ref: '#/components/schemas/StatusSolicitacao' }
        statusNovo: { $ref: '#/components/schemas/StatusSolicitacao' }
        autor: { type: string }
        descricao: { type: string }
    AgendamentoEntrada:
      type: object
      required: [servicoId, petId, dataHoraInicio]
      properties:
        servicoId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        dataHoraInicio: { type: string, format: date-time }
        profissionalId: { type: string, format: uuid }
        recursoId: { type: string, format: uuid }
    Agendamento:
      allOf:
        - $ref: '#/components/schemas/AgendamentoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            dataHoraFim: { type: string, format: date-time }
            precoContratado:
              type: number
              description: Congelado na criação (RN27).
            status:
              type: string
              enum: [AGENDADO, CANCELADO, REALIZADO, NAO_COMPARECEU]
    AtendimentoEntrada:
      type: object
      required: [procedimentosRealizados, itens]
      properties:
        procedimentosRealizados: { type: string }
        observacoesClinicas: { type: string }
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [servicoId, quantidade]
            properties:
              servicoId: { type: string, format: uuid }
              quantidade: { type: integer, minimum: 1 }
              observacao: { type: string }
    Atendimento:
      type: object
      properties:
        id: { type: string, format: uuid }
        agendamentoId: { type: string, format: uuid }
        status: { type: string, enum: [EM_ANDAMENTO, FINALIZADO] }
        total: { type: number }
        finalizadoEm: { type: string, format: date-time }
    Funcionario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        cargo: { type: string }
        perfil: { type: string }
        ativo: { type: boolean }
    MetodoPagamento:
      type: string
      enum: [CARTAO_CREDITO, CARTAO_DEBITO, PIX, BOLETO]
    StatusPagamento:
      type: string
      enum: [PENDENTE, ACEITO, CANCELADO, RECUSADO]
    Pagamento:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigoTransacao: { type: string }
        valor: { type: number }
        dataHora: { type: string, format: date-time }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        status: { $ref: '#/components/schemas/StatusPagamento' }
        dataConfirmacao: { type: string, format: date-time }
        qrCode: { type: string }
        notaFiscalUrl: { type: string, format: uri }
    TipoConversa:
      type: string
      enum: [EMPRESA, ASSISTENTE_VIRTUAL]
    Conversa:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoConversa' }
        empresaId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        status: { type: string, enum: [ABERTA, ENCERRADA] }
    Mensagem:
      type: object
      properties:
        id: { type: string, format: uuid }
        conteudo: { type: string }
        dataHoraEnvio: { type: string, format: date-time }
        remetenteId:
          type: [string, 'null']
          format: uuid
          description: Nulo quando a mensagem é do assistente virtual.
        lida: { type: boolean }
    Consentimento:
      type: object
      properties:
        termoId: { type: string, format: uuid }
        titulo: { type: string }
        versao: { type: string }
        obrigatorio: { type: boolean }
        aceito: { type: boolean }
        dataAceite: { type: string, format: date-time }
    LogAuditoria:
      type: object
      properties:
        dataHora: { type: string, format: date-time }
        acao: { type: string }
        entidade: { type: string }
        entidadeId: { type: string }
        nivel: { type: string, enum: [INFO, ALERTA, CRITICO] }
        autorId: { type: string, format: uuid }
