    ConfiguracaoNotificacao:
      type: object
      properties:
        tipoEvento:
          type: string
          enum: [CONSULTA, VACINA, MEDICAMENTO, EXAME, CIRURGIA, BANHO_TOSA, HOSPEDAGEM, COMPROMISSO, OUTRO]
        canal: { type: string, enum: [PUSH, EMAIL, SMS] }
        antecedenciaMinutos: { type: integer }
        ativa: { type: boolean }
    Integracao:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        tipo: { type: string, enum: [CALENDARIO, PAGAMENTO, PLATAFORMA_VETERINARIA, NOTIFICACAO, OUTRA] }
        endpointUrl: { type: string }
        parametros: { type: string }
        ativa: { type: boolean }
        temCredenciais: { type: boolean }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        eventos: { type: array, items: { type: string } }
        metodoAutenticacao: { type: string }
        ativo: { type: boolean }
        integracaoId: { type: string, format: uuid }
        segredo:
          type: string
          description: Só na resposta da criação.
    Responsavel:
      type: object
      properties:
        tutorId: { type: string, format: uuid }
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoResponsavel' }
        dataVinculo: { type: string, format: date-time }
        voce: { type: boolean, description: É o usuário autenticado. }
    Assinatura:
      type: object
      properties:
        id: { type: string, format: uuid }
        plano: { type: string, enum: [GRATUITO, PANTERA] }
        status: { type: string, enum: [PENDENTE, ATIVA, CANCELADA, EXPIRADA] }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        precoMensal: { type: number }
    TipoConversa:
      type: string
      enum: [EMPRESA, ASSISTENTE_VIRTUAL]
    Conversa:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoConversa' }
        empresaId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        status: { type: string, enum: [ABERTA, ENCERRADA] }
    Mensagem:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversaId: { type: string, format: uuid }
        conteudo: { type: string }
        dataHoraEnvio: { type: string, format: date-time }
        remetenteId:
          type: [string, 'null']
          format: uuid
          description: Nulo quando a mensagem é do assistente virtual.
        lida: { type: boolean }
    Termo:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [TERMOS_USO_APP, TERMOS_ENTERPRISE, POLITICA_PRIVACIDADE, CONSENTIMENTO_CLIENTE, COMUNICACAO_MARKETING]
        versao: { type: string }
        titulo: { type: string }
        conteudo: { type: string }
        dataVigencia: { type: string, format: date }
        obrigatorio: { type: boolean }
    Consentimento:
      type: object
      properties:
        termoId: { type: string, format: uuid }
        tipo: { type: string }
        meioColeta: { type: string, enum: [ACEITE_NO_APP, ASSINATURA_PRESENCIAL, LINK_DIGITAL] }
        titulo: { type: string }
        versao: { type: string }
        obrigatorio: { type: boolean }
        aceito: { type: boolean }
        dataAceite: { type: string, format: date-time }
    LogAuditoria:
      type: object
      properties:
        dataHora: { type: string, format: date-time }
        acao: { type: string }
        entidade: { type: string }
        entidadeId: { type: string }
        nivel: { type: string, enum: [INFO, ALERTA, CRITICO] }
        autorId: { type: string, format: uuid }
