      tags: [Financeiro]
      summary: Registrar despesa (UC-06)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DespesaEntrada' }
      responses:
        '201':
          description: Despesa registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Despesa' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /relatorios/despesas:
    get:
      tags: [Financeiro]
      summary: Emitir relatório de despesas (UC-07)
      parameters:
        - in: query
          name: petId
          schema: { type: string, format: uuid }
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Relatório em JSON ou PDF (RN11), conforme o cabeçalho Accept. Sem `petId`, junta todos os pets de que o tutor é responsável.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatorioDespesas' }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '404':
          description: "Pet não encontrado, ou não há despesas no período (código RN11_SEM_DADOS, CT-07-02)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }

  /empresas:
