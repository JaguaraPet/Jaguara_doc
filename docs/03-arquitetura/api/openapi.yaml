                recursoId: { type: string, format: uuid }
      responses:
        '200':
          description: Agendamento remarcado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '409': { $ref: '#/components/responses/Conflito' }
  /agendamentos/{agendamentoId}/cancelamento:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Cancelar agendamento (UC-24)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string }
      responses:
        '204': { description: "Agendamento CANCELADO." }
  /agendamentos/{agendamentoId}/atendimento:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    get:
      tags: [Atendimentos]
      summary: Consultar o atendimento de um agendamento (UC-23)
      responses:
        '200':
          description: Atendimento com os itens cobrados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Atendimentos]
      summary: Registrar serviços e atendimento (UC-23)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtendimentoEntrada' }
      responses:
        '201':
          description: Atendimento FINALIZADO com itens pelo preço contratado (RN27).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: Atendimento já registrado (ATENDIMENTO_JA_REGISTRADO), agendamento inativo ou ainda não ocorrido (AGENDAMENTO_NAO_OCORREU).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /atendimentos/{atendimentoId}:
    parameters:
      - in: path
        name: atendimentoId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Atendimentos]
      summary: Alterar atendimento finalizado com auditoria (RN28)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justificativa]
              properties:
                observacoesClinicas: { type: string }
                procedimentosRealizados: { type: string }
                justificativa: { type: string, minLength: 10 }
      responses:
        '200':
          description: Atendimento alterado e auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }

  /empresas/{empresaId}/funcionarios:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Listar funcionários (UC-19)
      responses:
        '200':
          description: Funcionários da empresa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Funcionario' }
    post:
      tags: [Empresa]
      summary: Cadastrar funcionário (UC-19)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, cpf, email, perfilId]
              properties:
                nome: { type: string }
                cpf: { type: string, pattern: '^[0-9]{11}$' }
                email: { type: string, format: email }
                cargo: { type: string }
                perfilId: { type: string, format: uuid }
      responses:
        '201':
          description: Funcionário criado; ativo após confirmar o e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcionario' }
        '409': { $ref: '#/components/responses/Conflito' }
  /funcionarios/{funcionarioId}:
    parameters:
      - in: path
        name: funcionarioId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Empresa]
      summary: Alterar perfil de acesso do funcionário (UC-16)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perfilId]
              properties:
                perfilId: { type: string, format: uuid }
      responses:
        '200':
          description: Perfil alterado com efeito imediato (RN20).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcionario' }
    delete:
      tags: [Empresa]
      summary: Remover funcionário e revogar acessos (RN23)
      responses:
        '204': { description: "Funcionário removido." }
  /empresas/{empresaId}/clientes:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Listar clientes (UC-21)
      responses:
        '200':
          description: Clientes da empresa, com a situação do consentimento (RN41).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Cliente' }
    post:
      tags: [Empresa]
      summary: Cadastrar cliente (UC-21)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, meioConsentimento]
              properties:
                nome: { type: string, maxLength: 255 }
                cpf: { type: string, maxLength: 14 }
                telefone: { type: string, maxLength: 20 }
                email:
                  type: string
                  format: email
                  description: Contato do cliente. Se houver conta de tutor com este e-mail ou com o CPF, o cadastro fica ligado a ela (ADR-010).
                observacoes: { type: string }
                meioConsentimento:
                  type: string
                  enum: [ASSINATURA_PRESENCIAL, LINK_DIGITAL]
                  description: Como o consentimento no termo vigente (JUR-04) é coletado (RN41).
                evidenciaArquivoUrl:
                  type: string
                  format: uri
                  description: Cópia digitalizada do termo assinado, enviada por URL assinada. Obrigatória com ASSINATURA_PRESENCIAL.
      responses:
        '201':
          description: >-
            Cliente cadastrado. Com ASSINATURA_PRESENCIAL o consentimento já fica vigente; com LINK_DIGITAL
            o link é enviado ao contato do cliente e o cadastro fica pendente, só com nome e contato,
            por até 7 dias (RN41).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/clientes/{clienteId}/pets:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - in: path
        name: clienteId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Empresa]
      summary: Cadastrar pet de cliente sem conta (UC-21, ADR-010)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '201':
          description: Pet ligado ao cliente; passa para o tutor quando o cliente cria a conta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/clientes/{clienteId}/consentimento/revogacao:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - in: path
        name: clienteId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Empresa]
      summary: Registrar a revogação pedida pelo cliente (UC-21, RN41)
      responses:
        '204': { description: "Consentimento revogado; cliente inativado e dados anonimizados, exceto o exigido por lei." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /empresas/{empresaId}/pets-vinculados:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Consultar pets vinculados (UC-20, RN24)
      responses:
        '200':
          description: Pets com agendamento ou compartilhamento ativo e pets de clientes sem conta.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
  /empresas/{empresaId}/indicadores:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Emitir BI (UC-17, RN21)
      parameters:
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Indicadores da própria empresa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  atendimentos: { type: integer }
                  faturamento: { type: number }
                  taxaAceite: { type: number }
                  servicosMaisSolicitados:
                    type: array
                    items:
                      type: object
                      properties:
                        servico: { type: string }
                        quantidade: { type: integer }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /pagamentos:
    get:
      tags: [Financeiro]
      summary: Gerenciar pagamentos (UC-45)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusPagamento' }
        - in: query
          name: de
          schema: { type: string, format: date }
        - in: query
          name: ate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Pagamentos realizados (tutor) ou recebidos (empresa).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pagamento' }
    post:
      tags: [Financeiro]
      summary: Realizar pagamento (UC-44)
      description: |
        O pagamento nasce PENDENTE com o preço contratado (RN27) e só fica ACEITO pela
        confirmação do gateway (RN39). Com PIX, a resposta traz o `qrCode`; com cartão, o app
        manda só o token gerado pelo formulário seguro do gateway, nunca os dados do cartão.
        Cartão recusado responde 201 com status RECUSADO e `motivoRecusa`, para o tutor tentar
        outro meio (UC-44, FA1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metodo]
              properties:
                agendamentoId: { type: string, format: uuid }
                assinaturaId: { type: string, format: uuid }
                metodo: { $ref: '#/components/schemas/MetodoPagamento' }
                tokenCartao:
                  type: string
                  maxLength: 255
                  description: Token do cartão gerado no app pelo gateway. Obrigatório para cartão.
                bandeiraCartao:
                  type: string
                  maxLength: 50
                  description: Meio informado pelo gateway (ex. visa, master, debvisa). Obrigatório para cartão.
                parcelas: { type: integer, minimum: 1, maximum: 12, default: 1 }
              oneOf:
                - required: [agendamentoId]
                - required: [assinaturaId]
      responses:
        '201':
          description: Pagamento PENDENTE com dados de cobrança, ou o resultado do cartão (RN39).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pagamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
        '503':
          description: Gateway indisponível (GATEWAY_INDISPONIVEL); nada foi cobrado e o tutor tenta de novo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /pagamentos/{pagamentoId}/reembolsos:
    parameters:
      - in: path
        name: pagamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Financeiro]
      summary: Solicitar reembolso (UC-45)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        '201': { description: "Reembolso EM_ANALISE." }
        '409': { $ref: '#/components/responses/Conflito' }

  /conversas:
    get:
      tags: [Comunicação]
      summary: Listar conversas (UC-43)
      responses:
        '200':
          description: Conversas do usuário.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversa' }
    post:
      tags: [Comunicação]
      summary: Iniciar conversa com empresa ou assistente (UC-43)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { $ref: '#/components/schemas/TipoConversa' }
                empresaId: { type: string, format: uuid }
                petId: { type: string, format: uuid }
      responses:
        '201':
          description: Conversa criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversa' }
        '402':
          description: Assistente exige assinatura PANTERA ativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /conversas/{conversaId}/mensagens:
    parameters:
      - in: path
        name: conversaId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Comunicação]
      summary: Histórico da conversa, do mais novo para o mais antigo (UC-43)
      description: Devolve até 50 mensagens e marca como lidas as mensagens dos outros participantes.
      parameters:
        - in: query
          name: antes
          description: Só mensagens enviadas antes deste instante (página anterior).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Mensagens da conversa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mensagem' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Comunicação]
      summary: Enviar mensagem (também disponível por WebSocket)
      description: |
        Na conversa com o assistente virtual, a resposta chega depois pelo evento `mensagem:nova`,
        com `remetenteId` nulo. O assistente exige o PANTERA ativo e tem limite diário de mensagens
        por assinante (ARQ-03, seção 3.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conteudo]
              properties:
                conteudo: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Mensagem registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensagem' }
        '402':
          description: Assistente exige assinatura PANTERA ativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
        '429':
          description: Limite diário de mensagens do assistente atingido (ASSISTENTE_LIMITE_DIARIO).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /conversas/{conversaId}/encerramento:
    parameters:
      - in: path
        name: conversaId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Comunicação]
      summary: Encerrar a conversa (UC-43, passos 6 e 7)
      description: Só o tutor encerra. A conversa fica arquivada e não recebe novas mensagens.
      responses:
        '204': { description: "Conversa encerrada." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /privacidade/consentimentos:
    get:
      tags: [Privacidade]
      summary: Consultar consentimentos (UC-46)
      responses:
        '200':
          description: Termos vigentes e consentimentos do usuário.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimento' }
    put:
      tags: [Privacidade]
      summary: Atualizar consentimentos opcionais (UC-46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [termoId, aceito]
                properties:
                  termoId: { type: string, format: uuid }
                  aceito: { type: boolean }
      responses:
        '204': { description: "Consentimentos atualizados e auditados." }
        '409':
          description: Termo obrigatório não pode ser revogado sem excluir a conta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /termos/vigentes:
    get:
      tags: [Privacidade]
      summary: Consultar as versões vigentes dos termos (RN42)
      security: []
      parameters:
        - in: query
          name: tipo
          schema:
            type: string
            enum: [TERMOS_USO_APP, TERMOS_ENTERPRISE, POLITICA_PRIVACIDADE, CONSENTIMENTO_CLIENTE, COMUNICACAO_MARKETING]
      responses:
        '200':
          description: Termos vigentes, para exibir no cadastro e na página pública.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Termo' }
  /consentimentos-clientes/{token}:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    get:
      tags: [Privacidade]
      summary: Abrir o termo enviado ao cliente sem conta (UC-21, RN41)
      security: []
      responses:
        '200':
          description: Texto do termo, dados da empresa controladora e situação do consentimento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa: { type: string }
                  termo: { $ref: '#/components/schemas/Termo' }
                  situacao: { type: string, enum: [PENDENTE, VIGENTE, REVOGADO] }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '410': { $ref: '#/components/responses/Expirado' }
  /consentimentos-clientes/{token}/aceite:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    post:
      tags: [Privacidade]
      summary: Aceitar o termo pelo link (UC-21, RN41)
      security: []
      responses:
        '204': { description: "Consentimento registrado com data, hora, IP e versão; comprovante enviado ao cliente." }
        '410': { $ref: '#/components/responses/Expirado' }
  /consentimentos-clientes/{token}/revogacao:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    post:
      tags: [Privacidade]
      summary: Revogar o consentimento pelo link do comprovante, sem conta (UC-21, RN41)
      security: []
      responses:
        '204': { description: "Consentimento revogado; a empresa é avisada." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /privacidade/solicitacoes:
    post:
      tags: [Privacidade]
      summary: Solicitar exportação, correção ou exclusão de dados (UC-46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo:
                  type: string
                  enum: [EXPORTACAO_DADOS, EXCLUSAO_DADOS, CORRECAO_DADOS]
                senha:
                  type: string
                  format: password
                  description: Obrigatória para exclusão.
      responses:
        '202': { description: "Pedido registrado; resposta em até 15 dias." }

  /admin/usuarios/{usuarioId}/status:
    parameters:
      - in: path
        name: usuarioId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Administração]
      summary: Bloquear, suspender ou reativar conta (UC-28)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, motivo]
              properties:
                status:
                  type: string
                  enum: [ATIVA, BLOQUEADA, SUSPENSA]
                motivo: { type: string }
      responses:
        '204': { description: "Status alterado e auditado (RN34)." }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /admin/logs:
    get:
      tags: [Administração]
      summary: Monitorar logs (UC-25)
      parameters:
        - in: query
          name: nivel
          schema:
            type: string
            enum: [INFO, ALERTA, CRITICO]
        - in: query
          name: de
          schema: { type: string, format: date-time }
        - in: query
          name: ate
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Registros de auditoria.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogAuditoria' }
  /admin/webhooks:
    post:
      tags: [Administração]
      summary: Cadastrar webhook (UC-30)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventos, metodoAutenticacao]
              properties:
                url: { type: string, format: uri, pattern: '^https://' }
                eventos:
                  type: array
                  minItems: 1
                  items: { type: string }
                metodoAutenticacao:
                  type: string
                  enum: [HMAC_SHA256]
      responses:
        '201': { description: "Webhook salvo (RN36)." }
        '422': { $ref: '#/components/responses/Validacao' }
  /webhooks/pagamentos:
    post:
      tags: [Webhooks]
      summary: Receber eventos do gateway de pagamento
      description: |
        Formato do Mercado Pago. A assinatura `X-Signature` (`ts=...,v1=...`, HMAC-SHA256 de
        `id:<data.id>;request-id:<X-Request-Id>;ts:<ts>;`) é conferida antes de tudo (RN36). O
        status vem de nova consulta ao gateway, nunca do corpo, e eventos repetidos não mudam
        nada (idempotente).
      security: []
      parameters:
        - in: header
          name: X-Signature
          required: true
          schema: { type: string }
        - in: header
          name: X-Request-Id
          required: true
          schema: { type: string }
        - in: query
          name: data.id
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, example: payment }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: "Evento processado." }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /health:
    get:
      tags: [Administração]
      summary: Verificação de saúde
      security: []
      responses:
        '200':
          description: API, banco e Redis disponíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PetId:
      in: path
      name: petId
      required: true
      schema: { type: string, format: uuid }
    EmpresaId:
      in: path
      name: empresaId
      required: true
      schema: { type: string, format: uuid }
    SolicitacaoId:
      in: path
      name: solicitacaoId
      required: true
      schema: { type: string, format: uuid }
    AgendamentoId:
      in: path
      name: agendamentoId
      required: true
      schema: { type: string, format: uuid }
    TokenLink:
      in: path
      name: token
      required: true
      description: Token do link de aceite e de revogação enviado ao cliente sem conta (RN41).
      schema: { type: string, minLength: 32 }
    Pagina:
      in: query
      name: pagina
      schema: { type: integer, minimum: 1, default: 1 }
    Tamanho:
      in: query
      name: tamanho
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    NaoAutenticado:
      description: Não autenticado ou sessão expirada (RN04).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SemPermissao:
      description: Sem permissão para o recurso (RN20, RN24, RN26).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflito:
      description: Conflito de regra de negócio (ex. RN01, RN08, RN14, RN29) ou transição de estado inválida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Validacao:
      description: Dados inválidos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Expirado:
      description: Token expirado ou já utilizado (RN05).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
  schemas:
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          description: Código de negócio, por exemplo RN14_CONFLITO_AGENDA.
        campos:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensagem: { type: string }
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiraEm]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEm: { type: string, format: date-time }
    Endereco:
      type: object
      required: [cep, logradouro, numero, bairro, cidade, uf]
      properties:
        cep: { type: string, pattern: '^[0-9]{8}$' }
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string, pattern: '^[A-Z]{2}$' }
    CadastroTutor:
      type: object
      required: [nome, cpf, email, senha, aceiteTermos]
      properties:
        nome: { type: string }
        cpf: { type: string, pattern: '^[0-9]{11}$' }
        email: { type: string, format: email }
        telefone: { type: string }
        senha: { type: string, format: password, minLength: 8 }
        aceiteTermos:
          type: boolean
          const: true
          description: Aceite das versões vigentes dos termos de uso do app e da política de privacidade (RN42).
    CadastroEmpresa:
      type: object
      required: [cnpj, razaoSocial, nomeFantasia, tipo, email, senha, endereco, aceiteTermos]
      properties:
        cnpj: { type: string, pattern: '^[0-9]{14}$' }
        razaoSocial: { type: string }
        nomeFantasia: { type: string }
        tipo:
          type: string
          enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO]
        email: { type: string, format: email }
        senha: { type: string, format: password, minLength: 8 }
        endereco: { $ref: '#/components/schemas/Endereco' }
        aceiteTermos:
          type: boolean
          const: true
          description: Aceite das versões vigentes dos termos da Enterprise e da política de privacidade (RN42).
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [PENDENTE_CONFIRMACAO, ATIVA, BLOQUEADA, SUSPENSA, INATIVA]
        perfil: { type: string }
    StatusPet:
      type: string
      enum: [ATIVO, ARQUIVADO, FALECIDO]
    TipoResponsavel:
      type: string
      enum: [PRINCIPAL, ADICIONAL]
    TipoDocumento:
      type: string
      enum: [RG_ANIMAL, CARTEIRA_VACINACAO, ATESTADO, RECEITA, LAUDO, PEDIGREE, OUTRO]
    PetEntrada:
      type: object
      required: [nome, racaId, sexo, castrado]
      properties:
        nome: { type: string }
        racaId: { type: string, format: uuid }
        dataNascimento: { type: string, format: date }
        sexo: { type: string, enum: [MACHO, FEMEA] }
        pesoKg: { type: number, exclusiveMinimum: 0 }
        cor: { type: string }
        microchip: { type: string }
        castrado: { type: boolean }
    Pet:
      allOf:
        - $ref: '#/components/schemas/PetEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            especie: { type: string }
            raca: { type: string }
            idade: { type: integer }
            status: { $ref: '#/components/schemas/StatusPet' }
            fotoUrl: { type: string, format: uri }
    PaginaPets:
      type: object
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Pet' }
        total: { type: integer }
        pagina: { type: integer }
    CompartilhamentoEntrada:
      type: object
      required: [escopos]
      properties:
        destinatarioEmail: { type: string, format: email }
        empresaId: { type: string, format: uuid }
        escopos:
          type: array
          minItems: 1
          items:
            type: string
            enum: [PERFIL_BASICO, VACINAS, EXAMES, MEDICAMENTOS, ALERGIAS, DOCUMENTOS, LINHA_DO_TEMPO, EDICAO_CLINICA]
        dataExpiracao: { type: string, format: date-time }
    Compartilhamento:
      allOf:
        - $ref: '#/components/schemas/CompartilhamentoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [ATIVO, REVOGADO, EXPIRADO] }
            link: { type: string, format: uri }
    VacinacaoEntrada:
      type: object
      required: [nomeVacina, dataAplicacao, responsavelAplicacao]
      properties:
        nomeVacina: { type: string }
        fabricante: { type: string }
        lote: { type: string }
        dataAplicacao: { type: string, format: date }
        dataProximaDose:
          type: string
          format: date
          description: Agenda o lembrete aos responsáveis às 9h do dia anterior (RN37).
        responsavelAplicacao: { type: string, minLength: 1 }
        observacoes: { type: string, maxLength: 2000 }
    Vacinacao:
      allOf:
        - $ref: '#/components/schemas/VacinacaoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            valido: { type: boolean }
    TratamentoEntrada:
      type: object
      required: [medicamento, dosagem, viaAdministracao, intervaloHoras, dataInicio]
      properties:
        medicamento: { type: string }
        dosagem: { type: string }
        viaAdministracao: { type: string }
        intervaloHoras: { type: integer, minimum: 1, maximum: 720 }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        horaPrimeiraDose:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          default: '08:00'
          description: Hora da primeira dose, em Brasília.
        observacoes: { type: string, maxLength: 2000 }
    Tratamento:
      type: object
      properties:
        id: { type: string, format: uuid }
        medicamento: { type: string }
        dosagem: { type: string }
        viaAdministracao: { type: string }
        intervaloHoras: { type: integer }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        status: { type: string, enum: [ATIVO, FINALIZADO, SUSPENSO] }
        observacoes: { type: string }
        lembretesAgendados:
          type: integer
          description: Só na resposta do cadastro.
    ExameEntrada:
      type: object
      required: [tipoExame, dataRealizacao]
      properties:
        tipoExame: { type: string }
        dataRealizacao: { type: string, format: date }
        laboratorio: { type: string }
        resultado: { type: string }
        documentoId:
          type: string
          format: uuid
          description: Documento do próprio pet usado como laudo (UC-34).
        observacoes: { type: string, maxLength: 2000 }
    Exame:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipoExame: { type: string }
        dataRealizacao: { type: string, format: date }
        laboratorio: { type: string }
        resultado: { type: string }
        documentoId: { type: string, format: uuid }
        temArquivo:
          type: boolean
          description: Há laudo anexado; o arquivo sai só por URL assinada (ARQ-03, seção 3.6).
        observacoes: { type: string }
    AlergiaEntrada:
      type: object
      required: [tipo, descricao, gravidade]
      properties:
        tipo: { type: string, enum: [ALERGIA, RESTRICAO_ALIMENTAR, RESTRICAO_MEDICAMENTOSA, OUTRA] }
        descricao: { type: string }
        gravidade: { type: string, enum: [LEVE, MODERADA, GRAVE] }
        dataIdentificacao: { type: string, format: date }
    ItemLinhaDoTempo:
      type: object
      properties:
        data: { type: string, format: date-time }
        tipo: { type: string, enum: [VACINACAO, EXAME, TRATAMENTO, EVENTO, ATENDIMENTO] }
        titulo: { type: string }
        referenciaId: { type: string, format: uuid }
    EventoEntrada:
      type: object
      required: [titulo, tipo, dataHoraInicio]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        tipo:
          type: string
          enum: [CONSULTA, VACINA, MEDICAMENTO, EXAME, CIRURGIA, BANHO_TOSA, HOSPEDAGEM, COMPROMISSO, OUTRO]
        dataHoraInicio: { type: string, format: date-time }
        dataHoraFim: { type: string, format: date-time }
        local: { type: string }
    Evento:
      allOf:
        - $ref: '#/components/schemas/EventoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            origem: { type: string, enum: [MANUAL, AGENDAMENTO, CALENDARIO_EXTERNO] }
    DespesaEntrada:
      type: object
      required: [descricao, valor, data, categoriaId]
      properties:
        descricao: { type: string }
        valor: { type: number, exclusiveMinimum: 0 }
        data: { type: string, format: date }
        categoriaId: { type: string, format: uuid }
    Despesa:
      allOf:
        - $ref: '#/components/schemas/DespesaEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            categoria: { type: string }
    ServicoEntrada:
      type: object
      required: [nome, descricao, categoria, preco, duracaoMinutos]
      properties:
        nome: { type: string }
        descricao: { type: string }
        categoria:
          type: string
          enum: [CONSULTA, EXAME, CIRURGIA, VACINACAO, BANHO_TOSA, HOSPEDAGEM, PET_SITTER, CRECHE, OUTRO]
        preco: { type: number, minimum: 0 }
        duracaoMinutos: { type: integer, minimum: 5 }
        ativo: { type: boolean, default: true }
    Servico:
      allOf:
        - $ref: '#/components/schemas/ServicoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
    EmpresaPublica:
      type: object
      properties:
        id: { type: string, format: uuid }
        nomeFantasia: { type: string }
        tipo:
          type: string
          enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO]
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string }
        categorias:
          type: array
          description: Categorias dos serviços ativos.
          items: { type: string }
    PaginaEmpresas:
      type: object
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/EmpresaPublica' }
        total: { type: integer }
        pagina: { type: integer }
        tamanho: { type: integer }
    Cliente:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nome: { type: string }
        cpf: { type: string, description: CPF mascarado (ARQ-02). }
        telefone: { type: string }
        email: { type: string, format: email }
        possuiConta: { type: boolean, description: Ligado a uma conta de tutor (ADR-010). }
        ativo: { type: boolean }
        consentimento:
          type: string
          enum: [PENDENTE, VIGENTE, REVOGADO]
        linkTermo:
          type: string
          format: uri
          description: Link do termo para o cliente aceitar (só enquanto pendente).
    Especie:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        racas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              nome: { type: string }
    HorarioAtuacao:
      allOf:
        - $ref: '#/components/schemas/HorarioAtuacaoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
    RecursoEntrada:
      type: object
      required: [nome, tipo]
      properties:
        nome: { type: string }
        tipo:
          type: string
          enum: [SALA, EQUIPAMENTO, BAIA, VEICULO, OUTRO]
        ativo: { type: boolean, default: true }
    Recurso:
      allOf:
        - $ref: '#/components/schemas/RecursoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
    HorarioAtuacaoEntrada:
      type: object
      required: [diaSemana, horaInicio, horaFim]
      properties:
        diaSemana:
          type: string
          enum: [SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO, DOMINGO]
        horaInicio: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        horaFim: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        funcionarioId: { type: string, format: uuid }
        recursoId: { type: string, format: uuid }
      oneOf:
        - required: [funcionarioId]
        - required: [recursoId]
    StatusSolicitacao:
      type: string
      enum: [PENDENTE, ACEITA, RECUSADA, CANCELADA, CONCLUIDA, ENCERRADA]
    Solicitacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        servicoId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        tutorId: { type: string, format: uuid }
        dataHoraDesejada: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/StatusSolicitacao' }
        motivoRecusa: { type: string }
    HistoricoSolicitacao:
      type: object
      properties:
        dataHora: { type: string, format: date-time }
        statusAnterior: { $ref: '#/components/schemas/StatusSolicitacao' }
        statusNovo: { $ref: '#/components/schemas/StatusSolicitacao' }
        autor: { type: string }
        descricao: { type: string }
    AgendamentoEntrada:
      type: object
      required: [servicoId, petId, dataHoraInicio]
      properties:
        servicoId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        dataHoraInicio: { type: string, format: date-time }
        profissionalId: { type: string, format: uuid }
        recursoId: { type: string, format: uuid }
    Agendamento:
      allOf:
        - $ref: '#/components/schemas/AgendamentoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            dataHoraFim: { type: string, format: date-time }
            precoContratado:
              type: number
              description: Congelado na criação (RN27).
            status:
              type: string
              enum: [AGENDADO, CANCELADO, REALIZADO, NAO_COMPARECEU]
    AtendimentoEntrada:
      type: object
      required: [procedimentosRealizados, itens]
      properties:
        procedimentosRealizados: { type: string }
        observacoesClinicas: { type: string }
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [servicoId, quantidade]
            properties:
              servicoId: { type: string, format: uuid }
              quantidade: { type: integer, minimum: 1 }
              observacao: { type: string }
    Atendimento:
      type: object
      properties:
        id: { type: string, format: uuid }
        agendamentoId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        status: { type: string, enum: [EM_ANDAMENTO, FINALIZADO] }
        procedimentosRealizados: { type: string }
        observacoesClinicas: { type: string }
        total: { type: number }
        finalizadoEm: { type: string, format: date-time }
        itens:
          type: array
          items:
            type: object
            properties:
              servicoId: { type: string, format: uuid }
              quantidade: { type: integer }
              valorUnitario:
                type: number
                description: Preço contratado para o serviço agendado (RN27); preço atual para extras.
              observacao: { type: string }
    Funcionario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        cargo: { type: string }
        perfil: { type: string }
        ativo: { type: boolean }
    MetodoPagamento:
      type: string
      enum: [CARTAO_CREDITO, CARTAO_DEBITO, PIX, BOLETO]
    StatusPagamento:
      type: string
      enum: [PENDENTE, ACEITO, CANCELADO, RECUSADO]
    Pagamento:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigoTransacao: { type: string }
        valor: { type: number }
        dataHora: { type: string, format: date-time }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        status: { $ref: '#/components/schemas/StatusPagamento' }
        dataConfirmacao: { type: string, format: date-time }
        agendamentoId: { type: string, format: uuid }
        qrCode:
          type: string
          description: PIX copia e cola, só na resposta da criação.
        motivoRecusa:
          type: string
          description: Motivo da recusa em linguagem do tutor, só quando RECUSADO.
        notaFiscalUrl: { type: string, format: uri }
    TipoConversa:
      type: string
      enum: [EMPRESA, ASSISTENTE_VIRTUAL]
    Conversa:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoConversa' }
        empresaId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        status: { type: string, enum: [ABERTA, ENCERRADA] }
    Mensagem:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversaId: { type: string, format: uuid }
        conteudo: { type: string }
        dataHoraEnvio: { type: string, format: date-time }
        remetenteId:
          type: [string, 'null']
          format: uuid
          description: Nulo quando a mensagem é do assistente virtual.
        lida: { type: boolean }
    Termo:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [TERMOS_USO_APP, TERMOS_ENTERPRISE, POLITICA_PRIVACIDADE, CONSENTIMENTO_CLIENTE, COMUNICACAO_MARKETING]
        versao: { type: string }
        titulo: { type: string }
        conteudo: { type: string }
        dataVigencia: { type: string, format: date }
        obrigatorio: { type: boolean }
    Consentimento:
      type: object
      properties:
        termoId: { type: string, format: uuid }
        tipo: { type: string }
        meioColeta: { type: string, enum: [ACEITE_NO_APP, ASSINATURA_PRESENCIAL, LINK_DIGITAL] }
        titulo: { type: string }
        versao: { type: string }
        obrigatorio: { type: boolean }
        aceito: { type: boolean }
        dataAceite: { type: string, format: date-time }
    LogAuditoria:
      type: object
      properties:
        dataHora: { type: string, format: date-time }
        acao: { type: string }
        entidade: { type: string }
        entidadeId: { type: string }
        nivel: { type: string, enum: [INFO, ALERTA, CRITICO] }
        autorId: { type: string, format: uuid }
