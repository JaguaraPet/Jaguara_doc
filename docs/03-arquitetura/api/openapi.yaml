        '403': { $ref: '#/components/responses/SemPermissao' }
  /empresas/{empresaId}/relatorios/{tipo}:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - in: path
        name: tipo
        required: true
        description: "`atendimentos` (operacional) ou `financeiro` (gerencial, exige também financeiro:ler)."
        schema: { type: string, enum: [atendimentos, financeiro] }
    get:
      tags: [Empresa]
      summary: Emitir relatórios (UC-18, RN22)
      parameters:
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: "Relatório da própria empresa em JSON, ou PDF com `Accept: application/pdf`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RelatorioAtendimentos'
                  - $ref: '#/components/schemas/RelatorioFinanceiro'
                discriminator:
                  propertyName: tipo
                  mapping:
                    atendimentos: '#/components/schemas/RelatorioAtendimentos'
                    financeiro: '#/components/schemas/RelatorioFinanceiro'
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/indicadores:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Emitir BI (UC-17, RN21)
      parameters:
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: "Indicadores só da própria empresa, em período de até um ano: atendimentos realizados, faturamento confirmado, taxa de aceite das solicitações respondidas (%), os cinco serviços mais pedidos e os atendimentos por dia."
          content:
            application/json:
              schema:
                type: object
                required: [de, ate, atendimentos, faturamento, taxaAceite, solicitacoes, servicosMaisSolicitados, atendimentosPorDia]
                properties:
                  de: { type: string, format: date }
                  ate: { type: string, format: date }
                  atendimentos: { type: integer }
                  faturamento: { type: number }
                  taxaAceite: { type: number }
                  solicitacoes: { type: integer }
                  servicosMaisSolicitados:
                    type: array
                    items:
                      type: object
                      required: [servico, quantidade]
                      properties:
                        servico: { type: string }
                        quantidade: { type: integer }
                  atendimentosPorDia:
                    type: array
                    items:
                      type: object
                      required: [data, quantidade]
                      properties:
                        data: { type: string, format: date }
                        quantidade: { type: integer }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }

  /pagamentos:
    get:
      tags: [Financeiro]
      summary: Gerenciar pagamentos (UC-45)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusPagamento' }
        - in: query
          name: de
          schema: { type: string, format: date }
        - in: query
          name: ate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Pagamentos realizados (tutor) ou recebidos (empresa).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pagamento' }
    post:
      tags: [Financeiro]
      summary: Realizar pagamento (UC-44)
      description: |
        O pagamento nasce PENDENTE com o preço contratado (RN27) e só fica ACEITO pela
        confirmação do gateway (RN39). Com PIX, a resposta traz o `qrCode`; com boleto, traz o
        `boleto` (link, linha digitável e vencimento em 3 dias) e, enquanto ele estiver em aberto,
        um novo pedido devolve o mesmo boleto. O boleto registrado exige o endereço do pagador:
        o informado em `endereco` fica guardado para os próximos. Com cartão, o app
        manda só o token gerado pelo formulário seguro do gateway, nunca os dados do cartão.
        Cartão recusado responde 201 com status RECUSADO e `motivoRecusa`, para o tutor tentar
        outro meio (UC-44, FA1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metodo]
              properties:
                agendamentoId: { type: string, format: uuid }
                assinaturaId: { type: string, format: uuid }
                metodo: { $ref: '#/components/schemas/MetodoPagamento' }
                tokenCartao:
                  type: string
                  maxLength: 255
                  description: Token do cartão gerado no app pelo gateway. Obrigatório para cartão.
                bandeiraCartao:
                  type: string
                  maxLength: 50
                  description: Meio informado pelo gateway (ex. visa, master, debvisa). Obrigatório para cartão.
                parcelas: { type: integer, minimum: 1, maximum: 12, default: 1 }
                endereco:
                  $ref: '#/components/schemas/Endereco'
                  description: Endereço do pagador para o boleto. Sem ele, vale o último informado.
              oneOf:
                - required: [agendamentoId]
                - required: [assinaturaId]
      responses:
        '201':
          description: Pagamento PENDENTE com dados de cobrança, ou o resultado do cartão (RN39).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pagamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
        '503':
          description: Gateway indisponível (GATEWAY_INDISPONIVEL); nada foi cobrado e o tutor tenta de novo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /assinaturas/atual:
    get:
      tags: [Financeiro]
      summary: Ver o plano do tutor (gratuito ou PANTERA)
      responses:
        '200':
          description: Plano vigente, a assinatura vigente ou pendente e o preço mensal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plano: { type: string, enum: [GRATUITO, PANTERA] }
                  vigente: { type: boolean }
                  assinatura: { $ref: '#/components/schemas/Assinatura' }
                  precoMensal: { type: number }
  /assinaturas:
    post:
      tags: [Financeiro]
      summary: Assinar o PANTERA (UC-43, FA1)
      description: |
        Cria a assinatura PENDENTE de um mês (ou devolve a que já está pendente). Pague com
        POST /pagamentos e `assinaturaId`; ela vira ATIVA só com o pagamento confirmado (RN39).
      responses:
        '201':
          description: Assinatura pendente de pagamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assinatura' }
  /assinaturas/atual/cancelamento:
    post:
      tags: [Financeiro]
      summary: Cancelar a assinatura PANTERA
      description: O acesso continua até o fim do período já pago.
      responses:
        '201':
          description: Assinatura cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assinatura' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pagamentos/{pagamentoId}/reembolsos:
    parameters:
      - in: path
        name: pagamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Financeiro]
      summary: Solicitar reembolso (UC-45)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        '201': { description: "Reembolso EM_ANALISE." }
        '409': { $ref: '#/components/responses/Conflito' }

  /conversas:
    get:
      tags: [Comunicação]
      summary: Listar conversas (UC-43)
      responses:
        '200':
          description: Conversas do usuário.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversa' }
    post:
      tags: [Comunicação]
      summary: Iniciar conversa com empresa ou assistente (UC-43)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { $ref: '#/components/schemas/TipoConversa' }
                empresaId: { type: string, format: uuid }
                petId: { type: string, format: uuid }
      responses:
        '201':
          description: Conversa criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversa' }
        '402':
          description: Assistente exige assinatura PANTERA ativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /conversas/{conversaId}/mensagens:
    parameters:
      - in: path
        name: conversaId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Comunicação]
      summary: Histórico da conversa, do mais novo para o mais antigo (UC-43)
      description: Devolve até 50 mensagens e marca como lidas as mensagens dos outros participantes.
      parameters:
        - in: query
          name: antes
          description: Só mensagens enviadas antes deste instante (página anterior).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Mensagens da conversa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mensagem' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Comunicação]
      summary: Enviar mensagem (também disponível por WebSocket)
      description: |
        Na conversa com o assistente virtual, a resposta chega depois pelo evento `mensagem:nova`,
        com `remetenteId` nulo. O assistente exige o PANTERA ativo e tem limite diário de mensagens
        por assinante (ARQ-03, seção 3.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conteudo]
              properties:
                conteudo: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Mensagem registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensagem' }
        '402':
          description: Assistente exige assinatura PANTERA ativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
        '429':
          description: Limite diário de mensagens do assistente atingido (ASSISTENTE_LIMITE_DIARIO).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /conversas/{conversaId}/encerramento:
    parameters:
      - in: path
        name: conversaId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Comunicação]
      summary: Encerrar a conversa (UC-43, passos 6 e 7)
      description: Só o tutor encerra. A conversa fica arquivada e não recebe novas mensagens.
      responses:
        '204': { description: "Conversa encerrada." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /privacidade/consentimentos:
    get:
      tags: [Privacidade]
      summary: Consultar consentimentos (UC-46)
      responses:
        '200':
          description: Termos vigentes e consentimentos do usuário.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimento' }
    put:
      tags: [Privacidade]
      summary: Atualizar consentimentos opcionais (UC-46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [termoId, aceito]
                properties:
                  termoId: { type: string, format: uuid }
                  aceito: { type: boolean }
      responses:
        '204': { description: "Consentimentos atualizados e auditados." }
        '409':
          description: Termo obrigatório não pode ser revogado sem excluir a conta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /termos/vigentes:
    get:
      tags: [Privacidade]
      summary: Consultar as versões vigentes dos termos (RN42)
      security: []
      parameters:
        - in: query
          name: tipo
          schema:
            type: string
            enum: [TERMOS_USO_APP, TERMOS_ENTERPRISE, POLITICA_PRIVACIDADE, CONSENTIMENTO_CLIENTE, COMUNICACAO_MARKETING]
      responses:
        '200':
          description: Termos vigentes, para exibir no cadastro e na página pública.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Termo' }
  /consentimentos-clientes/{token}:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    get:
      tags: [Privacidade]
      summary: Abrir o termo enviado ao cliente sem conta (UC-21, RN41)
      security: []
      responses:
        '200':
          description: Texto do termo, dados da empresa controladora e situação do consentimento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa: { type: string }
                  termo: { $ref: '#/components/schemas/Termo' }
                  situacao: { type: string, enum: [PENDENTE, VIGENTE, REVOGADO] }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '410': { $ref: '#/components/responses/Expirado' }
  /consentimentos-clientes/{token}/aceite:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    post:
      tags: [Privacidade]
      summary: Aceitar o termo pelo link (UC-21, RN41)
      security: []
      responses:
        '204': { description: "Consentimento registrado com data, hora, IP e versão; comprovante enviado ao cliente." }
        '410': { $ref: '#/components/responses/Expirado' }
  /consentimentos-clientes/{token}/revogacao:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    post:
      tags: [Privacidade]
      summary: Revogar o consentimento pelo link do comprovante, sem conta (UC-21, RN41)
      security: []
      responses:
        '204': { description: "Consentimento revogado; a empresa é avisada." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /privacidade/solicitacoes:
    post:
      tags: [Privacidade]
      summary: Solicitar exportação, correção ou exclusão de dados (UC-46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo:
                  type: string
                  enum: [EXPORTACAO_DADOS, EXCLUSAO_DADOS, CORRECAO_DADOS]
                senha:
                  type: string
                  format: password
                  description: Obrigatória para exclusão.
      description: |
        Exportação fica pronta na hora (GET /privacidade/exportacao). Exclusão do tutor é
        imediata: anonimiza a conta, passa os pets divididos a outro responsável, anonimiza os
        demais e encerra as sessões. Exclusão de conta de empresa e correção ficam ABERTAS para
        o suporte, com resposta em até 15 dias.
      responses:
        '202':
          description: Pedido registrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  tipo: { type: string }
                  status: { type: string, enum: [ABERTA, CONCLUIDA] }
        '422':
          description: Senha ausente ou incorreta na exclusão.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /privacidade/exportacao:
    get:
      tags: [Privacidade]
      summary: Exportar os dados do titular (LGPD art. 18, V)
      responses:
        '200':
          description: Conta, pets, saúde, despesas, agenda, alimentação e consentimentos em JSON.
          content:
            application/json:
              schema: { type: object }

  /admin/usuarios:
    get:
      tags: [Administração]
      summary: Buscar contas de usuários (UC-28)
      parameters:
        - in: query
          name: busca
          description: Trecho do e-mail ou do nome.
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusConta' }
      responses:
        '200':
          description: Até 100 contas, das mais recentes para as mais antigas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContaResumo' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /admin/usuarios/{usuarioId}:
    parameters:
      - in: path
        name: usuarioId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Administração]
      summary: Ver o perfil e o status da conta (UC-28)
      responses:
        '200':
          description: Perfil, status, sessões ativas e as últimas mudanças de status auditadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContaDetalhe' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /admin/usuarios/{usuarioId}/status:
    parameters:
      - in: path
        name: usuarioId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Administração]
      summary: Bloquear, suspender ou reativar conta (UC-28)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, motivo]
              properties:
                status:
                  type: string
                  enum: [ATIVA, BLOQUEADA, SUSPENSA]
                motivo: { type: string }
      responses:
        '204': { description: "Status alterado e auditado (RN34). Bloquear ou suspender encerra as sessões da conta." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Mudança recusada (RN34_STATUS_INVALIDO): mesmo status, conta própria, pendente ou excluída."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
        '503':
          description: "Auditoria indisponível (RN34_AUDITORIA_INDISPONIVEL); o status não mudou (CT-28-02)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /admin/logs:
    get:
      tags: [Administração]
      summary: Monitorar logs (UC-25)
      parameters:
        - in: query
          name: nivel
          schema:
            type: string
            enum: [INFO, ALERTA, CRITICO]
        - in: query
          name: de
          schema: { type: string, format: date-time }
        - in: query
          name: ate
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Registros de auditoria.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogAuditoria' }
  /admin/integracoes:
    get:
      tags: [Administração]
      summary: Listar integrações (UC-27)
      responses:
        '200':
          description: Integrações, sem as credenciais.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Integracao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Administração]
      summary: Criar integração (UC-27, RN33)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, tipo, endpointUrl, credenciais]
              properties:
                nome: { type: string }
                tipo: { type: string, enum: [CALENDARIO, PAGAMENTO, PLATAFORMA_VETERINARIA, NOTIFICACAO, OUTRA] }
                endpointUrl: { type: string, format: uri, pattern: '^https://' }
                credenciais:
                  type: string
                  maxLength: 150
                  description: Gravadas cifradas e nunca devolvidas.
                parametros: { type: string }
      responses:
        '201':
          description: Integração salva (CT-27-01).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integracao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/integracoes/{integracaoId}:
    parameters:
      - in: path
        name: integracaoId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Administração]
      summary: Alterar integração (UC-27)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                endpointUrl: { type: string, format: uri }
                credenciais: { type: string, maxLength: 150 }
                parametros: { type: string }
                ativa: { type: boolean }
      responses:
        '200':
          description: Integração alterada e auditada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integracao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/integracoes/{integracaoId}/teste:
    parameters:
      - in: path
        name: integracaoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Administração]
      summary: Testar se o serviço da integração responde (CT-27-01)
      responses:
        '200':
          description: Resultado do teste.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: integer }
                  detalhe: { type: string }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /admin/webhooks:
    get:
      tags: [Administração]
      summary: Listar webhooks (UC-30)
      responses:
        '200':
          description: Webhooks, sem o segredo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Administração]
      summary: Cadastrar webhook (UC-30)
      description: |
        Só URL HTTPS pública com assinatura HMAC-SHA256 (RN36). Sem `segredo`, a API gera um; ele
        aparece só nesta resposta. Cada envio leva `X-Jaguara-Evento`, `X-Jaguara-Id` e
        `X-Jaguara-Assinatura: t=<segundos>,v1=<HMAC-SHA256 de t.corpo>`, com até 5 tentativas e
        espera exponencial (ARQ-03, seção 3.7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventos, metodoAutenticacao]
              properties:
                url: { type: string, format: uri, pattern: '^https://' }
                eventos:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [solicitacao.criada, solicitacao.status_alterado, agendamento.criado, agendamento.cancelado, atendimento.finalizado, pagamento.confirmado]
                metodoAutenticacao:
                  type: string
                  enum: [HMAC_SHA256]
                segredo: { type: string, minLength: 16, maxLength: 64 }
                integracaoId: { type: string, format: uuid }
      responses:
        '201':
          description: Webhook salvo (RN36), com o segredo só desta vez.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/webhooks/{webhookId}:
    parameters:
      - in: path
        name: webhookId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Administração]
      summary: Ativar, desativar ou mudar os eventos do webhook (UC-30)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ativo: { type: boolean }
                eventos: { type: array, items: { type: string } }
      responses:
        '200':
          description: Webhook alterado e auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /webhooks/pagamentos:
    post:
      tags: [Webhooks]
      summary: Receber eventos do gateway de pagamento
      description: |
        Formato do Mercado Pago. A assinatura `X-Signature` (`ts=...,v1=...`, HMAC-SHA256 de
        `id:<data.id>;request-id:<X-Request-Id>;ts:<ts>;`) é conferida antes de tudo (RN36). O
        status vem de nova consulta ao gateway, nunca do corpo, e eventos repetidos não mudam
        nada (idempotente).
      security: []
      parameters:
        - in: header
          name: X-Signature
          required: true
          schema: { type: string }
        - in: header
          name: X-Request-Id
          required: true
          schema: { type: string }
        - in: query
          name: data.id
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, example: payment }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: "Evento processado." }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /health:
    get:
      tags: [Administração]
      summary: Verificação de saúde
      security: []
      responses:
        '200':
          description: API, banco e Redis disponíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PetId:
      in: path
      name: petId
      required: true
      schema: { type: string, format: uuid }
    EmpresaId:
      in: path
      name: empresaId
      required: true
      schema: { type: string, format: uuid }
    SolicitacaoId:
      in: path
      name: solicitacaoId
      required: true
      schema: { type: string, format: uuid }
    AgendamentoId:
      in: path
      name: agendamentoId
      required: true
      schema: { type: string, format: uuid }
    TokenLink:
      in: path
      name: token
      required: true
      description: Token do link de aceite e de revogação enviado ao cliente sem conta (RN41).
      schema: { type: string, minLength: 32 }
    Pagina:
      in: query
      name: pagina
      schema: { type: integer, minimum: 1, default: 1 }
    Tamanho:
      in: query
      name: tamanho
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    NaoAutenticado:
      description: Não autenticado ou sessão expirada (RN04).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SemPermissao:
      description: Sem permissão para o recurso (RN20, RN24, RN26).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflito:
      description: Conflito de regra de negócio (ex. RN01, RN08, RN14, RN29) ou transição de estado inválida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Validacao:
      description: Dados inválidos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Expirado:
      description: Token expirado ou já utilizado (RN05).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
  schemas:
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          description: Código de negócio, por exemplo RN14_CONFLITO_AGENDA.
        campos:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensagem: { type: string }
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiraEm]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEm: { type: string, format: date-time }
    Endereco:
      type: object
      required: [cep, logradouro, numero, bairro, cidade, uf]
      properties:
        cep: { type: string, pattern: '^[0-9]{8}$' }
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string, pattern: '^[A-Z]{2}$' }
    CadastroTutor:
      type: object
      required: [nome, cpf, email, senha, aceiteTermos]
      properties:
        nome: { type: string }
        cpf: { type: string, pattern: '^[0-9]{11}$' }
        email: { type: string, format: email }
        telefone: { type: string }
        senha: { type: string, format: password, minLength: 8 }
        aceiteTermos:
          type: boolean
          const: true
          description: Aceite das versões vigentes dos termos de uso do app e da política de privacidade (RN42).
    CadastroEmpresa:
      type: object
      required: [cnpj, razaoSocial, nomeFantasia, tipo, email, senha, endereco, aceiteTermos]
      properties:
        cnpj: { type: string, pattern: '^[0-9]{14}$' }
        razaoSocial: { type: string }
        nomeFantasia: { type: string }
        tipo:
          type: string
          enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO]
        email: { type: string, format: email }
        senha: { type: string, format: password, minLength: 8 }
        endereco: { $ref: '#/components/schemas/Endereco' }
        aceiteTermos:
          type: boolean
          const: true
          description: Aceite das versões vigentes dos termos da Enterprise e da política de privacidade (RN42).
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
