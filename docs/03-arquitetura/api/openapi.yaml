  /empresas/{empresaId}/agenda:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Controlar agenda semanal (UC-24)
      parameters:
        - in: query
          name: semana
          required: true
          schema: { type: string, format: date }
        - in: query
          name: profissionalId
          schema: { type: string, format: uuid }
        - in: query
          name: recursoId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agendamentos e solicitações pendentes da semana.
          content:
