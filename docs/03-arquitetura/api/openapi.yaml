openapi: 3.1.0
info:
  title: Jaguara API
  version: 1.66.0
  summary: API REST da plataforma Jaguara (tutores e empresas Enterprise).
  description: |
    Contrato da API do Jaguara (tarefa JAG-68). Os recursos seguem o modelo de classes
    (docs/04-modelagem/MOD-01-modelo-de-classes.md) e os casos de uso (docs/02-requisitos/REQ-04).
    Erros usam o formato application/problem+json (RFC 9457) com o campo `codigo` de negócio.
    Datas em ISO 8601 (UTC). Paginação por `pagina` e `tamanho`.

    Tempo real (ADR-011): Socket.IO no namespace `/tempo-real`, com o access token em
    `auth.token`. O servidor emite `mensagem:nova` (schema Mensagem) para o tutor e a empresa
    da conversa; o cliente envia com `mensagem:enviar` ({ conversaId, conteudo }) e recebe
    na confirmação `{ ok: true, mensagem }` ou `{ ok: false, codigo, detalhe }`.
    Quando o status de um pagamento muda, o servidor emite `pagamento:atualizado` (schema
    Pagamento) para o tutor e, na confirmação, também para a empresa.
  contact:
    name: Equipe Jaguara
  license:
    name: Uso acadêmico
    identifier: CC-BY-4.0
servers:
  - url: https://api.homologacao.jaguarapet.com.br/v1
    description: Homologação
  - url: http://localhost:3000/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Autenticação
  - name: Pets
  - name: Saúde
  - name: Rotina
  - name: Financeiro
  - name: Catálogo e agenda
  - name: Solicitações e agendamentos
  - name: Atendimentos
  - name: Empresa
  - name: Comunicação
  - name: Privacidade
  - name: Administração
  - name: Webhooks
  - name: Demonstração

paths:
  /auth/cadastro/tutor:
    post:
      tags: [Autenticação]
      summary: Cadastrar tutor (UC-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroTutor' }
      responses:
        '201':
          description: Conta criada com status PENDENTE_CONFIRMACAO; e-mail de confirmação enviado (RN02).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/cadastro/empresa:
    post:
      tags: [Autenticação]
      summary: Cadastrar empresa Enterprise (UC-32)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroEmpresa' }
      responses:
        '201':
          description: Conta criada; aguardando confirmação do e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/confirmacao:
    post:
      tags: [Autenticação]
      summary: Confirmar e-mail (RN02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: "Conta ativada." }
        '410': { $ref: '#/components/responses/Expirado' }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar usuário (UC-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string, format: password }
                codigo:
                  type: string
                  maxLength: 20
                  description: >-
                    Código do aplicativo autenticador (6 dígitos) ou de recuperação. Sem ele, quem ligou a
                    verificação em duas etapas recebe 401 com codigo DOIS_FATORES_NECESSARIO e envia de novo
                    com o código; código errado recebe CODIGO_DOIS_FATORES_INVALIDO e conta como tentativa.
      responses:
        '200':
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '423':
          description: Conta bloqueada por 5 minutos após 5 falhas (RN03).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /auth/login/social:
    post:
      tags: [Autenticação]
      summary: Entrar com Google ou Apple (UC-02, RF46, ADR-012)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provedor, idToken, nonce]
              properties:
                provedor: { type: string, enum: [GOOGLE, APPLE] }
                idToken: { type: string, description: "id_token OpenID Connect emitido pelo provedor." }
                nonce: { type: string, description: "Valor aleatório gerado pelo app; o token traz ele puro (Google) ou em SHA-256 (Apple)." }
                senha: { type: string, format: password, description: "Senha da conta do Jaguara com o mesmo e-mail, para ligar a identidade (CT-02-04)." }
      responses:
        '200':
          description: Identidade já ligada a uma conta; sessão criada com os tokens do Jaguara.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '409':
          description: "Já existe conta com o mesmo e-mail: o app pede a senha dela e repete o pedido com `senha` (IDENTIDADE_SEM_VINCULO, SENHA_INCORRETA_VINCULO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503':
          description: "Login social sem IDs de cliente configurados (LOGIN_SOCIAL_INDISPONIVEL)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '428':
          description: Primeiro acesso; conclua o cadastro em /auth/cadastro/social com o cadastroToken devolvido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cadastroToken: { type: string }
                  nome: { type: string }
                  email: { type: string, format: email }
  /auth/cadastro/social:
    post:
      tags: [Autenticação]
      summary: Concluir o cadastro de tutor iniciado pelo login social (UC-01, RF46)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cadastroToken, nome, cpf, aceiteTermos]
              properties:
                cadastroToken: { type: string }
                nome: { type: string }
                cpf: { type: string, pattern: '^[0-9]{11}$' }
                telefone: { type: string, maxLength: 20 }
                aceiteTermos: { type: boolean, const: true }
      responses:
        '201':
          description: Conta criada com o e-mail já confirmado pelo provedor e sessão aberta. A conta não tem senha; o tutor pode criar uma por "Esqueci minha senha".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '409': { $ref: '#/components/responses/Conflito' }
        '410':
          description: "Token de cadastro inválido ou vencido (30 minutos); entre com o provedor de novo."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/renovacao:
    post:
      tags: [Autenticação]
      summary: Renovar o access token
      description: Lê a sessão no banco, aplica a inatividade de 4 h (RN04), atualiza a última atividade e relê as permissões do perfil (ADR-012).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Novos tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerrar a sessão atual
      responses:
        '204': { description: "Sessão encerrada." }
  /auth/senha/recuperacao:
    post:
      tags: [Autenticação]
      summary: Solicitar link de recuperação de senha (UC-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: |
            Se o e-mail tiver conta ativa, um link `<URL_WEB>/redefinir-senha?token=...` válido por
            2 horas e uso único é enviado (RN05); um link novo invalida os anteriores. A resposta
            é a mesma para qualquer e-mail.
  /auth/senha/redefinicao:
    post:
      tags: [Autenticação]
      summary: Redefinir senha com o token recebido (UC-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, novaSenha]
              properties:
                token: { type: string }
                novaSenha: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: "Senha redefinida; a conta é desbloqueada e as sessões abertas são encerradas." }
        '410': { $ref: '#/components/responses/Expirado' }
        '422':
          description: Senha fora da política ou igual a uma das três últimas (RN06).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /especies:
    get:
      tags: [Pets]
      summary: Listar espécies e raças cadastradas (RN07)
      responses:
        '200':
          description: Espécies com as raças de cada uma.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Especie' }
  /pets:
    get:
      tags: [Pets]
      summary: Listar pets do tutor autenticado
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusPet' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de pets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPets' }
    post:
      tags: [Pets]
      summary: Cadastrar pet (UC-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '201':
          description: Pet criado com o tutor como responsável principal (RN09).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/foto:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Pets]
      summary: Enviar a foto do pet
      description: >-
        Um responsável informa o arquivo (JPG, PNG, WEBP ou HEIC, até 8 MB) e recebe a URL para
        enviar a foto com PUT direto ao armazenamento. A foto nova substitui a anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomeArquivo, tamanhoBytes]
              properties:
                nomeArquivo: { type: string, maxLength: 255 }
                tamanhoBytes: { type: integer, minimum: 1 }
      responses:
        '201':
          description: URL de envio, válida por 5 minutos.
          content:
            application/json:
              schema:
                type: object
                required: [urlEnvio]
                properties:
                  urlEnvio: { type: string, format: uri }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
    delete:
      tags: [Pets]
      summary: Remover a foto do pet
      responses:
        '204': { description: Foto removida. }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Consultar perfil do pet (UC-04, UC-22)
      description: Empresas só acessam com compartilhamento ativo ou agendamento (RN24, RN26).
      responses:
        '200':
          description: Perfil do pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Pets]
      summary: Editar pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '200':
          description: Pet atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    delete:
      tags: [Pets]
      summary: Excluir pet sem histórico (RN08)
      responses:
        '204': { description: "Pet excluído." }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/arquivamento:
    parameters:
      - $ref: '#/components/parameters/PetId'
    delete:
      tags: [Pets]
      summary: Desarquivar pet
      description: Só o responsável principal. O pet arquivado volta para a lista de ativos; pet falecido não volta.
      responses:
        '204': { description: Pet de volta à lista de ativos. }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
    post:
      tags: [Pets]
      summary: Arquivar pet
      responses:
        '204': { description: "Pet arquivado." }
  /pets/{petId}/falecimento:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Pets]
      summary: Registrar o falecimento do pet (UC-15)
      description: Só o responsável principal. O pet fica FALECIDO, os remédios em uso terminam e os lembretes pendentes do pet são cancelados.
      responses:
        '204': { description: Falecimento registrado e auditado. }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/responsaveis:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Listar responsáveis pelo pet (UC-05)
      responses:
        '200':
          description: Responsáveis ativos, principais primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Responsavel' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Pets]
      summary: Vincular responsável (UC-05)
      description: Só o responsável principal vincula; a outra pessoa precisa ter conta de tutor ativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, tipo]
              properties:
                email: { type: string, format: email }
                tipo: { $ref: '#/components/schemas/TipoResponsavel' }
      responses:
        '201':
          description: Vínculo criado; devolve os responsáveis.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Responsavel' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/responsaveis/{tutorId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - in: path
        name: tutorId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Pets]
      summary: Trocar entre principal e adicional (UC-05, RN09)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { $ref: '#/components/schemas/TipoResponsavel' }
      responses:
        '200':
          description: Responsáveis atualizados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Responsavel' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/Conflito' }
    delete:
      tags: [Pets]
      summary: Remover responsável (UC-05)
      description: O principal remove qualquer um; o adicional só sai do próprio vínculo. O pet nunca fica sem principal (RN09_SEM_PRINCIPAL).
      responses:
        '204': { description: "Vínculo removido." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/compartilhamentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Listar compartilhamentos do pet (UC-11)
      responses:
        '200':
          description: Compartilhamentos com a situação atual (ativo, revogado ou expirado).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Compartilhamento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Pets]
      summary: Compartilhar perfil do pet (UC-11)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompartilhamentoEntrada' }
      responses:
        '201':
          description: |
            Compartilhamento ativo com os escopos informados (RN15). Com `destinatarioEmail`, o
            destinatário recebe por e-mail um link de leitura sem conta; o `link` só aparece nesta
            resposta. Com `empresaId`, o acesso vale dentro do sistema. Informe um dos dois.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compartilhamento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /compartilhamentos/{compartilhamentoId}/revogacao:
    parameters:
      - in: path
        name: compartilhamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pets]
      summary: Revogar compartilhamento (UC-11)
      responses:
        '204': { description: "Acesso revogado na hora." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /compartilhados/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    get:
      tags: [Pets]
      summary: Ver o perfil compartilhado por link (UC-11)
      security: []
      responses:
        '200':
          description: Nome do pet, dados básicos se liberados e as seções compartilhadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pet:
                    type: object
                    properties:
                      nome: { type: string }
                      especie: { type: string }
                      raca: { type: string }
                      sexo: { type: string }
                      castrado: { type: boolean }
                      idadeAnos: { type: integer }
                  escopos: { type: array, items: { type: string } }
                  secoes:
                    type: array
                    items: { type: string, enum: [vacinas, exames, medicamentos, alergias] }
                  dataExpiracao: { type: string, format: date-time }
        '410': { $ref: '#/components/responses/Expirado' }
  /compartilhados/{token}/{secao}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
      - in: path
        name: secao
        required: true
        schema: { type: string, enum: [vacinas, exames, medicamentos, alergias] }
    get:
      tags: [Pets]
      summary: Ver uma seção do perfil compartilhado (UC-11)
      security: []
      responses:
        '200':
          description: Registros da seção, só se o escopo foi compartilhado (CT-11-02).
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '410': { $ref: '#/components/responses/Expirado' }
  /pets/{petId}/perdido:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Situação do aviso de pet perdido
      responses:
        '200':
          description: Aviso ativo ou não.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoPetPerdido' }
    post:
      tags: [Pets]
      summary: Avisar que o pet se perdeu
      description: >-
        A família informa onde o pet foi visto pela última vez e um telefone. O pet ganha uma página
        pública (url) com foto, cartaz para imprimir e QR Code. Avisar de novo atualiza os dados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local, telefone]
              properties:
                local: { type: string, maxLength: 200 }
                telefone: { type: string, maxLength: 20 }
                mensagem: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Aviso ativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoPetPerdido' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
    delete:
      tags: [Pets]
      summary: Avisar que o pet foi encontrado
      description: A página pública sai do ar.
      responses:
        '204': { description: Aviso encerrado. }
  /publico/perdidos/{codigo}:
    parameters:
      - { in: path, name: codigo, required: true, schema: { type: string } }
    get:
      tags: [Pets]
      summary: Página pública do pet perdido
      description: Sem login. Só enquanto o aviso estiver ativo.
      security: []
      responses:
        '200':
          description: Dados para o cartaz.
          content:
            application/json:
              schema:
                type: object
                required: [nome, especie, raca, sexo, desde, local, telefone]
                properties:
                  nome: { type: string }
                  especie: { type: string }
                  raca: { type: string }
                  sexo: { type: string, enum: [MACHO, FEMEA] }
                  cor: { type: string }
                  fotoUrl: { type: string, format: uri }
                  desde: { type: string, format: date-time }
                  local: { type: string }
                  telefone: { type: string }
                  mensagem: { type: string }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/album:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Álbum de fotos do pet
      description: Só a família (responsáveis). As URLs valem por 6 horas.
      responses:
        '200':
          description: Fotos, da mais recente à mais antiga.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FotoDoPet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Pets]
      summary: Enviar uma foto ao álbum
      description: Devolve a URL para enviar a imagem com PUT (JPG, PNG, WEBP ou HEIC, até 8 MB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomeArquivo, tamanhoBytes]
              properties:
                nomeArquivo: { type: string, maxLength: 255 }
                tamanhoBytes: { type: integer, minimum: 1 }
                legenda: { type: string, maxLength: 200 }
                tiradaEm: { type: string, format: date }
      responses:
        '201':
          description: Foto registrada.
          content:
            application/json:
              schema:
                type: object
                required: [id, urlEnvio]
                properties:
                  id: { type: string, format: uuid }
                  urlEnvio: { type: string, format: uri }
        '422': { $ref: '#/components/responses/Validacao' }
  /album/{fotoId}:
    parameters:
      - { in: path, name: fotoId, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Pets]
      summary: Apagar uma foto do álbum
      responses:
        '204': { description: Apagada. }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/linha-do-tempo:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Consultar linha do tempo do pet (UC-35)
      description: Vacinas, exames, tratamentos, compromissos e atendimentos. A empresa precisa do escopo LINHA_DO_TEMPO (RN26).
      responses:
        '200':
          description: Eventos em ordem cronológica, do mais antigo para o mais recente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemLinhaDoTempo' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /pets/{petId}/vacinacoes:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Visualizar vacinação (UC-12)
      description: Retorna apenas registros válidos (RN16).
      responses:
        '200':
          description: Histórico vacinal.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vacinacao' }
    post:
      tags: [Saúde]
      summary: Cadastrar vacinação (UC-13)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacinacaoEntrada' }
      responses:
        '201':
          description: Vacinação registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacinacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /tutor/hoje:
    get:
      tags: [Rotina]
      summary: Tela Hoje do tutor
      description: >-
        O que cada pet precisa hoje (remédios do tratamento e rotinas, com quem já fez), os
        agendamentos dos próximos 14 dias e as vacinas atrasadas ou vencendo em 30 dias.
      responses:
        '200':
          description: Resumo do dia do tutor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HojeTutor' }
  /rotinas/modelos:
    get:
      tags: [Rotina]
      summary: Modelos prontos e editáveis do criador de rotinas
      description: Atalhos para montar a rotina; não são recomendação veterinária.
      responses:
        '200':
          description: Modelos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModeloRotina' }
  /pets/{petId}/cuidador-hoje:
    parameters:
      - $ref: '#/components/parameters/PetId'
    put:
      tags: [Rotina]
      summary: Definir quem cuida do pet hoje
      description: Sem tutorId, o próprio tutor fica com o dia. Só entre os responsáveis ativos do pet.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tutorId: { type: string, format: uuid }
      responses:
        '200':
          description: Quem cuida hoje.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuidadorHoje' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/rotinas:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Rotinas ativas do pet
      responses:
        '200':
          description: Rotinas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rotina' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Rotina]
      summary: Criar rotina
      description: Programa os lembretes dos próximos 30 dias para todos os responsáveis do pet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotinaEntrada' }
      responses:
        '201':
          description: Rotina criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rotina' }
        '422': { $ref: '#/components/responses/Validacao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /rotinas/{rotinaId}:
    parameters:
      - in: path
        name: rotinaId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Rotina]
      summary: Alterar rotina
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotinaEntrada' }
      responses:
        '200':
          description: Rotina alterada e lembretes reprogramados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rotina' }
        '422': { $ref: '#/components/responses/Validacao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Rotina]
      summary: Encerrar rotina
      description: Deixa de aparecer no dia e cancela os lembretes pendentes; o histórico fica.
      responses:
        '204': { description: "Rotina encerrada." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /rotinas/{rotinaId}/feitos:
    parameters:
      - in: path
        name: rotinaId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Rotina]
      summary: Marcar como feito
      description: Registra quem fez, uma vez por dia e horário. Sem data, vale hoje em Brasília.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: string, format: date }
                horario: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
      responses:
        '201':
          description: Feito registrado.
          content:
            application/json:
              schema:
                type: object
                required: [rotinaId, data, horario, feitoEm]
                properties:
                  rotinaId: { type: string, format: uuid }
                  data: { type: string, format: date }
                  horario: { type: [string, 'null'] }
                  feitoEm: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Rotina]
      summary: Desfazer o feito marcado por engano
      parameters:
        - in: query
          name: data
          required: true
          schema: { type: string, format: date }
        - in: query
          name: horario
          schema: { type: string }
      responses:
        '204': { description: "Feito desfeito." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /tratamentos/{tratamentoId}/doses:
    parameters:
      - in: path
        name: tratamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Saúde]
      summary: Registrar a dose dada
      description: >-
        "Dei": registra a dose prevista e quem deu, para a família ver na hora e não dar o
        remédio duas vezes ou nenhuma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [previstaPara]
              properties:
                previstaPara: { type: string, format: date-time }
      responses:
        '201':
          description: Dose registrada.
          content:
            application/json:
              schema:
                type: object
                required: [tratamentoId, previstaPara, feitoEm]
                properties:
                  tratamentoId: { type: string, format: uuid }
                  previstaPara: { type: string, format: date-time }
                  feitoEm: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Saúde]
      summary: Desfazer a dose marcada por engano
      parameters:
        - in: query
          name: previstaPara
          required: true
          schema: { type: string, format: date-time }
      responses:
        '204': { description: "Dose desfeita." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/tratamentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Listar tratamentos medicamentosos (UC-14)
      responses:
        '200':
          description: Tratamentos do pet, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tratamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Cadastrar tratamento medicamentoso (UC-14)
      description: |
        Agenda um lembrete por dose para cada responsável do pet, da primeira dose até o fim do
        último dia (sem data de fim, os próximos 30 dias; no máximo 120 doses).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TratamentoEntrada' }
      responses:
        '201':
          description: Tratamento ativo com lembretes agendados (RN18).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tratamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /tratamentos/{tratamentoId}/finalizacao:
    parameters:
      - in: path
        name: tratamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Saúde]
      summary: Finalizar tratamento e cancelar lembretes
      responses:
        '204': { description: "Tratamento finalizado." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/exames:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Histórico de exames (UC-36)
      responses:
        '200':
          description: Exames válidos, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exame' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Registrar exame (UC-36)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExameEntrada' }
      responses:
        '201':
          description: Exame registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exame' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/alergias:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Listar alergias e restrições (UC-37)
      responses:
        '200':
          description: As graves primeiro, com `destaque` para o perfil do pet (CT-37-01).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alergia' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Registrar alergia ou restrição (UC-37)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlergiaEntrada' }
      responses:
        '201':
          description: Alergia registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alergia' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /alergias/{alergiaId}:
    parameters:
      - in: path
        name: alergiaId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Saúde]
      summary: Alterar alergia ou restrição (UC-37)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlergiaEntrada' }
      responses:
        '200':
          description: Alergia alterada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alergia' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Saúde]
      summary: Excluir alergia ou restrição (UC-37)
      description: Edição clínica; empresa precisa de ALERGIAS e EDICAO_CLINICA (RN30, CT-37-02).
      responses:
        '204': { description: "Alergia excluída." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/documentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Listar documentos do pet (UC-34)
      description: Tutor responsável ou empresa com o escopo DOCUMENTOS (RN15). A lista não traz endereço de arquivo.
      responses:
        '200':
          description: Documentos, do envio mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Documento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Iniciar envio de documento (UC-34)
      description: |
        Registra o documento e devolve a URL assinada para o aparelho enviar o arquivo com PUT,
        válida por 5 minutos (ADR-005). Aceita PDF, JPG, PNG, WEBP e HEIC até 10 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo, nomeArquivo, tamanhoBytes]
              properties:
                titulo: { type: string, maxLength: 255 }
                tipo: { $ref: '#/components/schemas/TipoDocumento' }
                nomeArquivo: { type: string, maxLength: 255 }
                tamanhoBytes: { type: integer, minimum: 1, maximum: 10485760 }
                dataEmissao: { type: string, format: date }
                dataValidade: { type: string, format: date }
      responses:
        '201':
          description: Documento criado e URL de envio.
          content:
            application/json:
              schema:
                type: object
                required: [documentoId, urlEnvio, expiraEm]
                properties:
                  documentoId: { type: string, format: uuid }
                  urlEnvio: { type: string, format: uri }
                  expiraEm: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /documentos/{documentoId}/download:
    parameters:
      - in: path
        name: documentoId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Saúde]
      summary: Baixar documento do pet (UC-34)
      description: URL assinada de download, válida por 5 minutos, que baixa com o nome original (CT-34-02).
      responses:
        '200':
          description: URL de download.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiraEm]
                properties:
                  url: { type: string, format: uri }
                  expiraEm: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /documentos/{documentoId}:
    parameters:
      - in: path
        name: documentoId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Saúde]
      summary: Excluir documento do pet (UC-34)
      responses:
        '204': { description: Documento excluído e auditado. }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "O documento é o laudo de um exame (DOCUMENTO_EM_USO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /pets/{petId}/eventos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Listar eventos do calendário (UC-10)
      description: Eventos do tutor e agendamentos ativos com empresas (origem AGENDAMENTO). Sem período, de agora a 30 dias.
      parameters:
        - in: query
          name: de
          schema: { type: string, format: date-time }
        - in: query
          name: ate
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Eventos no período.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evento' }
    post:
      tags: [Rotina]
      summary: Criar evento (UC-10)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoEntrada' }
      responses:
        '201':
          description: Evento criado e lembrete agendado uma hora antes para os responsáveis (RN37).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: O pet já tem compromisso no horário (RN14_CONFLITO_PET). Evento sem fim ocupa uma hora.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
  /calendario-externo:
    get:
      tags: [Rotina]
      summary: Situação do calendário externo do tutor (UC-09)
      responses:
        '200':
          description: Conta conectada, se autorizada e a última sincronização; vazio quando não há conexão.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provedor: { type: string, enum: [GOOGLE] }
                  conta: { type: string }
                  autorizado: { type: boolean }
                  ultimaSincronizacao: { type: string, format: date-time }
    delete:
      tags: [Rotina]
      summary: Desconectar o calendário externo (UC-09, RN13)
      description: Apaga a autorização e os compromissos importados.
      responses:
        '204': { description: Calendário desconectado. }
  /calendario-externo/google/autorizacao:
    post:
      tags: [Rotina]
      summary: Iniciar a autorização do Google Agenda (UC-09)
      description: |
        Devolve o endereço de consentimento do Google (só leitura do calendário). O app abre no
        navegador; o Google volta para a rota de retorno. Sem GOOGLE_CLIENT_ID e
        GOOGLE_CLIENT_SECRET, o calendário é simulado e o endereço volta direto para a API.
      responses:
        '201':
          description: Endereço de consentimento, válido por 10 minutos.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
  /calendario-externo/google/retorno:
    get:
      tags: [Rotina]
      summary: Retorno do consentimento do Google (UC-09)
      security: []
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
      responses:
        '302':
          description: |
            Volta para o app em `<URL_APP>/calendario?resultado=conectado|negado|erro`. Acesso
            negado ou estado inválido não guarda nada (CT-09-02).
  /pets/{petId}/calendario-externo/sincronizacao:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Rotina]
      summary: Sincronizar o calendário externo com a agenda do pet (UC-09, CT-09-01)
      description: Importa os compromissos dos próximos 30 dias como eventos de origem CALENDARIO_EXTERNO; os que saíram do calendário externo são removidos.
      responses:
        '201':
          description: Resumo da sincronização.
          content:
            application/json:
              schema:
                type: object
                required: [importados, atualizados, removidos]
                properties:
                  importados: { type: integer }
                  atualizados: { type: integer }
                  removidos: { type: integer }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Calendário não autorizado ou autorização revogada (RN13_SEM_AUTORIZACAO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503':
          description: "Google Agenda indisponível (CALENDARIO_INDISPONIVEL)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /eventos/{eventoId}:
    parameters:
      - in: path
        name: eventoId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Rotina]
      summary: Excluir evento manual e cancelar o lembrete (UC-10)
      responses:
        '204': { description: "Evento excluído." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/plano-alimentar:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Ver o plano alimentar ativo (UC-08)
      responses:
        '200':
          description: Plano ativo, ou `plano` nulo quando não há.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plano:
                    oneOf:
                      - $ref: '#/components/schemas/PlanoAlimentar'
                      - type: 'null'
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Rotina]
      summary: Definir meta e limite diários (UC-08, RN12)
      description: Substitui o plano ativo; o anterior fica no histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alimento, metaDiariaGramas, refeicoesPorDia]
              properties:
                alimento: { type: string }
                metaDiariaGramas: { type: number, exclusiveMinimum: 0 }
                limiteDiarioGramas:
                  type: number
                  exclusiveMinimum: 0
                  description: Não pode ser menor que a meta.
                refeicoesPorDia: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: Plano ativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanoAlimentar' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/refeicoes:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Refeições do dia com o consumo (UC-08)
      parameters:
        - in: query
          name: data
          description: Dia em Brasília; padrão, hoje.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Refeições do dia e o resumo do consumo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResumoAlimentar'
                  - type: object
                    properties:
                      data: { type: string, format: date }
                      refeicoes:
                        type: array
                        items: { $ref: '#/components/schemas/Refeicao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Rotina]
      summary: Registrar refeição (UC-08)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataHora, alimento, quantidadeGramas]
              properties:
                dataHora: { type: string, format: date-time }
                alimento: { type: string }
                quantidadeGramas: { type: number, exclusiveMinimum: 0 }
                observacao: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Refeição registrada; `limiteExcedido` indica alerta (RN12, CT-08-02).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Refeicao'
                  - $ref: '#/components/schemas/ResumoAlimentar'
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /dispositivos:
    post:
      tags: [Comunicação]
      summary: Registrar o aparelho para push (UC-31)
      description: |
        O app registra o token de push do Expo depois do login. O mesmo aparelho com outra conta
        passa para a conta atual. Com PUSH_EXPO ligado, o worker manda os lembretes por push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, plataforma]
              properties:
                token: { type: string, maxLength: 255, example: 'ExponentPushToken[xxxxxxxx]' }
                plataforma: { type: string, enum: [ios, android, web] }
      responses:
        '204': { description: Aparelho registrado. }
        '422': { $ref: '#/components/responses/Validacao' }
  /dispositivos/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    delete:
      tags: [Comunicação]
      summary: Tirar o aparelho da conta na saída (UC-31)
      responses:
        '204': { description: Aparelho removido da conta. }
  /notificacoes:
    get:
      tags: [Rotina]
      summary: Notificações do usuário, enviadas e agendadas (UC-31)
      responses:
        '200':
          description: As 50 mais recentes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notificacao' }
  /notificacoes/configuracoes:
    get:
      tags: [Rotina]
      summary: Preferências de notificação por tipo de compromisso (RN37)
      responses:
        '200':
          description: Uma configuração por tipo, com o padrão onde o usuário não mudou.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfiguracaoNotificacao' }
  /notificacoes/configuracoes/{tipoEvento}:
    parameters:
      - in: path
        name: tipoEvento
        required: true
        schema:
          type: string
          enum: [CONSULTA, VACINA, MEDICAMENTO, EXAME, CIRURGIA, BANHO_TOSA, HOSPEDAGEM, COMPROMISSO, OUTRO]
    put:
      tags: [Rotina]
      summary: Definir canal, antecedência e liga/desliga de um tipo (RN37, CT-31-01)
      description: Vale para os lembretes agendados daqui em diante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canal, antecedenciaMinutos, ativa]
              properties:
                canal: { type: string, enum: [PUSH, EMAIL] }
                antecedenciaMinutos: { type: integer, minimum: 0, maximum: 10080 }
                ativa: { type: boolean }
      responses:
        '200':
          description: Configuração salva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracaoNotificacao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /categorias-despesa:
    get:
      tags: [Financeiro]
      summary: Listar as categorias de despesa (RN10)
      responses:
        '200':
          description: Categorias disponíveis, em ordem alfabética.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    nome: { type: string }
                    descricao: { type: string }
  /pets/{petId}/despesas:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Financeiro]
      summary: Listar despesas (UC-06)
      parameters:
        - in: query
          name: de
          schema: { type: string, format: date }
        - in: query
          name: ate
          schema: { type: string, format: date }
        - in: query
          name: categoriaId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Despesas do pet.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Despesa' }
    post:
      tags: [Financeiro]
      summary: Registrar despesa (UC-06)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DespesaEntrada' }
      responses:
        '201':
          description: Despesa registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Despesa' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /relatorios/despesas:
    get:
      tags: [Financeiro]
      summary: Emitir relatório de despesas (UC-07)
      parameters:
        - in: query
          name: petId
          schema: { type: string, format: uuid }
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Relatório em JSON ou PDF (RN11), conforme o cabeçalho Accept. Sem `petId`, junta todos os pets de que o tutor é responsável.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatorioDespesas' }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '404':
          description: "Pet não encontrado, ou não há despesas no período (código RN11_SEM_DADOS, CT-07-02)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }

  /empresas:
    get:
      tags: [Catálogo e agenda]
      summary: Buscar empresas com serviços ativos (UC-33)
      parameters:
        - in: query
          name: busca
          description: Trecho do nome da empresa ou de um serviço.
          schema: { type: string }
        - in: query
          name: tipo
          schema:
            type: string
            enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO]
        - in: query
          name: categoria
          description: Categoria de serviço oferecida.
          schema:
            type: string
            enum: [CONSULTA, EXAME, CIRURGIA, VACINACAO, BANHO_TOSA, HOSPEDAGEM, PET_SITTER, CRECHE, OUTRO]
        - in: query
          name: cidade
          schema: { type: string }
        - in: query
          name: perto
          description: Ordena pela distância. Sem latitude e longitude nem CEP, usa o CEP do cadastro do tutor.
          schema: { type: boolean }
        - in: query
          name: latitude
          description: Localização do aparelho; ordena da mais perto à mais longe.
          schema: { type: number, minimum: -90, maximum: 90 }
        - in: query
          name: longitude
          schema: { type: number, minimum: -180, maximum: 180 }
        - in: query
          name: cep
          description: Ordena pela distância até este CEP.
          schema: { type: string, pattern: '^\d{5}-?\d{3}$' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Empresas encontradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaEmpresas' }
  /empresas/{empresaId}:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Ver o perfil público da empresa (UC-33)
      responses:
        '200':
          description: Dados públicos da empresa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpresaPublica' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /empresas/{empresaId}/perfil-publico:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Ler o perfil público para editar
      responses:
        '200':
          description: Perfil público da empresa, com o endereço da página /e/{slug}.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilPublico' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    patch:
      tags: [Empresa]
      summary: Editar o perfil público
      description: >-
        O que o tutor vê no app e na página pública: descrição, contatos, horário de
        funcionamento, formas de pagamento, política de cancelamento e o endereço curto da página.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilPublicoEntrada' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilPublico' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /conta/dois-fatores:
    get:
      tags: [Autenticação]
      summary: Situação da verificação em duas etapas
      description: exigido é true para a conta da empresa quando a plataforma obriga a segunda etapa.
      responses:
        '200':
          description: Situação.
          content:
            application/json:
              schema:
                type: object
                required: [ativo, codigosRestantes, exigido]
                properties:
                  ativo: { type: boolean }
                  ativadoEm: { type: string, format: date-time }
                  codigosRestantes: { type: integer }
                  exigido: { type: boolean }
  /conta/dois-fatores/configuracao:
    post:
      tags: [Autenticação]
      summary: Começar a configuração do aplicativo autenticador
      description: Gera o segredo e o endereço otpauth para o QR Code. Só vale depois da ativação.
      responses:
        '201':
          description: Segredo e QR Code.
          content:
            application/json:
              schema:
                type: object
                required: [segredo, urlOtpauth]
                properties:
                  segredo: { type: string }
                  urlOtpauth: { type: string }
        '409': { description: "A verificação em duas etapas já está ativa." }
  /conta/dois-fatores/ativacao:
    post:
      tags: [Autenticação]
      summary: Ativar com o primeiro código
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodigoDoisFatores' }
      responses:
        '201':
          description: Ativada. Os códigos de recuperação aparecem só agora.
          content:
            application/json:
              schema:
                type: object
                required: [codigosRecuperacao]
                properties:
                  codigosRecuperacao:
                    type: array
                    items: { type: string }
        '422': { $ref: '#/components/responses/Validacao' }
  /conta/dois-fatores/desativacao:
    post:
      tags: [Autenticação]
      summary: Desligar a verificação em duas etapas
      description: Exige um código válido. A conta da empresa obrigada não desliga.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodigoDoisFatores' }
      responses:
        '204': { description: Desligada. }
        '401': { description: "Código incorreto." }
        '409': { description: "A conta da empresa precisa da segunda etapa." }
  /publico/cnpj/{cnpj}:
    parameters:
      - { in: path, name: cnpj, required: true, schema: { type: string } }
    get:
      tags: [Empresa]
      summary: Consultar o CNPJ no cadastro da empresa
      description: >-
        Sem login. Busca razão social, endereço, situação e atividade na base pública da Receita.
        Só CNPJ ativo e do ramo pet pode se cadastrar. CNPJ já cadastrado volta com jaCadastrado
        e leva à contestação.
      security: []
      responses:
        '200':
          description: Dados do CNPJ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultaCnpj' }
        '422': { $ref: '#/components/responses/Validacao' }
  /publico/cnpj/{cnpj}/contestacao:
    parameters:
      - { in: path, name: cnpj, required: true, schema: { type: string } }
    post:
      tags: [Empresa]
      summary: '"Este CNPJ já está cadastrado. É seu?"'
      description: Sem login. O pedido vai para o painel do administrador.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, mensagem]
              properties:
                nome: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                telefone: { type: string, maxLength: 20 }
                mensagem: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Pedido recebido.
          content:
            application/json:
              schema:
                type: object
                required: [protocolo]
                properties:
                  protocolo: { type: string, format: uuid }
        '409': { description: "O CNPJ não tem cadastro ou já tem pedidos em análise." }
  /publico/empresas/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      tags: [Empresa]
      summary: Página pública da empresa
      description: Sem login. Dados públicos e serviços ativos com preço, para a página /e/{slug}.
      security: []
      responses:
        '200':
          description: Vitrine da empresa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VitrineEmpresa' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /empresas/{empresaId}/servicos:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Visualizar catálogo de serviços (UC-33)
      responses:
        '200':
          description: Serviços ativos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Servico' }
    post:
      tags: [Catálogo e agenda]
      summary: Cadastrar serviço (UC-38)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicoEntrada' }
      responses:
        '201':
          description: Serviço criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servico' }
  /servicos/{servicoId}:
    parameters:
      - in: path
        name: servicoId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Catálogo e agenda]
      summary: Alterar serviço (UC-38)
      description: Alterar o preço não afeta agendamentos existentes (RN27).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicoEntrada' }
      responses:
        '200':
          description: Serviço atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servico' }
  /empresas/{empresaId}/recursos:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Listar recursos da empresa (UC-38)
      responses:
        '200':
          description: Salas, equipamentos, baias e veículos da empresa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Recurso' }
    post:
      tags: [Catálogo e agenda]
      summary: Cadastrar recurso (UC-38)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecursoEntrada' }
      responses:
        '201':
          description: Recurso criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recurso' }
  /recursos/{recursoId}:
    parameters:
      - in: path
        name: recursoId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Catálogo e agenda]
      summary: Alterar ou desativar recurso (UC-38)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecursoEntrada' }
      responses:
        '200':
          description: Recurso atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recurso' }
  /servicos/{servicoId}/horarios-disponiveis:
    parameters:
      - in: path
        name: servicoId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catálogo e agenda]
      summary: Consultar horários disponíveis (UC-40, RN40)
      parameters:
        - in: query
          name: data
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Horários livres.
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: date-time }
  /empresas/{empresaId}/horarios-atuacao:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Listar horários de atuação (UC-24)
      responses:
        '200':
          description: Horários de atuação dos profissionais e recursos da empresa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HorarioAtuacao' }
    post:
      tags: [Catálogo e agenda]
      summary: Cadastrar horário de atuação (UC-24)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HorarioAtuacaoEntrada' }
      responses:
        '201':
          description: Horário registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HorarioAtuacao' }
        '409': { $ref: '#/components/responses/Conflito' }
  /horarios-atuacao/{horarioId}:
    parameters:
      - in: path
        name: horarioId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Catálogo e agenda]
      summary: Remover horário de atuação (UC-24)
      responses:
        '204': { description: Horário removido. }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /empresas/{empresaId}/agenda:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Controlar agenda semanal (UC-24)
      parameters:
        - in: query
          name: semana
          required: true
          schema: { type: string, format: date }
        - in: query
          name: profissionalId
          schema: { type: string, format: uuid }
        - in: query
          name: recursoId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Agendamentos e solicitações pendentes da semana.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agendamentos:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Agendamento'
                        - type: object
                          properties:
                            servicoNome: { type: string }
                            petNome: { type: string }
                            profissionalNome: { type: string }
                            recursoNome: { type: string }
                  solicitacoesPendentes:
                    type: array
                    items: { $ref: '#/components/schemas/Solicitacao' }

  /solicitacoes:
    get:
      tags: [Solicitações e agendamentos]
      summary: Consultar solicitações (UC-41 empresa, UC-42 tutor)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusSolicitacao' }
      responses:
        '200':
          description: Solicitações do usuário autenticado, com os nomes do serviço, do pet e do tutor para a lista da empresa (UC-41).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Solicitacao' }
    post:
      tags: [Solicitações e agendamentos]
      summary: Solicitar agendamento de serviço (UC-40)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servicoId, petId, dataHoraDesejada]
              properties:
                servicoId: { type: string, format: uuid }
                petId: { type: string, format: uuid }
                dataHoraDesejada: { type: string, format: date-time }
                observacoes: { type: string }
      responses:
        '201':
          description: Solicitação PENDENTE (RN38, RN40).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Solicitacao' }
        '409': { $ref: '#/components/responses/Conflito' }
  /solicitacoes/{solicitacaoId}/aceite:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Aceitar solicitação e criar agendamento (UC-41)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profissionalId: { type: string, format: uuid }
                recursoId: { type: string, format: uuid }
      responses:
        '200':
          description: Solicitação ACEITA e agendamento criado pelo preço atual (RN27); o tutor recebe e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: Já respondida (SOLICITACAO_RESPONDIDA) ou conflito de agenda (RN14, RN29).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
  /solicitacoes/{solicitacaoId}/recusa:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Recusar solicitação (UC-41)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3 }
      responses:
        '204': { description: "Solicitação RECUSADA; o tutor recebe o motivo por e-mail." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /minhas-solicitacoes:
    get:
      tags: [Solicitações e agendamentos]
      summary: Minhas solicitações, com nomes e situação (UC-42)
      description: Só o tutor. Da mais recente para a mais antiga, já com serviço, empresa, pet, agendamento, pagamento e se ainda pode cancelar.
      responses:
        '200':
          description: Solicitações do tutor.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DetalheSolicitacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /solicitacoes/{solicitacaoId}:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    get:
      tags: [Solicitações e agendamentos]
      summary: Detalhes da solicitação com o histórico (UC-42, CT-42-01)
      responses:
        '200':
          description: Status atual, histórico e se pode cancelar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalheSolicitacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /solicitacoes/{solicitacaoId}/cancelamento:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Cancelar solicitação (UC-42)
      description: |
        Pendente ou aceita, antes do horário. Se já aceita, o agendamento é desfeito e o horário
        volta para a agenda; a empresa recebe e-mail e o histórico registra o tutor como autor (RN38).
      responses:
        '204': { description: "Solicitação CANCELADA e horário liberado." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Status ou horário não permitem cancelar (RN38_CANCELAMENTO_BLOQUEADO, CT-42-02)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /solicitacoes/{solicitacaoId}/historico:
    parameters:
      - $ref: '#/components/parameters/SolicitacaoId'
    get:
      tags: [Solicitações e agendamentos]
      summary: Histórico de status da solicitação para o tutor (RN38)
      responses:
        '200':
          description: Mudanças de status em ordem.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoricoSolicitacao' }
  /agendamentos:
    post:
      tags: [Solicitações e agendamentos]
      summary: Agendar serviço pela empresa (UC-39)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgendamentoEntrada' }
      responses:
        '201':
          description: Agendamento criado e tutor notificado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '409': { $ref: '#/components/responses/Conflito' }
  /agendamentos/{agendamentoId}:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    get:
      tags: [Solicitações e agendamentos]
      summary: Detalhe do agendamento para o atendimento
      description: >-
        Serviço com a categoria (que decide os campos do atendimento estruturado), pet com as
        alergias, tutor, profissional e se o tutor liberou o registro de saúde para a empresa.
      responses:
        '200':
          description: Detalhe do agendamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendamentoDetalhe' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Solicitações e agendamentos]
      summary: Remarcar agendamento (UC-24)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataHoraInicio, dataHoraFim]
              properties:
                dataHoraInicio: { type: string, format: date-time }
                dataHoraFim: { type: string, format: date-time }
                profissionalId: { type: string, format: uuid }
                recursoId: { type: string, format: uuid }
      responses:
        '200':
          description: Agendamento remarcado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '409': { $ref: '#/components/responses/Conflito' }
  /agendamentos/{agendamentoId}/cancelamento:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Cancelar agendamento (UC-24)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string }
      responses:
        '204': { description: "Agendamento CANCELADO." }
  /agendamentos/{agendamentoId}/confirmacao:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Confirmar presença no agendamento
      description: >-
        Um responsável pelo pet confirma, a partir do lembrete (um dia e duas horas antes), que
        vai ao agendamento. A clínica vê a confirmação na tela Hoje. Remarcar apaga a confirmação.
      responses:
        '201':
          description: Presença confirmada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { description: "O agendamento não está mais ativo." }
  /agendamentos/{agendamentoId}/atendimento:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    get:
      tags: [Atendimentos]
      summary: Consultar o atendimento de um agendamento (UC-23)
      responses:
        '200':
          description: Atendimento com os itens cobrados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Atendimentos]
      summary: Registrar serviços e atendimento (UC-23)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtendimentoEntrada' }
      responses:
        '201':
          description: Atendimento FINALIZADO com itens pelo preço contratado (RN27).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: Atendimento já registrado (ATENDIMENTO_JA_REGISTRADO), agendamento inativo ou ainda não ocorrido (AGENDAMENTO_NAO_OCORREU).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /atendimentos/{atendimentoId}:
    parameters:
      - in: path
        name: atendimentoId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Atendimentos]
      summary: Alterar atendimento finalizado com auditoria (RN28)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justificativa]
              properties:
                observacoesClinicas: { type: string }
                procedimentosRealizados: { type: string }
                justificativa: { type: string, minLength: 10 }
      responses:
        '200':
          description: Atendimento alterado e auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }

  /empresas/{empresaId}/funcionarios:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Listar funcionários (UC-19)
      responses:
        '200':
          description: Funcionários da empresa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Funcionario' }
    post:
      tags: [Empresa]
      summary: Cadastrar funcionário (UC-19)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, cpf, email, perfilId]
              properties:
                nome: { type: string }
                cpf: { type: string, pattern: '^[0-9]{11}$' }
                email: { type: string, format: email }
                cargo: { type: string }
                perfilId: { type: string, format: uuid }
      responses:
        '201':
          description: Funcionário criado; ativo após confirmar o e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcionario' }
        '409': { $ref: '#/components/responses/Conflito' }
  /empresas/{empresaId}/perfis:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Listar perfis de acesso da empresa (UC-16, UC-19)
      responses:
        '200':
          description: Perfis que a empresa pode dar aos funcionários, com as permissões de cada um (RN20).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PerfilDaEmpresa' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Empresa]
      summary: Criar perfil de acesso (UC-16, RN20)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilEntrada' }
      responses:
        '201':
          description: Perfil criado e auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilDaEmpresa' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409':
          description: "Já existe perfil com esse nome (PERFIL_DUPLICADO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/permissoes:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Listar as permissões que a empresa pode distribuir (UC-16)
      responses:
        '200':
          description: Permissões do catálogo para perfis de empresa.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [codigo, modulo, descricao]
                  properties:
                    codigo: { type: string }
                    modulo: { type: string }
                    descricao: { type: string }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /perfis/{perfilId}:
    parameters:
      - in: path
        name: perfilId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Empresa]
      summary: Alterar perfil de acesso (UC-16, RN20)
      description: As sessões de quem usa o perfil são encerradas para as permissões novas valerem na hora.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilEntrada' }
      responses:
        '200':
          description: Perfil alterado e auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilDaEmpresa' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Perfil Proprietário (PERFIL_PROTEGIDO) ou nome repetido (PERFIL_DUPLICADO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
    delete:
      tags: [Empresa]
      summary: Excluir perfil de acesso (UC-16)
      responses:
        '204': { description: Perfil excluído e auditado. }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Perfil Proprietário (PERFIL_PROTEGIDO) ou com pessoas (PERFIL_EM_USO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /funcionarios/{funcionarioId}:
    parameters:
      - in: path
        name: funcionarioId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Empresa]
      summary: Alterar perfil de acesso do funcionário (UC-16)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perfilId]
              properties:
                perfilId: { type: string, format: uuid }
      responses:
        '200':
          description: Perfil alterado com efeito imediato (RN20).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Funcionario' }
    delete:
      tags: [Empresa]
      summary: Remover funcionário e revogar acessos (RN23)
      responses:
        '204': { description: "Funcionário removido." }
  /empresas/{empresaId}/clientes/importacao:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    post:
      tags: [Empresa]
      summary: Importar clientes de uma planilha
      description: >-
        A web lê a planilha (CSV) e envia as linhas. Cada linha vira cliente, com consentimento
        registrado pela declaração da empresa (meio IMPORTACAO), e o pet da linha, quando houver.
        Linhas inválidas ou de quem já é cliente (mesmo CPF, e-mail ou nome e telefone) são ignoradas
        com o motivo. Raça desconhecida entra como "Outra (digitar)" com o texto da planilha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declaracaoConsentimento, linhas]
              properties:
                declaracaoConsentimento:
                  type: boolean
                  description: A empresa declara que os clientes autorizaram o uso dos dados. Precisa ser true.
                linhas:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/LinhaImportacaoCliente' }
      responses:
        '201':
          description: Resultado da importação.
          content:
            application/json:
              schema:
                type: object
                required: [criados, petsCriados, ignorados]
                properties:
                  criados: { type: integer }
                  petsCriados: { type: integer }
                  ignorados:
                    type: array
                    items:
                      type: object
                      required: [linha, motivo]
                      properties:
                        linha: { type: integer, description: "Linha da planilha (a 1 é o cabeçalho)." }
                        nome: { type: string }
                        motivo: { type: string }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/clientes:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Listar clientes (UC-21)
      responses:
        '200':
          description: Clientes da empresa, com a situação do consentimento (RN41).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Cliente' }
    post:
      tags: [Empresa]
      summary: Cadastrar cliente (UC-21)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, meioConsentimento]
              properties:
                nome: { type: string, maxLength: 255 }
                cpf: { type: string, maxLength: 14 }
                telefone: { type: string, maxLength: 20 }
                email:
                  type: string
                  format: email
                  description: Contato do cliente. Se houver conta de tutor com este e-mail ou com o CPF, o cadastro fica ligado a ela (ADR-010).
                observacoes: { type: string }
                meioConsentimento:
                  type: string
                  enum: [ASSINATURA_PRESENCIAL, LINK_DIGITAL]
                  description: Como o consentimento no termo vigente (JUR-04) é coletado (RN41).
                evidenciaArquivoUrl:
                  type: string
                  format: uri
                  description: Link externo da cópia do termo (cadastros antigos). Prefira evidenciaArquivo.
                evidenciaArquivo:
                  type: object
                  description: >-
                    Cópia do termo assinado (PDF ou foto, até 10 MB). A resposta traz urlEnvioTermo para
                    enviar o arquivo com PUT. Com ASSINATURA_PRESENCIAL, informe este campo ou evidenciaArquivoUrl.
                  required: [nomeArquivo, tamanhoBytes]
                  properties:
                    nomeArquivo: { type: string, maxLength: 255 }
                    tamanhoBytes: { type: integer, minimum: 1 }
      responses:
        '201':
          description: >-
            Cliente cadastrado. Com ASSINATURA_PRESENCIAL o consentimento já fica vigente; com LINK_DIGITAL
            o link é enviado ao contato do cliente e o cadastro fica pendente, só com nome e contato,
            por até 7 dias (RN41).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cliente' }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/clientes/{clienteId}/pets:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - in: path
        name: clienteId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Empresa]
      summary: Cadastrar pet de cliente sem conta (UC-21, ADR-010)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '201':
          description: Pet ligado ao cliente; passa para o tutor quando o cliente cria a conta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/clientes/{clienteId}/consentimento/termo:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - in: path
        name: clienteId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Empresa]
      summary: Abrir a cópia do termo assinado
      responses:
        '200':
          description: Link de download, válido por 5 minutos.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Empresa]
      summary: Anexar ou trocar a cópia do termo assinado
      description: Só no consentimento presencial vigente. Devolve a URL para enviar o arquivo com PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomeArquivo, tamanhoBytes]
              properties:
                nomeArquivo: { type: string, maxLength: 255 }
                tamanhoBytes: { type: integer, minimum: 1 }
      responses:
        '201':
          description: URL de envio.
          content:
            application/json:
              schema:
                type: object
                required: [urlEnvio]
                properties:
                  urlEnvio: { type: string, format: uri }
        '409': { description: "O consentimento não é presencial ou não está vigente." }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/clientes/{clienteId}/consentimento/revogacao:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - in: path
        name: clienteId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Empresa]
      summary: Registrar a revogação pedida pelo cliente (UC-21, RN41)
      responses:
        '204': { description: "Consentimento revogado; cliente inativado e dados anonimizados, exceto o exigido por lei." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /empresas/{empresaId}/pets-vinculados:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Consultar pets vinculados (UC-20, RN24)
      responses:
        '200':
          description: Pets com compartilhamento ativo, agendamento com a empresa ou de clientes da empresa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PetVinculado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /empresas/{empresaId}/pets/{petId}/perfil:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Empresa]
      summary: Visualizar perfil do pet com as seções liberadas (UC-22, RN26)
      responses:
        '200':
          description: Perfil básico e só as seções que o tutor liberou no compartilhamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilPetEmpresa' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /empresas/{empresaId}/relatorios/{tipo}:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - in: path
        name: tipo
        required: true
        description: "`atendimentos` (operacional) ou `financeiro` (gerencial, exige também financeiro:ler)."
        schema: { type: string, enum: [atendimentos, financeiro] }
    get:
      tags: [Empresa]
      summary: Emitir relatórios (UC-18, RN22)
      parameters:
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: "Relatório da própria empresa em JSON, ou PDF com `Accept: application/pdf`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RelatorioAtendimentos'
                  - $ref: '#/components/schemas/RelatorioFinanceiro'
                discriminator:
                  propertyName: tipo
                  mapping:
                    atendimentos: '#/components/schemas/RelatorioAtendimentos'
                    financeiro: '#/components/schemas/RelatorioFinanceiro'
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /agendamentos/{agendamentoId}/avaliacao:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    post:
      tags: [Solicitações e agendamentos]
      summary: Avaliar o atendimento
      description: >-
        Um responsável pelo pet dá uma nota de 1 a 5, com comentário opcional, em até 30 dias
        depois do atendimento realizado. Avaliar de novo altera a própria avaliação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoEntrada' }
      responses:
        '201':
          description: Avaliação gravada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avaliacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { description: "Atendimento não realizado, prazo encerrado ou já avaliado por outro responsável." }
        '422': { $ref: '#/components/responses/Validacao' }
  /tutor/avaliacoes/pendentes:
    get:
      tags: [Solicitações e agendamentos]
      summary: Atendimentos esperando avaliação
      description: Atendimentos dos pets do tutor nos últimos 30 dias ainda sem avaliação, com o resumo do que foi feito.
      responses:
        '200':
          description: Até 10 atendimentos, do mais recente ao mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AvaliacaoPendente' }
  /empresas/{empresaId}/avaliacoes:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Avaliações recebidas pela empresa
      parameters:
        - { in: query, name: pagina, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: tamanho, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Resumo das notas e a página de avaliações.
          content:
            application/json:
              schema:
                type: object
                required: [resumo, itens, pagina, tamanho]
                properties:
                  resumo: { $ref: '#/components/schemas/ResumoAvaliacoes' }
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Avaliacao' }
                  pagina: { type: integer }
                  tamanho: { type: integer }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /empresas/{empresaId}/avaliacoes/{avaliacaoId}/resposta:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
      - { in: path, name: avaliacaoId, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Empresa]
      summary: Responder uma avaliação
      description: A resposta aparece junto da avaliação na página pública. Resposta vazia apaga a anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resposta]
              properties:
                resposta: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Avaliação com a resposta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avaliacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /empresas/{empresaId}/plano:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Plano da empresa, limites e uso
      description: >-
        A primeira leitura abre o teste grátis de 14 dias com os limites do plano Equipe. O plano
        limita os usuários (a conta da empresa e os funcionários ativos); fora do teste e sem
        assinatura em dia, a empresa continua usando o sistema, mas não convida mais ninguém.
      responses:
        '200':
          description: Situação do plano.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanoDaEmpresa' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /empresas/{empresaId}/plano/assinatura:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    post:
      tags: [Empresa]
      summary: Assinar ou mudar de plano
      description: >-
        Abre a cobrança mensal recorrente no Mercado Pago e devolve a página em que a empresa
        autoriza o pagamento. Sem credenciais do gateway (desenvolvimento e demonstração), a
        assinatura fica ativa na hora. O aviso do gateway chega pelo webhook de pagamentos
        (tipo subscription_preapproval).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plano]
              properties:
                plano: { $ref: '#/components/schemas/PlanoEmpresa' }
      responses:
        '201':
          description: Assinatura criada.
          content:
            application/json:
              schema:
                type: object
                required: [ativa]
                properties:
                  ativa: { type: boolean }
                  urlPagamento: { type: string, format: uri }
        '409': { description: "A equipe atual passa do limite do plano escolhido." }
        '422': { $ref: '#/components/responses/Validacao' }
  /empresas/{empresaId}/recebimentos:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Financeiro]
      summary: Conta do Mercado Pago em que a empresa recebe
      description: >-
        Com a aplicação de marketplace configurada (disponivel), os pagamentos do app caem direto na
        conta conectada da empresa, com a taxa da plataforma (taxaPercentual) retida na hora. Sem
        conta conectada, o tutor não paga essa empresa pelo app.
      responses:
        '200':
          description: Situação.
          content:
            application/json:
              schema:
                type: object
                required: [disponivel, conectada, taxaPercentual]
                properties:
                  disponivel: { type: boolean }
                  conectada: { type: boolean }
                  contaGatewayId: { type: string }
                  conectadaEm: { type: string, format: date-time }
                  taxaPercentual: { type: number }
        '403': { $ref: '#/components/responses/SemPermissao' }
    delete:
      tags: [Financeiro]
      summary: Desconectar a conta do Mercado Pago
      responses:
        '204': { description: Desconectada. }
  /empresas/{empresaId}/recebimentos/conexao:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    post:
      tags: [Financeiro]
      summary: Começar a conexão da conta do Mercado Pago
      description: Devolve o endereço de autorização (OAuth). A volta passa por /recebimentos/mercado-pago/retorno e leva à página Pagamentos da web.
      responses:
        '201':
          description: Endereço de autorização.
          content:
            application/json:
              schema:
                type: object
                required: [urlAutorizacao]
                properties:
                  urlAutorizacao: { type: string, format: uri }
        '409': { description: "O recebimento direto não está configurado neste ambiente." }
  /recebimentos/mercado-pago/retorno:
    get:
      tags: [Financeiro]
      summary: Volta da autorização no Mercado Pago
      description: Sem login. Confere o estado assinado, troca o código pelo token da empresa (guardado cifrado) e redireciona para a web.
      security: []
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
      responses:
        '302': { description: "Para /pagamentos?recebimento=conectado ou ?recebimento=erro." }
  /empresas/{empresaId}/hoje:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Resumo do dia da empresa (tela Hoje)
      description: >-
        Agenda de hoje em Brasília com tutor, alergias e situação do atendimento e do pagamento;
        pedidos de agendamento pendentes; cobranças em aberto (só para quem vê o financeiro);
        vacinas de pets de clientes atrasadas ou vencendo nos próximos 30 dias; faturamento e
        atendimentos dos últimos 7 dias.
      responses:
        '200':
          description: Resumo do dia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumoDoDia' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /empresas/{empresaId}/indicadores:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Empresa]
      summary: Emitir BI (UC-17, RN21)
      parameters:
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: "Indicadores só da própria empresa, em período de até um ano: atendimentos realizados, faturamento confirmado, taxa de aceite das solicitações respondidas (%), os cinco serviços mais pedidos e os atendimentos por dia."
          content:
            application/json:
              schema:
                type: object
                required: [de, ate, atendimentos, faturamento, taxaAceite, solicitacoes, servicosMaisSolicitados, atendimentosPorDia]
                properties:
                  de: { type: string, format: date }
                  ate: { type: string, format: date }
                  atendimentos: { type: integer }
                  faturamento: { type: number }
                  taxaAceite: { type: number }
                  solicitacoes: { type: integer }
                  servicosMaisSolicitados:
                    type: array
                    items:
                      type: object
                      required: [servico, quantidade]
                      properties:
                        servico: { type: string }
                        quantidade: { type: integer }
                  atendimentosPorDia:
                    type: array
                    items:
                      type: object
                      required: [data, quantidade]
                      properties:
                        data: { type: string, format: date }
                        quantidade: { type: integer }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }

  /pagamentos:
    get:
      tags: [Financeiro]
      summary: Gerenciar pagamentos (UC-45)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusPagamento' }
        - in: query
          name: de
          schema: { type: string, format: date }
        - in: query
          name: ate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Pagamentos realizados (tutor) ou recebidos (empresa com financeiro:ler), do mais recente para o mais antigo (CT-45-01).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PagamentoDetalhado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Financeiro]
      summary: Realizar pagamento (UC-44)
      description: |
        O pagamento nasce PENDENTE com o preço contratado (RN27) e só fica ACEITO pela
        confirmação do gateway (RN39). Com PIX, a resposta traz o `qrCode`; com boleto, traz o
        `boleto` (link, linha digitável e vencimento em 3 dias) e, enquanto ele estiver em aberto,
        um novo pedido devolve o mesmo boleto. O boleto registrado exige o endereço do pagador:
        o informado em `endereco` fica guardado para os próximos. Com cartão, o app
        manda só o token gerado pelo formulário seguro do gateway, nunca os dados do cartão.
        Cartão recusado responde 201 com status RECUSADO e `motivoRecusa`, para o tutor tentar
        outro meio (UC-44, FA1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metodo]
              properties:
                agendamentoId: { type: string, format: uuid }
                assinaturaId: { type: string, format: uuid }
                metodo: { $ref: '#/components/schemas/MetodoPagamento' }
                tokenCartao:
                  type: string
                  maxLength: 255
                  description: Token do cartão gerado no app pelo gateway. Obrigatório para cartão.
                bandeiraCartao:
                  type: string
                  maxLength: 50
                  description: Meio informado pelo gateway (ex. visa, master, debvisa). Obrigatório para cartão.
                parcelas: { type: integer, minimum: 1, maximum: 12, default: 1 }
                endereco:
                  $ref: '#/components/schemas/Endereco'
                  description: Endereço do pagador para o boleto. Sem ele, vale o último informado.
              oneOf:
                - required: [agendamentoId]
                - required: [assinaturaId]
      responses:
        '201':
          description: Pagamento PENDENTE com dados de cobrança, ou o resultado do cartão (RN39).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pagamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
        '503':
          description: Gateway indisponível (GATEWAY_INDISPONIVEL); nada foi cobrado e o tutor tenta de novo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /assinaturas/atual:
    get:
      tags: [Financeiro]
      summary: Ver o plano do tutor (gratuito ou PANTERA)
      responses:
        '200':
          description: Plano vigente, a assinatura vigente ou pendente e o preço mensal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plano: { type: string, enum: [GRATUITO, PANTERA] }
                  vigente: { type: boolean }
                  assinatura: { $ref: '#/components/schemas/Assinatura' }
                  precoMensal: { type: number }
  /assinaturas:
    post:
      tags: [Financeiro]
      summary: Assinar o PANTERA (UC-43, FA1)
      description: |
        Cria a assinatura PENDENTE de um mês (ou devolve a que já está pendente). Pague com
        POST /pagamentos e `assinaturaId`; ela vira ATIVA só com o pagamento confirmado (RN39).
      responses:
        '201':
          description: Assinatura pendente de pagamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assinatura' }
  /assinaturas/atual/cancelamento:
    post:
      tags: [Financeiro]
      summary: Cancelar a assinatura PANTERA
      description: O acesso continua até o fim do período já pago.
      responses:
        '201':
          description: Assinatura cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assinatura' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pagamentos/{pagamentoId}:
    parameters:
      - in: path
        name: pagamentoId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Financeiro]
      summary: Detalhe do pagamento (UC-45)
      responses:
        '200':
          description: Pagamento com descrição, contraparte, pet, reembolso e se ainda pode pedir reembolso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagamentoDetalhado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pagamentos/{pagamentoId}/reembolsos:
    parameters:
      - in: path
        name: pagamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Financeiro]
      summary: Solicitar reembolso (UC-45)
      description: Só quem pagou, para pagamento confirmado há até 30 dias e sem outro pedido. A empresa recebe e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '201':
          description: "Reembolso EM_ANALISE."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagamentoDetalhado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Pagamento não confirmado, fora do prazo ou com outro pedido (RN39_REEMBOLSO_INDISPONIVEL, CT-45-02)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
  /conversas:
    get:
      tags: [Comunicação]
      summary: Listar conversas (UC-43)
      responses:
        '200':
          description: Conversas do usuário, da mais recente para a mais antiga, com os nomes, a última mensagem e quantas o usuário ainda não leu.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversaResumo' }
    post:
      tags: [Comunicação]
      summary: Iniciar conversa com empresa ou assistente (UC-43)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { $ref: '#/components/schemas/TipoConversa' }
                empresaId: { type: string, format: uuid }
                petId: { type: string, format: uuid }
      responses:
        '201':
          description: Conversa criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversa' }
        '402':
          description: Assistente exige assinatura PANTERA ativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /conversas/{conversaId}/mensagens:
    parameters:
      - in: path
        name: conversaId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Comunicação]
      summary: Histórico da conversa, do mais novo para o mais antigo (UC-43)
      description: Devolve até 50 mensagens e marca como lidas as mensagens dos outros participantes.
      parameters:
        - in: query
          name: antes
          description: Só mensagens enviadas antes deste instante (página anterior).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Mensagens da conversa.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mensagem' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Comunicação]
      summary: Enviar mensagem (também disponível por WebSocket)
      description: |
        Na conversa com o assistente virtual, a resposta chega depois pelo evento `mensagem:nova`,
        com `remetenteId` nulo. O assistente exige o PANTERA ativo e tem limite diário de mensagens
        por assinante (ARQ-03, seção 3.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conteudo]
              properties:
                conteudo: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: Mensagem registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mensagem' }
        '402':
          description: Assistente exige assinatura PANTERA ativa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
        '429':
          description: Limite diário de mensagens do assistente atingido (ASSISTENTE_LIMITE_DIARIO).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /conversas/{conversaId}/encerramento:
    parameters:
      - in: path
        name: conversaId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Comunicação]
      summary: Encerrar a conversa (UC-43, passos 6 e 7)
      description: Só o tutor encerra. A conversa fica arquivada e não recebe novas mensagens.
      responses:
        '204': { description: "Conversa encerrada." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /privacidade/consentimentos:
    get:
      tags: [Privacidade]
      summary: Consultar consentimentos (UC-46)
      responses:
        '200':
          description: Termos vigentes e consentimentos do usuário.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimento' }
    put:
      tags: [Privacidade]
      summary: Atualizar consentimentos opcionais (UC-46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [termoId, aceito]
                properties:
                  termoId: { type: string, format: uuid }
                  aceito: { type: boolean }
      responses:
        '204': { description: "Consentimentos atualizados e auditados." }
        '409':
          description: Termo obrigatório não pode ser revogado sem excluir a conta.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /termos/vigentes:
    get:
      tags: [Privacidade]
      summary: Consultar as versões vigentes dos termos (RN42)
      security: []
      parameters:
        - in: query
          name: tipo
          schema:
            type: string
            enum: [TERMOS_USO_APP, TERMOS_ENTERPRISE, POLITICA_PRIVACIDADE, CONSENTIMENTO_CLIENTE, COMUNICACAO_MARKETING]
      responses:
        '200':
          description: Termos vigentes, para exibir no cadastro e na página pública.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Termo' }
  /consentimentos-clientes/{token}:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    get:
      tags: [Privacidade]
      summary: Abrir o termo enviado ao cliente sem conta (UC-21, RN41)
      security: []
      responses:
        '200':
          description: Texto do termo, dados da empresa controladora e situação do consentimento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa: { type: string }
                  termo: { $ref: '#/components/schemas/Termo' }
                  situacao: { type: string, enum: [PENDENTE, VIGENTE, REVOGADO] }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '410': { $ref: '#/components/responses/Expirado' }
  /consentimentos-clientes/{token}/aceite:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    post:
      tags: [Privacidade]
      summary: Aceitar o termo pelo link (UC-21, RN41)
      security: []
      responses:
        '204': { description: "Consentimento registrado com data, hora, IP e versão; comprovante enviado ao cliente." }
        '410': { $ref: '#/components/responses/Expirado' }
  /consentimentos-clientes/{token}/revogacao:
    parameters:
      - $ref: '#/components/parameters/TokenLink'
    post:
      tags: [Privacidade]
      summary: Revogar o consentimento pelo link do comprovante, sem conta (UC-21, RN41)
      security: []
      responses:
        '204': { description: "Consentimento revogado; a empresa é avisada." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /privacidade/solicitacoes:
    post:
      tags: [Privacidade]
      summary: Solicitar exportação, correção ou exclusão de dados (UC-46)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo:
                  type: string
                  enum: [EXPORTACAO_DADOS, EXCLUSAO_DADOS, CORRECAO_DADOS]
                senha:
                  type: string
                  format: password
                  description: Obrigatória para exclusão.
      description: |
        Exportação fica pronta na hora (GET /privacidade/exportacao). Exclusão do tutor é
        imediata: anonimiza a conta, passa os pets divididos a outro responsável, anonimiza os
        demais e encerra as sessões. Exclusão de conta de empresa e correção ficam ABERTAS para
        o suporte, com resposta em até 15 dias.
      responses:
        '202':
          description: Pedido registrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  tipo: { type: string }
                  status: { type: string, enum: [ABERTA, CONCLUIDA] }
        '422':
          description: Senha ausente ou incorreta na exclusão.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /privacidade/exportacao:
    get:
      tags: [Privacidade]
      summary: Exportar os dados do titular (LGPD art. 18, V)
      responses:
        '200':
          description: Conta, pets, saúde, despesas, agenda, alimentação e consentimentos em JSON.
          content:
            application/json:
              schema: { type: object }

  /chamados:
    get:
      tags: [Administração]
      summary: Meus chamados de suporte (UC-26)
      responses:
        '200':
          description: Chamados abertos pelo usuário autenticado, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chamado' }
    post:
      tags: [Administração]
      summary: Abrir chamado de suporte (UC-26)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, descricao]
              properties:
                titulo: { type: string, minLength: 5, maxLength: 120 }
                descricao: { type: string, minLength: 10, maxLength: 4000 }
      responses:
        '201':
          description: Chamado ABERTO com o protocolo para o usuário citar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /chamados/{chamadoId}/complemento:
    parameters:
      - $ref: '#/components/parameters/ChamadoId'
    post:
      tags: [Administração]
      summary: Responder ao pedido de informação do suporte (UC-26, FA1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MensagemChamado' }
      responses:
        '201':
          description: Complemento juntado à descrição; o chamado volta para EM_ANALISE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chamado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "O suporte não pediu informação (CHAMADO_SEM_PEDIDO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/verificacoes:
    get:
      tags: [Administração]
      summary: Empresas em verificação e contestações de CNPJ
      responses:
        '200':
          description: Pendências do cadastro seguro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendenciasVerificacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /admin/verificacoes/empresas/{empresaId}:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    post:
      tags: [Administração]
      summary: Aprovar ou recusar a verificação da empresa
      description: A empresa recebe o resultado por e-mail. Recusar exige o motivo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aprovada]
              properties:
                aprovada: { type: boolean }
                motivo: { type: string, maxLength: 500 }
      responses:
        '204': { description: Decisão registrada. }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/verificacoes/contestacoes/{id}/resolucao:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Administração]
      summary: Marcar a contestação como resolvida
      responses:
        '204': { description: Resolvida. }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /admin/chamados:
    get:
      tags: [Administração]
      summary: Central de suporte (UC-26)
      description: Exige `admin:suporte`. Do mais antigo para o mais novo, para atender por ordem de chegada.
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusChamado' }
      responses:
        '200':
          description: Chamados com o solicitante e o atendente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChamadoResumo' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /admin/chamados/{chamadoId}:
    parameters:
      - $ref: '#/components/parameters/ChamadoId'
    get:
      tags: [Administração]
      summary: Detalhes do chamado com as intervenções (UC-26)
      responses:
        '200':
          description: Chamado e histórico de intervenções.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChamadoDetalhe' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /admin/chamados/{chamadoId}/intervencoes:
    parameters:
      - $ref: '#/components/parameters/ChamadoId'
    post:
      tags: [Administração]
      summary: Registrar intervenção (UC-26, CT-26-01, RN32)
      description: A intervenção, a nova situação e a auditoria são gravadas juntas; o solicitante recebe o aviso por e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acaoExecutada, descricao, status]
              properties:
                acaoExecutada: { type: string, minLength: 3, maxLength: 255 }
                descricao: { type: string, minLength: 5, maxLength: 2000 }
                status: { type: string, enum: [EM_ANALISE, RESOLVIDO, FECHADO] }
      responses:
        '201':
          description: Intervenção registrada e auditada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChamadoDetalhe' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Chamado já fechado (CHAMADO_FECHADO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
        '503':
          description: "Auditoria indisponível; nada mudou (RN32_AUDITORIA_INDISPONIVEL)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /admin/chamados/{chamadoId}/pedido-informacao:
    parameters:
      - $ref: '#/components/parameters/ChamadoId'
    post:
      tags: [Administração]
      summary: Pedir informação ao solicitante (UC-26, CT-26-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MensagemChamado' }
      responses:
        '201':
          description: Chamado em AGUARDANDO_INFORMACAO; o solicitante recebe o pedido por e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChamadoDetalhe' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Chamado já fechado (CHAMADO_FECHADO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/usuarios:
    get:
      tags: [Administração]
      summary: Buscar contas de usuários (UC-28)
      parameters:
        - in: query
          name: busca
          description: Trecho do e-mail ou do nome.
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusConta' }
      responses:
        '200':
          description: Até 100 contas, das mais recentes para as mais antigas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContaResumo' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /admin/usuarios/{usuarioId}:
    parameters:
      - in: path
        name: usuarioId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Administração]
      summary: Ver o perfil e o status da conta (UC-28)
      responses:
        '200':
          description: Perfil, status, sessões ativas e as últimas mudanças de status auditadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContaDetalhe' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /admin/usuarios/{usuarioId}/status:
    parameters:
      - in: path
        name: usuarioId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Administração]
      summary: Bloquear, suspender ou reativar conta (UC-28)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, motivo]
              properties:
                status:
                  type: string
                  enum: [ATIVA, BLOQUEADA, SUSPENSA]
                motivo: { type: string }
      responses:
        '204': { description: "Status alterado e auditado (RN34). Bloquear ou suspender encerra as sessões da conta." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "Mudança recusada (RN34_STATUS_INVALIDO): mesmo status, conta própria, pendente ou excluída."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
        '503':
          description: "Auditoria indisponível (RN34_AUDITORIA_INDISPONIVEL); o status não mudou (CT-28-02)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /admin/permissoes:
    get:
      tags: [Administração]
      summary: Catálogo de permissões da plataforma (UC-29)
      responses:
        '200':
          description: Permissões com o módulo e a categoria de perfil a que pertencem (vazia quando servem a mais de uma).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [codigo, modulo, descricao]
                  properties:
                    codigo: { type: string }
                    modulo: { type: string }
                    descricao: { type: string }
                    categoria: { type: string, enum: [TUTOR, EMPRESA, ADMINISTRADOR] }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /admin/perfis:
    get:
      tags: [Administração]
      summary: Matriz de acesso dos perfis globais (UC-29)
      responses:
        '200':
          description: Perfis globais (Tutor, Empresa e os da administração) com as permissões e quantas contas usam cada um.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PerfilGlobal' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /admin/perfis/{perfilId}:
    parameters:
      - in: path
        name: perfilId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Administração]
      summary: Alterar as permissões de um perfil global (UC-29, RN35)
      description: |
        Vale na próxima requisição de quem usa o perfil: tokens emitidos antes recebem 401 e o
        cliente renova a sessão, que já sai com as permissões novas. Auditado como CRITICO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissoes]
              properties:
                permissoes:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200':
          description: Perfil alterado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilGlobal' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "O administrador tiraria admin:usuarios do próprio perfil (RN35_AUTOBLOQUEIO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: "Perfil sem permissão (CT-29-02) ou com permissão de outra categoria."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /admin/logs:
    get:
      tags: [Administração]
      summary: Monitorar logs (UC-25)
      parameters:
        - in: query
          name: nivel
          schema:
            type: string
            enum: [INFO, ALERTA, CRITICO]
        - in: query
          name: de
          schema: { type: string, format: date-time }
        - in: query
          name: ate
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Registros de auditoria.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LogAuditoria' }
  /admin/integracoes:
    get:
      tags: [Administração]
      summary: Listar integrações (UC-27)
      responses:
        '200':
          description: Integrações, sem as credenciais.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Integracao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Administração]
      summary: Criar integração (UC-27, RN33)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, tipo, endpointUrl, credenciais]
              properties:
                nome: { type: string }
                tipo: { type: string, enum: [CALENDARIO, PAGAMENTO, PLATAFORMA_VETERINARIA, NOTIFICACAO, OUTRA] }
                endpointUrl: { type: string, format: uri, pattern: '^https://' }
                credenciais:
                  type: string
                  maxLength: 150
                  description: Gravadas cifradas e nunca devolvidas.
                parametros: { type: string }
      responses:
        '201':
          description: Integração salva (CT-27-01).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integracao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/integracoes/{integracaoId}:
    parameters:
      - in: path
        name: integracaoId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Administração]
      summary: Alterar integração (UC-27)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                endpointUrl: { type: string, format: uri }
                credenciais: { type: string, maxLength: 150 }
                parametros: { type: string }
                ativa: { type: boolean }
      responses:
        '200':
          description: Integração alterada e auditada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integracao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/integracoes/{integracaoId}/teste:
    parameters:
      - in: path
        name: integracaoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Administração]
      summary: Testar se o serviço da integração responde (CT-27-01)
      responses:
        '200':
          description: Resultado do teste.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: integer }
                  detalhe: { type: string }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /admin/webhooks:
    get:
      tags: [Administração]
      summary: Listar webhooks (UC-30)
      responses:
        '200':
          description: Webhooks, sem o segredo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Administração]
      summary: Cadastrar webhook (UC-30)
      description: |
        Só URL HTTPS pública com assinatura HMAC-SHA256 (RN36). Sem `segredo`, a API gera um; ele
        aparece só nesta resposta. Cada envio leva `X-Jaguara-Evento`, `X-Jaguara-Id` e
        `X-Jaguara-Assinatura: t=<segundos>,v1=<HMAC-SHA256 de t.corpo>`, com até 5 tentativas e
        espera exponencial (ARQ-03, seção 3.7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventos, metodoAutenticacao]
              properties:
                url: { type: string, format: uri, pattern: '^https://' }
                eventos:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [solicitacao.criada, solicitacao.status_alterado, agendamento.criado, agendamento.cancelado, atendimento.finalizado, pagamento.confirmado]
                metodoAutenticacao:
                  type: string
                  enum: [HMAC_SHA256]
                segredo: { type: string, minLength: 16, maxLength: 64 }
                integracaoId: { type: string, format: uuid }
      responses:
        '201':
          description: Webhook salvo (RN36), com o segredo só desta vez.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /admin/webhooks/{webhookId}:
    parameters:
      - in: path
        name: webhookId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Administração]
      summary: Ativar, desativar ou mudar os eventos do webhook (UC-30)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ativo: { type: boolean }
                eventos: { type: array, items: { type: string } }
      responses:
        '200':
          description: Webhook alterado e auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /webhooks/pagamentos:
    post:
      tags: [Webhooks]
      summary: Receber eventos do gateway de pagamento
      description: |
        Formato do Mercado Pago. A assinatura `X-Signature` (`ts=...,v1=...`, HMAC-SHA256 de
        `id:<data.id>;request-id:<X-Request-Id>;ts:<ts>;`) é conferida antes de tudo (RN36). O
        status vem de nova consulta ao gateway, nunca do corpo, e eventos repetidos não mudam
        nada (idempotente).
      security: []
      parameters:
        - in: header
          name: X-Signature
          required: true
          schema: { type: string }
        - in: header
          name: X-Request-Id
          required: true
          schema: { type: string }
        - in: query
          name: data.id
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, example: payment }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: "Evento processado." }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /health:
    get:
      tags: [Administração]
      summary: Verificação de saúde
      security: []
      responses:
        '200':
          description: API, banco e Redis disponíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /demonstracao:
    post:
      tags: [Demonstração]
      summary: Criar uma clínica de demonstração e entrar nela
      description: >-
        Cria, para quem visita, uma clínica temporária com dados fictícios (agenda, clientes,
        atendimentos, vacinas e cobranças) e devolve a sessão da conta da clínica. A clínica não
        aparece na busca dos tutores, não envia e-mails e expira sozinha. Só existe nos ambientes
        com a demonstração habilitada; nos outros responde 404.
      security: []
      responses:
        '201':
          description: Demonstração criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemonstracaoCriada' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '429': { description: "Muitas demonstrações criadas pelo mesmo endereço." }
  /demonstracao/tutor:
    post:
      tags: [Demonstração]
      summary: Entrar como a tutora da demonstração
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string, maxLength: 128 }
      responses:
        '201':
          description: Sessão da tutora da demonstração.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '410': { $ref: '#/components/responses/Expirado' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChamadoId:
      in: path
      name: chamadoId
      required: true
      schema: { type: string, format: uuid }
    PetId:
      in: path
      name: petId
      required: true
      schema: { type: string, format: uuid }
    EmpresaId:
      in: path
      name: empresaId
      required: true
      schema: { type: string, format: uuid }
    SolicitacaoId:
      in: path
      name: solicitacaoId
      required: true
      schema: { type: string, format: uuid }
    AgendamentoId:
      in: path
      name: agendamentoId
      required: true
      schema: { type: string, format: uuid }
    TokenLink:
      in: path
      name: token
      required: true
      description: Token do link de aceite e de revogação enviado ao cliente sem conta (RN41).
      schema: { type: string, minLength: 32 }
    Pagina:
      in: query
      name: pagina
      schema: { type: integer, minimum: 1, default: 1 }
    Tamanho:
      in: query
      name: tamanho
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    NaoAutenticado:
      description: Não autenticado ou sessão expirada (RN04).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SemPermissao:
      description: Sem permissão para o recurso (RN20, RN24, RN26).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflito:
      description: Conflito de regra de negócio (ex. RN01, RN08, RN14, RN29) ou transição de estado inválida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Validacao:
      description: Dados inválidos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Expirado:
      description: Token expirado ou já utilizado (RN05).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
  schemas:
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          description: Código de negócio, por exemplo RN14_CONFLITO_AGENDA.
        campos:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensagem: { type: string }
    DemonstracaoCriada:
      type: object
      required: [sessao, codigoTutor, expiraEm, formularioOpiniao, urlTutor]
      properties:
        sessao: { $ref: '#/components/schemas/Tokens' }
        codigoTutor:
          type: string
          description: Código de uso único para entrar como a tutora da demonstração no app.
        expiraEm: { type: string, format: date-time }
        formularioOpiniao:
          type: [string, 'null']
          format: uri
          description: Formulário de opinião mostrado durante a demonstração.
        urlTutor:
          type: [string, 'null']
          format: uri
          description: Versão web do app do tutor, para o "Ver como tutor".
    ResumoDoDia:
      type: object
      required: [data, agenda, solicitacoes, cobrancas, vacinas, semana]
      properties:
        data: { type: string, format: date }
        agenda:
          type: array
          items:
            type: object
            required: [id, inicio, fim, status, servicoNome, petId, petNome, especie, tutorNome, profissionalId, profissionalNome, recursoNome, alergias, atendimentoId, atendimentoStatus, confirmado, pago]
            properties:
              id: { type: string, format: uuid }
              inicio: { type: string, format: date-time }
              fim: { type: string, format: date-time }
              status: { type: string, enum: [AGENDADO, CANCELADO, REALIZADO, NAO_COMPARECEU] }
              servicoNome: { type: string }
              petId: { type: string, format: uuid }
              petNome: { type: string }
              especie: { type: string }
              tutorNome: { type: [string, 'null'] }
              profissionalId: { type: [string, 'null'], format: uuid }
              profissionalNome: { type: [string, 'null'] }
              recursoNome: { type: [string, 'null'] }
              alergias: { type: array, items: { type: string } }
              atendimentoId: { type: [string, 'null'], format: uuid }
              atendimentoStatus: { type: [string, 'null'], enum: [EM_ANDAMENTO, FINALIZADO, null] }
              confirmado: { type: boolean, description: "O tutor confirmou a presença pelo lembrete." }
              pago: { type: [boolean, 'null'], description: "null quando ainda não há cobrança." }
        solicitacoes:
          type: object
          required: [total, itens]
          properties:
            total: { type: integer }
            itens:
              type: array
              items:
                type: object
                required: [id, petNome, tutorNome, servicoNome, dataHoraDesejada, observacoes]
                properties:
                  id: { type: string, format: uuid }
                  petNome: { type: string }
                  tutorNome: { type: string }
                  servicoNome: { type: string }
                  dataHoraDesejada: { type: string, format: date-time }
                  observacoes: { type: [string, 'null'] }
        cobrancas:
          oneOf:
            - type: 'null'
            - type: object
              required: [total, valor, itens]
              properties:
                total: { type: integer }
                valor: { type: string, description: "Soma em reais, com duas casas." }
                itens:
                  type: array
                  items:
                    type: object
                    required: [id, tutorNome, petNome, descricao, valor, dataHora]
                    properties:
                      id: { type: string, format: uuid }
                      tutorNome: { type: string }
                      petNome: { type: [string, 'null'] }
                      descricao: { type: string }
                      valor: { type: string }
                      dataHora: { type: string, format: date-time }
        vacinas:
          type: array
          items:
            type: object
            required: [petId, petNome, tutorNome, tutorTelefone, vacina, proximaDose, atrasada]
            properties:
              petId: { type: string, format: uuid }
              petNome: { type: string }
              tutorNome: { type: [string, 'null'] }
              tutorTelefone: { type: [string, 'null'] }
              vacina: { type: string }
              proximaDose: { type: string, format: date }
              atrasada: { type: boolean }
        semana:
          type: object
          required: [faturamento, atendimentos]
          properties:
            faturamento: { type: [string, 'null'], description: "Recebido nos últimos 7 dias; null sem permissão do financeiro." }
            atendimentos: { type: integer }
    AgendamentoDetalhe:
      type: object
      required: [id, dataHoraInicio, dataHoraFim, status, servicoId, servicoNome, categoria, petId, petNome, alergias, tutorNome, profissionalNome, empresaNome, podeRegistrarSaude]
      properties:
        id: { type: string, format: uuid }
        dataHoraInicio: { type: string, format: date-time }
        dataHoraFim: { type: string, format: date-time }
        status: { type: string, enum: [AGENDADO, CANCELADO, REALIZADO, NAO_COMPARECEU] }
        servicoId: { type: string, format: uuid }
        servicoNome: { type: string }
        categoria: { type: string, enum: [CONSULTA, EXAME, CIRURGIA, VACINACAO, BANHO_TOSA, HOSPEDAGEM, PET_SITTER, CRECHE, OUTRO] }
        petId: { type: string, format: uuid }
        petNome: { type: string }
        alergias: { type: array, items: { type: string } }
        tutorNome: { type: [string, 'null'] }
        profissionalNome: { type: [string, 'null'] }
        empresaNome: { type: string }
        podeRegistrarSaude:
          type: boolean
          description: O tutor liberou à empresa a edição clínica (vacinas, exames e receitas) deste pet.
    FormaPagamento:
      type: string
      enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, DINHEIRO, BOLETO]
    PerfilPublicoEntrada:
      type: object
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{1,78}[a-z0-9])$'
          description: Endereço curto da página pública (/e/{slug}).
        descricao: { type: [string, 'null'], maxLength: 1500 }
        telefonePublico: { type: [string, 'null'], maxLength: 20 }
        whatsapp: { type: [string, 'null'], maxLength: 20 }
        instagram: { type: [string, 'null'], maxLength: 60 }
        horarioFuncionamento: { type: [string, 'null'], maxLength: 255 }
        formasPagamento: { type: array, items: { $ref: '#/components/schemas/FormaPagamento' } }
        politicaCancelamento: { type: [string, 'null'], maxLength: 1500 }
    PerfilPublico:
      type: object
      required: [id, nomeFantasia, tipo, slug, descricao, telefonePublico, whatsapp, instagram, horarioFuncionamento, formasPagamento, politicaCancelamento, enderecoLogradouro, enderecoNumero, enderecoBairro, enderecoCidade, enderecoUf]
      properties:
        verificacao:
          type: string
          enum: [EM_VERIFICACAO, VERIFICADA, RECUSADA]
          description: Só empresa verificada aparece na busca e na página pública.
        verificacaoMotivo: { type: string, nullable: true }
        id: { type: string, format: uuid }
        nomeFantasia: { type: string }
        tipo: { type: string, enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO] }
        slug: { type: [string, 'null'] }
        descricao: { type: [string, 'null'] }
        telefonePublico: { type: [string, 'null'] }
        whatsapp: { type: [string, 'null'] }
        instagram: { type: [string, 'null'] }
        horarioFuncionamento: { type: [string, 'null'] }
        formasPagamento: { type: array, items: { type: string } }
        politicaCancelamento: { type: [string, 'null'] }
        enderecoLogradouro: { type: string }
        enderecoNumero: { type: string }
        enderecoBairro: { type: string }
        enderecoCidade: { type: string }
        enderecoUf: { type: string }
    VitrineEmpresa:
      allOf:
        - $ref: '#/components/schemas/PerfilPublico'
        - type: object
          required: [servicos, avaliacoes]
          properties:
            avaliacoes:
              allOf:
                - $ref: '#/components/schemas/ResumoAvaliacoes'
                - type: object
                  required: [recentes]
                  properties:
                    recentes:
                      type: array
                      description: As 5 últimas avaliações com comentário.
                      items: { $ref: '#/components/schemas/Avaliacao' }
            servicos:
              type: array
              items:
                type: object
                required: [id, nome, categoria, preco, duracaoMinutos]
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  categoria: { type: string }
                  preco: { type: string, description: "Em reais, com duas casas." }
                  duracaoMinutos: { type: integer }
    AvaliacaoEntrada:
      type: object
      required: [nota]
      properties:
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, maxLength: 1000 }
    Avaliacao:
      type: object
      required: [id, agendamentoId, nota, criadoEm, autor, servico, pet]
      properties:
        id: { type: string, format: uuid }
        agendamentoId: { type: string, format: uuid }
        nota: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string }
        resposta: { type: string, description: "Resposta da empresa." }
        respondidaEm: { type: string, format: date-time }
        criadoEm: { type: string, format: date-time }
        autor: { type: string, description: "Nome de quem avaliou (só o primeiro nome na página pública)." }
        servico: { type: string }
        pet: { type: string }
    AvaliacaoPendente:
      type: object
      required: [agendamentoId, realizadoEm, empresaId, empresa, servicoId, servico, petId, pet]
      properties:
        agendamentoId: { type: string, format: uuid }
        realizadoEm: { type: string, format: date-time }
        empresaId: { type: string, format: uuid }
        empresa: { type: string }
        slug: { type: string }
        servicoId: { type: string, format: uuid }
        servico: { type: string }
        petId: { type: string, format: uuid }
        pet: { type: string }
        procedimentos: { type: string, description: "O que a empresa registrou no atendimento." }
    ResumoAvaliacoes:
      type: object
      required: [media, total, distribuicao]
      properties:
        media: { type: number, nullable: true, description: "Uma casa decimal; nula sem avaliações." }
        total: { type: integer }
        distribuicao:
          type: array
          description: Quantidade de avaliações por nota, da 1 à 5.
          minItems: 5
          maxItems: 5
          items: { type: integer }
    LinhaImportacaoCliente:
      type: object
      required: [nome]
      properties:
        nome: { type: string, maxLength: 255 }
        telefone: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 255 }
        cpf: { type: string, maxLength: 20 }
        observacoes: { type: string, maxLength: 2000 }
        petNome: { type: string, maxLength: 255 }
        petEspecie: { type: string, maxLength: 60, description: "Ex.: Cachorro, Gato (aceita cão, gata...)." }
        petRaca: { type: string, maxLength: 80 }
        petSexo: { type: string, maxLength: 10, description: "M, F, Macho ou Fêmea." }
        petNascimento: { type: string, maxLength: 10, description: "DD/MM/AAAA ou AAAA-MM-DD." }
    PlanoEmpresa:
      type: string
      enum: [ESSENCIAL, EQUIPE, CLINICA]
    PlanoDaEmpresa:
      type: object
      required: [plano, status, emDia, testeAte, diasDeTeste, limites, uso, planos]
      properties:
        plano: { $ref: '#/components/schemas/PlanoEmpresa' }
        status: { type: string, enum: [TESTE, PENDENTE, ATIVA, ATRASADA, CANCELADA] }
        emDia: { type: boolean, description: "Teste no prazo, plano ativo ou atraso dentro da tolerância de 7 dias." }
        testeAte: { type: string, format: date-time }
        diasDeTeste: { type: integer }
        periodoAte: { type: string, format: date-time }
        limites:
          type: object
          required: [usuarios]
          properties:
            usuarios: { type: integer }
        uso:
          type: object
          required: [usuarios]
          properties:
            usuarios: { type: integer }
        planos:
          type: array
          items:
            type: object
            required: [plano, nome, precoMensal, usuarios, descricao]
            properties:
              plano: { $ref: '#/components/schemas/PlanoEmpresa' }
              nome: { type: string }
              precoMensal: { type: number }
              usuarios: { type: integer }
              descricao: { type: string }
    CodigoDoisFatores:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string, maxLength: 20 }
    ConsultaCnpj:
      type: object
      required: [cnpj, encontrado, jaCadastrado, elegivel]
      properties:
        cnpj: { type: string }
        encontrado: { type: boolean }
        jaCadastrado: { type: boolean }
        elegivel: { type: boolean }
        baseIndisponivel: { type: boolean, description: "A base da Receita não respondeu: o cadastro segue em verificação." }
        motivo: { type: string }
        razaoSocial: { type: string }
        nomeFantasia: { type: string }
        situacao: { type: string }
        atividade: { type: string }
        endereco: { $ref: '#/components/schemas/Endereco' }
    PendenciasVerificacao:
      type: object
      required: [empresas, contestacoes]
      properties:
        empresas:
          type: array
          items:
            type: object
            required: [id, cnpj, razaoSocial, nomeFantasia, email, cadastradaEm]
            properties:
              id: { type: string, format: uuid }
              cnpj: { type: string }
              razaoSocial: { type: string }
              nomeFantasia: { type: string }
              responsavelNome: { type: string, nullable: true }
              cnae: { type: string, nullable: true }
              enderecoCidade: { type: string }
              enderecoUf: { type: string }
              verificacaoMotivo: { type: string, nullable: true }
              email: { type: string }
              telefone: { type: string }
              cadastradaEm: { type: string, format: date-time }
        contestacoes:
          type: array
          items:
            type: object
            required: [id, cnpj, nome, email, mensagem, criadoEm]
            properties:
              id: { type: string, format: uuid }
              cnpj: { type: string }
              nome: { type: string }
              email: { type: string }
              telefone: { type: string, nullable: true }
              mensagem: { type: string }
              criadoEm: { type: string, format: date-time }
    FotoDoPet:
      type: object
      required: [id, url, tiradaEm, enviadaPor]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        legenda: { type: string }
        tiradaEm: { type: string, format: date }
        enviadaPor: { type: string, description: "Primeiro nome de quem enviou." }
    CuidadorHoje:
      type: object
      required: [tutorId, nome, souEu]
      properties:
        tutorId: { type: string, format: uuid }
        nome: { type: string, description: "Primeiro nome." }
        souEu: { type: boolean }
    AvisoPetPerdido:
      type: object
      required: [perdido]
      properties:
        perdido: { type: boolean }
        desde: { type: string, format: date-time }
        local: { type: string }
        telefone: { type: string }
        mensagem: { type: string }
        codigo: { type: string }
        url: { type: string, format: uri, description: "Página pública com o cartaz e o QR Code." }
    TipoRotina:
      type: string
      enum: [PASSEIO, BANHO, ANTIPULGAS, VERMIFUGO, ESCOVACAO, AREIA, ALIMENTACAO, OUTRO]
    FrequenciaRotina:
      type: string
      enum: [DIARIA, SEMANAL, MENSAL, INTERVALO_DIAS]
    RotinaEntrada:
      type: object
      required: [titulo, tipo, frequencia]
      properties:
        titulo: { type: string, maxLength: 120 }
        tipo: { $ref: '#/components/schemas/TipoRotina' }
        frequencia: { $ref: '#/components/schemas/FrequenciaRotina' }
        intervaloDias: { type: integer, minimum: 1, maximum: 365, description: "Obrigatório em INTERVALO_DIAS." }
        diasSemana:
          type: array
          description: Obrigatório em SEMANAL. 0 = domingo ... 6 = sábado.
          items: { type: integer, minimum: 0, maximum: 6 }
        horarios:
          type: array
          maxItems: 6
          items: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        dataInicio: { type: string, format: date }
    Rotina:
      allOf:
        - $ref: '#/components/schemas/RotinaEntrada'
        - type: object
          required: [id, petId, intervaloDias, diasSemana, horarios, dataInicio]
          properties:
            id: { type: string, format: uuid }
            petId: { type: string, format: uuid }
            intervaloDias: { type: [integer, 'null'] }
    ModeloRotina:
      type: object
      required: [tipo, titulo, frequencia, horarios, descricao]
      properties:
        tipo: { $ref: '#/components/schemas/TipoRotina' }
        titulo: { type: string }
        frequencia: { $ref: '#/components/schemas/FrequenciaRotina' }
        intervaloDias: { type: integer }
        diasSemana: { type: array, items: { type: integer } }
        horarios: { type: array, items: { type: string } }
        descricao: { type: string }
    ItemDoDia:
      type: object
      required: [tipo, id, titulo, detalhe, horario, previstaPara, feito, feitoPor, feitoEm]
      properties:
        tipo: { type: string, enum: [REMEDIO, ROTINA] }
        id: { type: string, format: uuid, description: "Tratamento ou rotina." }
        titulo: { type: string }
        detalhe: { type: [string, 'null'] }
        horario: { type: [string, 'null'], description: "HH:MM em Brasília." }
        previstaPara: { type: [string, 'null'], format: date-time, description: "Instante da dose do remédio." }
        feito: { type: boolean }
        feitoPor: { type: [string, 'null'], description: "Primeiro nome de quem fez." }
        feitoEm: { type: [string, 'null'], format: date-time }
    HojeTutor:
      type: object
      required: [data, pets, agendamentos, vacinas]
      properties:
        data: { type: string, format: date }
        pets:
          type: array
          items:
            type: object
            required: [id, nome, especie, fotoUrl, itens]
            properties:
              id: { type: string, format: uuid }
              nome: { type: string }
              especie: { type: string }
              fotoUrl: { type: [string, 'null'] }
              itens: { type: array, items: { $ref: '#/components/schemas/ItemDoDia' } }
              responsaveis:
                type: array
                items:
                  type: object
                  required: [tutorId, nome]
                  properties:
                    tutorId: { type: string, format: uuid }
                    nome: { type: string }
              cuidadorHoje:
                oneOf:
                  - $ref: '#/components/schemas/CuidadorHoje'
                  - type: 'null'
        agendamentos:
          type: array
          items:
            type: object
            required: [id, petId, petNome, servicoNome, empresaNome, inicio, confirmado]
            properties:
              id: { type: string, format: uuid }
              petId: { type: string, format: uuid }
              petNome: { type: string }
              servicoNome: { type: string }
              empresaNome: { type: string }
              inicio: { type: string, format: date-time }
              confirmado: { type: boolean }
        vacinas:
          type: array
          items:
            type: object
            required: [petId, vacina, proximaDose, atrasada]
            properties:
              petId: { type: string, format: uuid }
              vacina: { type: string }
              proximaDose: { type: string, format: date }
              atrasada: { type: boolean }
        sugestoes:
          type: array
          description: >-
            Lembretes do tipo "faz 2 meses do último banho", a partir dos serviços já feitos (banho e tosa
            depois de 45 dias, consulta depois de 330), quando não há outro agendado. Não é recomendação veterinária.
          items:
            type: object
            required: [petId, petNome, servicoId, servicoNome, empresaNome, diasDesde, texto]
            properties:
              petId: { type: string, format: uuid }
              petNome: { type: string }
              servicoId: { type: string, format: uuid }
              servicoNome: { type: string }
              empresaNome: { type: string }
              diasDesde: { type: integer }
              texto: { type: string }
        celebracoes:
          type: array
          description: Aniversário do pet e aniversário dele no Jaguara, no dia.
          items:
            type: object
            required: [petId, petNome, tipo, anos]
            properties:
              petId: { type: string, format: uuid }
              petNome: { type: string }
              tipo: { type: string, enum: [ANIVERSARIO, ANIVERSARIO_JAGUARA] }
              anos: { type: integer }
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiraEm]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEm: { type: string, format: date-time }
    Endereco:
      type: object
      required: [cep, logradouro, numero, bairro, cidade, uf]
      properties:
        cep: { type: string, pattern: '^[0-9]{8}$' }
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string, pattern: '^[A-Z]{2}$' }
    CadastroTutor:
      type: object
      required: [nome, cpf, email, senha, aceiteTermos]
      properties:
        nome: { type: string }
        cpf: { type: string, pattern: '^[0-9]{11}$' }
        email: { type: string, format: email }
        telefone: { type: string }
        senha: { type: string, format: password, minLength: 8 }
        aceiteTermos:
          type: boolean
          const: true
          description: Aceite das versões vigentes dos termos de uso do app e da política de privacidade (RN42).
    CadastroEmpresa:
      type: object
      required: [cnpj, razaoSocial, nomeFantasia, tipo, email, senha, endereco, aceiteTermos]
      properties:
        cnpj: { type: string, pattern: '^[0-9]{14}$' }
        razaoSocial: { type: string }
        nomeFantasia: { type: string }
        tipo:
          type: string
          enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO]
        email: { type: string, format: email }
        senha: { type: string, format: password, minLength: 8 }
        responsavelNome:
          type: string
          maxLength: 255
          description: >-
            Quem cadastra. Se o nome estiver no quadro de sócios do CNPJ, a empresa fica verificada
            na hora; senão, fica em verificação até o administrador analisar (e não aparece na busca).
        endereco: { $ref: '#/components/schemas/Endereco' }
        aceiteTermos:
          type: boolean
          const: true
          description: Aceite das versões vigentes dos termos da Enterprise e da política de privacidade (RN42).
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [PENDENTE_CONFIRMACAO, ATIVA, BLOQUEADA, SUSPENSA, INATIVA]
        perfil: { type: string }
    StatusPet:
      type: string
      enum: [ATIVO, ARQUIVADO, FALECIDO]
    TipoResponsavel:
      type: string
      enum: [PRINCIPAL, ADICIONAL]
    TipoDocumento:
      type: string
      enum: [RG_ANIMAL, CARTEIRA_VACINACAO, ATESTADO, RECEITA, LAUDO, PEDIGREE, OUTRO]
    PetEntrada:
      type: object
      required: [nome, racaId, sexo, castrado]
      properties:
        nome: { type: string }
        racaId: { type: string, format: uuid }
        racaDescricao:
          type: string
          maxLength: 80
          description: Raça escrita pelo tutor. Obrigatória quando a raça escolhida é "Outra (digitar)".
        dataNascimento: { type: string, format: date }
        sexo: { type: string, enum: [MACHO, FEMEA] }
        pesoKg: { type: number, exclusiveMinimum: 0 }
        cor: { type: string }
        microchip: { type: string }
        castrado: { type: boolean }
    ContagemRelatorio:
      type: object
      required: [chave, quantidade]
      properties:
        chave: { type: string }
        quantidade: { type: integer }
        total: { type: number }
    RelatorioAtendimentos:
      type: object
      required: [tipo, de, ate, total, taxaComparecimento, porStatus, porServico, porProfissional, agendamentos]
      properties:
        tipo: { type: string, enum: [atendimentos] }
        de: { type: string, format: date }
        ate: { type: string, format: date }
        total: { type: integer }
        taxaComparecimento: { type: number, description: "Percentual de realizados entre realizados e faltas." }
        porStatus: { type: array, items: { $ref: '#/components/schemas/ContagemRelatorio' } }
        porServico: { type: array, items: { $ref: '#/components/schemas/ContagemRelatorio' } }
        porProfissional: { type: array, items: { $ref: '#/components/schemas/ContagemRelatorio' } }
        agendamentos:
          type: array
          items:
            type: object
            properties:
              dataHora: { type: string, format: date-time }
              pet: { type: string }
              servico: { type: string }
              profissional: { type: string }
              status: { type: string }
              atendimentoFinalizado: { type: boolean }
    RelatorioFinanceiro:
      type: object
      required: [tipo, de, ate, faturamento, pagamentosConfirmados, ticketMedio, pendentes, porServico, porMetodo]
      properties:
        tipo: { type: string, enum: [financeiro] }
        de: { type: string, format: date }
        ate: { type: string, format: date }
        faturamento: { type: number }
        pagamentosConfirmados: { type: integer }
        ticketMedio: { type: number }
        pendentes:
          type: object
          properties:
            quantidade: { type: integer }
            total: { type: number }
        porServico: { type: array, items: { $ref: '#/components/schemas/ContagemRelatorio' } }
        porMetodo: { type: array, items: { $ref: '#/components/schemas/ContagemRelatorio' } }
    StatusConta:
      type: string
      enum: [PENDENTE_CONFIRMACAO, ATIVA, BLOQUEADA, SUSPENSA, INATIVA]
    ContaResumo:
      type: object
      required: [id, email, nome, tipo, status, dataCadastro]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nome: { type: string }
        tipo: { type: string, enum: [TUTOR, EMPRESA, FUNCIONARIO, ADMINISTRADOR] }
        status: { $ref: '#/components/schemas/StatusConta' }
        dataCadastro: { type: string, format: date-time }
    ContaDetalhe:
      allOf:
        - $ref: '#/components/schemas/ContaResumo'
        - type: object
          required: [emailConfirmado, sessoesAtivas, historico]
          properties:
            emailConfirmado: { type: boolean }
            sessoesAtivas: { type: integer }
            historico:
              type: array
              items:
                type: object
                required: [dataHora, acao]
                properties:
                  dataHora: { type: string, format: date-time }
                  acao: { type: string, enum: [CONTA_REATIVADA, CONTA_BLOQUEADA, CONTA_SUSPENSA] }
                  autorId: { type: string, format: uuid }
                  motivo: { type: string }
    RelatorioDespesas:
      type: object
      required: [de, ate, total, porCategoria, despesas]
      properties:
        de: { type: string, format: date }
        ate: { type: string, format: date }
        petId: { type: string, format: uuid }
        total: { type: number }
        porCategoria:
          type: array
          items:
            type: object
            properties:
              categoria: { type: string }
              quantidade: { type: integer }
              total: { type: number }
        despesas:
          type: array
          items:
            type: object
            properties:
              descricao: { type: string }
              valor: { type: number }
              data: { type: string, format: date }
              categoria: { type: string }
              pet: { type: string }
    Documento:
      type: object
      required: [id, titulo, tipo, nomeArquivo, dataUpload]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        tipo: { $ref: '#/components/schemas/TipoDocumento' }
        nomeArquivo: { type: string }
        dataEmissao: { type: string, format: date }
        dataValidade: { type: string, format: date }
        dataUpload: { type: string, format: date-time }
    PetVinculado:
      type: object
      required: [id, nome, especie, raca, sexo, status, motivos, secoes]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        especie: { type: string }
        raca: { type: string }
        fotoUrl: { type: string, format: uri }
        sexo: { type: string }
        idade: { type: integer }
        status: { type: string }
        motivos:
          type: array
          items: { type: string, enum: [COMPARTILHAMENTO, AGENDAMENTO, CLIENTE] }
        secoes:
          type: array
          items: { type: string, enum: [vacinas, exames, medicamentos, alergias] }
    PerfilPetEmpresa:
      allOf:
        - $ref: '#/components/schemas/PetVinculado'
        - type: object
          properties:
            vacinas:
              type: array
              items:
                type: object
                properties:
                  nomeVacina: { type: string }
                  dataAplicacao: { type: string, format: date }
                  dataProximaDose: { type: string, format: date }
            exames:
              type: array
              items:
                type: object
                properties:
                  tipoExame: { type: string }
                  dataRealizacao: { type: string, format: date }
                  resultado: { type: string }
            medicamentos:
              type: array
              items:
                type: object
                properties:
                  medicamento: { type: string }
                  dosagem: { type: string }
                  status: { type: string }
                  dataInicio: { type: string, format: date }
            alergias:
              type: array
              items:
                type: object
                properties:
                  tipo: { type: string }
                  descricao: { type: string }
                  gravidade: { type: string }
    Pet:
      allOf:
        - $ref: '#/components/schemas/PetEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            especie: { type: string }
            raca: { type: string, description: "Nome da raça, ou a raça escrita pelo tutor." }
            idade: { type: integer }
            status: { $ref: '#/components/schemas/StatusPet' }
            fotoUrl: { type: string, format: uri, description: "Leitura assinada da foto, válida por 6 horas." }
    PaginaPets:
      type: object
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Pet' }
        total: { type: integer }
        pagina: { type: integer }
    CompartilhamentoEntrada:
      type: object
      required: [escopos]
      properties:
        destinatarioEmail: { type: string, format: email }
        empresaId: { type: string, format: uuid }
        escopos:
          type: array
          minItems: 1
          items:
            type: string
            enum: [PERFIL_BASICO, VACINAS, EXAMES, MEDICAMENTOS, ALERGIAS, DOCUMENTOS, LINHA_DO_TEMPO, EDICAO_CLINICA]
        dataExpiracao: { type: string, format: date-time }
    Compartilhamento:
      allOf:
        - $ref: '#/components/schemas/CompartilhamentoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [ATIVO, REVOGADO, EXPIRADO] }
            link: { type: string, format: uri }
    VacinacaoEntrada:
      type: object
      required: [nomeVacina, dataAplicacao, responsavelAplicacao]
      properties:
        nomeVacina: { type: string }
        fabricante: { type: string }
        lote: { type: string }
        dataAplicacao: { type: string, format: date }
        dataProximaDose:
          type: string
          format: date
          description: Agenda o lembrete aos responsáveis às 9h do dia anterior (RN37).
        responsavelAplicacao: { type: string, minLength: 1 }
        observacoes: { type: string, maxLength: 2000 }
    Vacinacao:
      allOf:
        - $ref: '#/components/schemas/VacinacaoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            valido: { type: boolean }
            verificadaPor:
              type: string
              description: >-
                Nome da empresa que registrou a vacina no atendimento. A carteira mostra o selo
                "Aplicada por" com esse nome; sem o campo, o registro foi feito pelo tutor.
    TratamentoEntrada:
      type: object
      required: [medicamento, dosagem, viaAdministracao, intervaloHoras, dataInicio]
      properties:
        medicamento: { type: string }
        dosagem: { type: string }
        viaAdministracao: { type: string }
        intervaloHoras: { type: integer, minimum: 1, maximum: 720 }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        horaPrimeiraDose:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          default: '08:00'
          description: Hora da primeira dose, em Brasília.
        observacoes: { type: string, maxLength: 2000 }
    Tratamento:
      type: object
      properties:
        id: { type: string, format: uuid }
        medicamento: { type: string }
        dosagem: { type: string }
        viaAdministracao: { type: string }
        intervaloHoras: { type: integer }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        status: { type: string, enum: [ATIVO, FINALIZADO, SUSPENSO] }
        observacoes: { type: string }
        lembretesAgendados:
          type: integer
          description: Só na resposta do cadastro.
    ExameEntrada:
      type: object
      required: [tipoExame, dataRealizacao]
      properties:
        tipoExame: { type: string }
        dataRealizacao: { type: string, format: date }
        laboratorio: { type: string }
        resultado: { type: string }
        documentoId:
          type: string
          format: uuid
          description: Documento do próprio pet usado como laudo (UC-34).
        observacoes: { type: string, maxLength: 2000 }
    PlanoAlimentar:
      type: object
      properties:
        id: { type: string, format: uuid }
        alimento: { type: string }
        metaDiariaGramas: { type: number }
        limiteDiarioGramas: { type: number }
        refeicoesPorDia: { type: integer }
        dataInicio: { type: string, format: date }
    Refeicao:
      type: object
      properties:
        id: { type: string, format: uuid }
        dataHora: { type: string, format: date-time }
        alimento: { type: string }
        quantidadeGramas: { type: number }
        observacao: { type: string }
    ResumoAlimentar:
      type: object
      properties:
        consumoDoDia: { type: number }
        metaDiariaGramas: { type: number }
        limiteDiarioGramas: { type: number }
        percentualMeta: { type: integer }
        limiteExcedido: { type: boolean }
    Exame:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipoExame: { type: string }
        dataRealizacao: { type: string, format: date }
        laboratorio: { type: string }
        resultado: { type: string }
        documentoId: { type: string, format: uuid }
        temArquivo:
          type: boolean
          description: Há laudo anexado; o arquivo sai só por URL assinada (ARQ-03, seção 3.6).
        observacoes: { type: string }
    AlergiaEntrada:
      type: object
      required: [tipo, descricao, gravidade]
      properties:
        tipo: { type: string, enum: [ALERGIA, RESTRICAO_ALIMENTAR, RESTRICAO_MEDICAMENTOSA, OUTRA] }
        descricao: { type: string }
        gravidade: { type: string, enum: [LEVE, MODERADA, GRAVE] }
        dataIdentificacao: { type: string, format: date }
        observacoes: { type: string, maxLength: 2000 }
    Alergia:
      allOf:
        - $ref: '#/components/schemas/AlergiaEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            destaque: { type: boolean, description: Alergia grave, em destaque no perfil. }
    ItemLinhaDoTempo:
      type: object
      properties:
        data: { type: string, format: date-time }
        tipo: { type: string, enum: [VACINACAO, EXAME, TRATAMENTO, EVENTO, ATENDIMENTO, FOTO] }
        titulo: { type: string }
        referenciaId: { type: string, format: uuid }
        imagemUrl: { type: string, format: uri, description: "Foto do álbum (tipo FOTO, só para a família)." }
    EventoEntrada:
      type: object
      required: [titulo, tipo, dataHoraInicio]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        tipo:
          type: string
          enum: [CONSULTA, VACINA, MEDICAMENTO, EXAME, CIRURGIA, BANHO_TOSA, HOSPEDAGEM, COMPROMISSO, OUTRO]
        dataHoraInicio: { type: string, format: date-time }
        dataHoraFim: { type: string, format: date-time }
        local: { type: string }
    Evento:
      allOf:
        - $ref: '#/components/schemas/EventoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            origem: { type: string, enum: [MANUAL, AGENDAMENTO, CALENDARIO_EXTERNO] }
            confirmado:
              type: boolean
              description: Só em agendamentos com empresa; o responsável já confirmou a presença.
    DespesaEntrada:
      type: object
      required: [descricao, valor, data, categoriaId]
      properties:
        descricao: { type: string }
        valor: { type: number, exclusiveMinimum: 0 }
        data: { type: string, format: date }
        categoriaId: { type: string, format: uuid }
    Despesa:
      allOf:
        - $ref: '#/components/schemas/DespesaEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            categoria: { type: string }
    ServicoEntrada:
      type: object
      required: [nome, descricao, categoria, preco, duracaoMinutos]
      properties:
        nome: { type: string }
        descricao: { type: string }
        categoria:
          type: string
          enum: [CONSULTA, EXAME, CIRURGIA, VACINACAO, BANHO_TOSA, HOSPEDAGEM, PET_SITTER, CRECHE, OUTRO]
        preco: { type: number, minimum: 0 }
        duracaoMinutos: { type: integer, minimum: 5 }
        ativo: { type: boolean, default: true }
    Servico:
      allOf:
        - $ref: '#/components/schemas/ServicoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
    EmpresaPublica:
      type: object
      properties:
        id: { type: string, format: uuid }
        nomeFantasia: { type: string }
        tipo:
          type: string
          enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO]
        bairro: { type: string }
        cidade: { type: string }
        uf: { type: string }
        categorias:
          type: array
          description: Categorias dos serviços ativos.
          items: { type: string }
        slug: { type: string }
        descricao: { type: string }
        telefone: { type: string }
        whatsapp: { type: string }
        instagram: { type: string }
        horarioFuncionamento: { type: string }
        formasPagamento: { type: array, items: { type: string } }
        politicaCancelamento: { type: string }
        distanciaKm: { type: number, description: "Distância em linha reta até o tutor, na busca por perto." }
        notaMedia: { type: number, description: "Média das avaliações, com uma casa." }
        totalAvaliacoes: { type: integer }
        precoAPartirDe: { type: number, description: "Menor preço entre os serviços ativos, em reais." }
    PaginaEmpresas:
      type: object
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/EmpresaPublica' }
        total: { type: integer }
        pagina: { type: integer }
        tamanho: { type: integer }
    Cliente:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nome: { type: string }
        cpf: { type: string, description: CPF mascarado (ARQ-02). }
        telefone: { type: string }
        email: { type: string, format: email }
        possuiConta: { type: boolean, description: Ligado a uma conta de tutor (ADR-010). }
        ativo: { type: boolean }
        consentimento:
          type: string
          enum: [PENDENTE, VIGENTE, REVOGADO]
        linkTermo:
          type: string
          format: uri
          description: Link do termo para o cliente aceitar (só enquanto pendente).
        possuiTermoAnexado: { type: boolean, description: "A cópia do termo assinado está anexada." }
        urlEnvioTermo:
          type: string
          format: uri
          description: URL para enviar a cópia do termo com PUT (só na resposta do cadastro com evidenciaArquivo).
    Especie:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        racas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              nome: { type: string }
    HorarioAtuacao:
      allOf:
        - $ref: '#/components/schemas/HorarioAtuacaoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
    RecursoEntrada:
      type: object
      required: [nome, tipo]
      properties:
        nome: { type: string }
        tipo:
          type: string
          enum: [SALA, EQUIPAMENTO, BAIA, VEICULO, OUTRO]
        ativo: { type: boolean, default: true }
    Recurso:
      allOf:
        - $ref: '#/components/schemas/RecursoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            empresaId: { type: string, format: uuid }
    HorarioAtuacaoEntrada:
      type: object
      required: [diaSemana, horaInicio, horaFim]
      properties:
        diaSemana:
          type: string
          enum: [SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO, DOMINGO]
        horaInicio: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        horaFim: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        funcionarioId: { type: string, format: uuid }
        recursoId: { type: string, format: uuid }
      oneOf:
        - required: [funcionarioId]
        - required: [recursoId]
    StatusSolicitacao:
      type: string
      enum: [PENDENTE, ACEITA, RECUSADA, CANCELADA, CONCLUIDA, ENCERRADA]
    Solicitacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        servicoId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        tutorId: { type: string, format: uuid }
        dataHoraDesejada: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/StatusSolicitacao' }
        motivoRecusa: { type: string }
        servico: { type: string, description: Nome do serviço (na listagem). }
        pet: { type: string, description: Nome do pet (na listagem). }
        tutor: { type: string, description: Nome do tutor (na listagem). }
        observacoes: { type: string, description: Observações do tutor ao pedir (na listagem). }
    HistoricoSolicitacao:
      type: object
      required: [dataHora, statusNovo, autor]
      properties:
        dataHora: { type: string, format: date-time }
        statusAnterior: { $ref: '#/components/schemas/StatusSolicitacao' }
        statusNovo: { $ref: '#/components/schemas/StatusSolicitacao' }
        autor: { type: string, description: '"Você" ou o nome da empresa.' }
        descricao: { type: string }
    DetalheSolicitacao:
      type: object
      required: [id, status, dataHoraDesejada, servico, empresa, pet, podeCancelar, historico]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusSolicitacao' }
        dataHoraDesejada: { type: string, format: date-time }
        observacoes: { type: string }
        motivoRecusa: { type: string }
        servico:
          type: object
          required: [id, nome, preco, duracaoMinutos]
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
            preco: { type: number }
            duracaoMinutos: { type: integer }
        empresa:
          type: object
          required: [id, nome]
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        pet:
          type: object
          required: [id, nome]
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        agendamento:
          type: object
          required: [id, dataHoraInicio, precoContratado, status]
          properties:
            id: { type: string, format: uuid }
            dataHoraInicio: { type: string, format: date-time }
            precoContratado: { type: number }
            status: { type: string, enum: [AGENDADO, CANCELADO, REALIZADO, NAO_COMPARECEU] }
            pagamento: { $ref: '#/components/schemas/StatusPagamento' }
        podeCancelar: { type: boolean }
        motivoSemCancelamento: { type: string }
        historico:
          type: array
          items: { $ref: '#/components/schemas/HistoricoSolicitacao' }
        descricao: { type: string }
    AgendamentoEntrada:
      type: object
      required: [servicoId, petId, dataHoraInicio]
      properties:
        servicoId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        dataHoraInicio: { type: string, format: date-time }
        profissionalId: { type: string, format: uuid }
        recursoId: { type: string, format: uuid }
    Agendamento:
      allOf:
        - $ref: '#/components/schemas/AgendamentoEntrada'
        - type: object
          properties:
            id: { type: string, format: uuid }
            dataHoraFim: { type: string, format: date-time }
            precoContratado:
              type: number
              description: Congelado na criação (RN27).
            status:
              type: string
              enum: [AGENDADO, CANCELADO, REALIZADO, NAO_COMPARECEU]
            confirmadoEm:
              type: string
              format: date-time
              description: Quando um responsável confirmou a presença pelo lembrete.
    AtendimentoEntrada:
      type: object
      required: [procedimentosRealizados, itens]
      properties:
        procedimentosRealizados: { type: string }
        observacoesClinicas: { type: string }
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [servicoId, quantidade]
            properties:
              servicoId: { type: string, format: uuid }
              quantidade: { type: integer, minimum: 1 }
              observacao: { type: string }
    Atendimento:
      type: object
      properties:
        id: { type: string, format: uuid }
        agendamentoId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        status: { type: string, enum: [EM_ANDAMENTO, FINALIZADO] }
        procedimentosRealizados: { type: string }
        observacoesClinicas: { type: string }
        total: { type: number }
        finalizadoEm: { type: string, format: date-time }
        itens:
          type: array
          items:
            type: object
            properties:
              servicoId: { type: string, format: uuid }
              quantidade: { type: integer }
              valorUnitario:
                type: number
                description: Preço contratado para o serviço agendado (RN27); preço atual para extras.
              observacao: { type: string }
    Funcionario:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        cargo: { type: string }
        perfil: { type: string }
        perfilId: { type: string, format: uuid }
        ativo: { type: boolean }
        pendente: { type: boolean, description: "Convite ainda não aceito: o funcionário não criou a senha (RN02)." }
    StatusChamado:
      type: string
      enum: [ABERTO, EM_ANALISE, AGUARDANDO_INFORMACAO, RESOLVIDO, FECHADO]
    MensagemChamado:
      type: object
      required: [mensagem]
      properties:
        mensagem: { type: string, minLength: 5, maxLength: 2000 }
    Chamado:
      type: object
      required: [id, protocolo, titulo, descricao, status, dataAbertura]
      properties:
        id: { type: string, format: uuid }
        protocolo: { type: string, example: SUP-20261126-7K2QD }
        titulo: { type: string }
        descricao: { type: string }
        status: { $ref: '#/components/schemas/StatusChamado' }
        dataAbertura: { type: string, format: date-time }
        dataFechamento: { type: string, format: date-time }
    ChamadoResumo:
      allOf:
        - $ref: '#/components/schemas/Chamado'
        - type: object
          required: [solicitante]
          properties:
            solicitante:
              type: object
              required: [id, nome, email, tipo]
              properties:
                id: { type: string, format: uuid }
                nome: { type: string }
                email: { type: string, format: email }
                tipo: { type: string, enum: [TUTOR, EMPRESA, FUNCIONARIO, ADMINISTRADOR] }
            atendente: { type: string, description: Nome do administrador que atendeu por último. }
    ChamadoDetalhe:
      allOf:
        - $ref: '#/components/schemas/ChamadoResumo'
        - type: object
          required: [intervencoes]
          properties:
            intervencoes:
              type: array
              items:
                type: object
                required: [dataHora, acaoExecutada, descricao, autor]
                properties:
                  dataHora: { type: string, format: date-time }
                  acaoExecutada: { type: string }
                  descricao: { type: string }
                  autor: { type: string }
    PerfilGlobal:
      type: object
      required: [id, nome, categoria, permissoes, usuarios]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        descricao: { type: string }
        categoria: { type: string, enum: [TUTOR, EMPRESA, ADMINISTRADOR] }
        permissoes:
          type: array
          items: { type: string }
        usuarios: { type: integer }
    PerfilEntrada:
      type: object
      required: [nome, permissoes]
      properties:
        nome: { type: string, minLength: 3, maxLength: 60 }
        descricao: { type: string, maxLength: 255 }
        permissoes:
          type: array
          minItems: 1
          items: { type: string }
    PerfilDaEmpresa:
      type: object
      required: [id, nome, permissoes]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        descricao: { type: string }
        permissoes:
          type: array
          items: { type: string }
    MetodoPagamento:
      type: string
      enum: [CARTAO_CREDITO, CARTAO_DEBITO, PIX, BOLETO]
    StatusPagamento:
      type: string
      enum: [PENDENTE, ACEITO, CANCELADO, RECUSADO]
    Pagamento:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigoTransacao: { type: string }
        valor: { type: number }
        dataHora: { type: string, format: date-time }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        status: { $ref: '#/components/schemas/StatusPagamento' }
        dataConfirmacao: { type: string, format: date-time }
        agendamentoId: { type: string, format: uuid }
        qrCode:
          type: string
          description: PIX copia e cola, só na resposta da criação.
        boleto:
          type: object
          description: Boleto emitido, só na resposta da criação.
          required: [url, linhaDigitavel, vencimento]
          properties:
            url: { type: string, format: uri, description: Link para abrir ou imprimir o boleto. }
            linhaDigitavel: { type: string }
            vencimento: { type: string, format: date-time }
        motivoRecusa:
          type: string
          description: Motivo da recusa em linguagem do tutor, só quando RECUSADO.
        notaFiscalUrl: { type: string, format: uri }
    PagamentoDetalhado:
      type: object
      required: [id, codigoTransacao, valor, dataHora, metodo, status, descricao, contraparte, podeReembolsar]
      properties:
        id: { type: string, format: uuid }
        codigoTransacao: { type: string }
        valor: { type: number }
        dataHora: { type: string, format: date-time }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        status: { $ref: '#/components/schemas/StatusPagamento' }
        dataConfirmacao: { type: string, format: date-time }
        agendamentoId: { type: string, format: uuid }
        descricao: { type: string, description: 'Serviço pago ou "Assinatura PANTERA".' }
        contraparte: { type: string, description: Empresa para o tutor; tutor para a empresa. }
        pet: { type: string }
        reembolso:
          type: object
          properties:
            status: { type: string, enum: [EM_ANALISE, APROVADO, NEGADO] }
            motivo: { type: string }
            dataSolicitacao: { type: string, format: date-time }
        podeReembolsar: { type: boolean }
    Notificacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        mensagem: { type: string }
        canal: { type: string, enum: [PUSH, EMAIL, SMS] }
        dataProgramada: { type: string, format: date-time }
        dataEnvio: { type: string, format: date-time }
        status: { type: string, enum: [AGENDADA, ENVIADA, FALHOU, CANCELADA] }
    ConfiguracaoNotificacao:
      type: object
      properties:
        tipoEvento:
          type: string
          enum: [CONSULTA, VACINA, MEDICAMENTO, EXAME, CIRURGIA, BANHO_TOSA, HOSPEDAGEM, COMPROMISSO, OUTRO]
        canal: { type: string, enum: [PUSH, EMAIL, SMS] }
        antecedenciaMinutos: { type: integer }
        ativa: { type: boolean }
    Integracao:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        tipo: { type: string, enum: [CALENDARIO, PAGAMENTO, PLATAFORMA_VETERINARIA, NOTIFICACAO, OUTRA] }
        endpointUrl: { type: string }
        parametros: { type: string }
        ativa: { type: boolean }
        temCredenciais: { type: boolean }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        eventos: { type: array, items: { type: string } }
        metodoAutenticacao: { type: string }
        ativo: { type: boolean }
        integracaoId: { type: string, format: uuid }
        segredo:
          type: string
          description: Só na resposta da criação.
    Responsavel:
      type: object
      properties:
        tutorId: { type: string, format: uuid }
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoResponsavel' }
        dataVinculo: { type: string, format: date-time }
        voce: { type: boolean, description: É o usuário autenticado. }
    Assinatura:
      type: object
      properties:
        id: { type: string, format: uuid }
        plano: { type: string, enum: [GRATUITO, PANTERA] }
        status: { type: string, enum: [PENDENTE, ATIVA, CANCELADA, EXPIRADA] }
        dataInicio: { type: string, format: date }
        dataFim: { type: string, format: date }
        precoMensal: { type: number }
    TipoConversa:
      type: string
      enum: [EMPRESA, ASSISTENTE_VIRTUAL]
    Conversa:
      type: object
      properties:
        id: { type: string, format: uuid }
        tutorId: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoConversa' }
        empresaId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        status: { type: string, enum: [ABERTA, ENCERRADA] }
    ConversaResumo:
      allOf:
        - $ref: '#/components/schemas/Conversa'
        - type: object
          required: [tutor, naoLidas]
          properties:
            tutor: { type: string }
            empresa: { type: string }
            pet: { type: string }
            naoLidas: { type: integer }
            ultimaMensagem:
              type: object
              properties:
                conteudo: { type: string }
                dataHoraEnvio: { type: string, format: date-time }
                minha: { type: boolean }
    Mensagem:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversaId: { type: string, format: uuid }
        conteudo: { type: string }
        dataHoraEnvio: { type: string, format: date-time }
        remetenteId:
          type: [string, 'null']
          format: uuid
          description: Nulo quando a mensagem é do assistente virtual.
        lida: { type: boolean }
    Termo:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [TERMOS_USO_APP, TERMOS_ENTERPRISE, POLITICA_PRIVACIDADE, CONSENTIMENTO_CLIENTE, COMUNICACAO_MARKETING]
        versao: { type: string }
        titulo: { type: string }
        conteudo: { type: string }
        dataVigencia: { type: string, format: date }
        obrigatorio: { type: boolean }
    Consentimento:
      type: object
      properties:
        termoId: { type: string, format: uuid }
        tipo: { type: string }
        meioColeta: { type: string, enum: [ACEITE_NO_APP, ASSINATURA_PRESENCIAL, LINK_DIGITAL, IMPORTACAO] }
        titulo: { type: string }
        versao: { type: string }
        obrigatorio: { type: boolean }
        aceito: { type: boolean }
        dataAceite: { type: string, format: date-time }
    LogAuditoria:
      type: object
      properties:
        dataHora: { type: string, format: date-time }
        acao: { type: string }
        entidade: { type: string }
        entidadeId: { type: string }
        nivel: { type: string, enum: [INFO, ALERTA, CRITICO] }
        autorId: { type: string, format: uuid }
