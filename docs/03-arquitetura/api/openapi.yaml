openapi: 3.1.0
info:
  title: Jaguara API
  version: 1.17.0
  summary: API REST da plataforma Jaguara (tutores e empresas Enterprise).
  description: |
    Contrato da API do Jaguara (tarefa JAG-68). Os recursos seguem o modelo de classes
    (docs/04-modelagem/MOD-01-modelo-de-classes.md) e os casos de uso (docs/02-requisitos/REQ-04).
    Erros usam o formato application/problem+json (RFC 9457) com o campo `codigo` de negócio.
    Datas em ISO 8601 (UTC). Paginação por `pagina` e `tamanho`.

    Tempo real (ADR-011): Socket.IO no namespace `/tempo-real`, com o access token em
    `auth.token`. O servidor emite `mensagem:nova` (schema Mensagem) para o tutor e a empresa
    da conversa; o cliente envia com `mensagem:enviar` ({ conversaId, conteudo }) e recebe
    na confirmação `{ ok: true, mensagem }` ou `{ ok: false, codigo, detalhe }`.
    Quando o status de um pagamento muda, o servidor emite `pagamento:atualizado` (schema
    Pagamento) para o tutor e, na confirmação, também para a empresa.
  contact:
    name: Equipe Jaguara
  license:
    name: Uso acadêmico
    identifier: CC-BY-4.0
servers:
  - url: https://api.homologacao.jaguarapet.com.br/v1
    description: Homologação
  - url: http://localhost:3000/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Autenticação
  - name: Pets
  - name: Saúde
  - name: Rotina
  - name: Financeiro
  - name: Catálogo e agenda
  - name: Solicitações e agendamentos
  - name: Atendimentos
  - name: Empresa
  - name: Comunicação
  - name: Privacidade
  - name: Administração
  - name: Webhooks

paths:
  /auth/cadastro/tutor:
    post:
      tags: [Autenticação]
      summary: Cadastrar tutor (UC-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroTutor' }
      responses:
        '201':
          description: Conta criada com status PENDENTE_CONFIRMACAO; e-mail de confirmação enviado (RN02).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/cadastro/empresa:
    post:
      tags: [Autenticação]
      summary: Cadastrar empresa Enterprise (UC-32)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroEmpresa' }
      responses:
        '201':
          description: Conta criada; aguardando confirmação do e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/confirmacao:
    post:
      tags: [Autenticação]
      summary: Confirmar e-mail (RN02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: "Conta ativada." }
        '410': { $ref: '#/components/responses/Expirado' }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar usuário (UC-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string, format: password }
      responses:
        '200':
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '423':
          description: Conta bloqueada por 5 minutos após 5 falhas (RN03).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /auth/login/social:
    post:
      tags: [Autenticação]
      summary: Entrar com Google ou Apple (UC-02, RF46, ADR-012)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provedor, idToken, nonce]
              properties:
                provedor: { type: string, enum: [GOOGLE, APPLE] }
                idToken: { type: string, description: "id_token OpenID Connect emitido pelo provedor." }
                nonce: { type: string }
      responses:
        '200':
          description: Identidade já ligada a uma conta; sessão criada com os tokens do Jaguara.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '409':
          description: Já existe conta com o mesmo e-mail; o usuário confirma a senha dela para ligar a identidade.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '428':
          description: Primeiro acesso; conclua o cadastro em /auth/cadastro/social com o cadastroToken devolvido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cadastroToken: { type: string }
                  nome: { type: string }
                  email: { type: string, format: email }
  /auth/cadastro/social:
    post:
      tags: [Autenticação]
      summary: Concluir o cadastro de tutor iniciado pelo login social (UC-01, RF46)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cadastroToken, nome, cpf, aceiteTermos]
              properties:
                cadastroToken: { type: string }
                nome: { type: string }
                cpf: { type: string, pattern: '^[0-9]{11}$' }
                aceiteTermos: { type: boolean, const: true }
      responses:
        '201':
          description: Conta criada com o e-mail já confirmado pelo provedor e sessão aberta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/renovacao:
    post:
      tags: [Autenticação]
      summary: Renovar o access token
      description: Lê a sessão no banco, aplica a inatividade de 4 h (RN04), atualiza a última atividade e relê as permissões do perfil (ADR-012).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Novos tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerrar a sessão atual
      responses:
        '204': { description: "Sessão encerrada." }
  /auth/senha/recuperacao:
    post:
      tags: [Autenticação]
      summary: Solicitar link de recuperação de senha (UC-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: "Se o e-mail existir, um link válido por 2 horas é enviado (RN05)." }
  /auth/senha/redefinicao:
    post:
      tags: [Autenticação]
      summary: Redefinir senha com o token recebido (UC-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, novaSenha]
              properties:
                token: { type: string }
                novaSenha: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: "Senha redefinida." }
        '410': { $ref: '#/components/responses/Expirado' }
        '422':
          description: Senha igual a uma das três últimas (RN06).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /especies:
    get:
      tags: [Pets]
      summary: Listar espécies e raças cadastradas (RN07)
      responses:
        '200':
          description: Espécies com as raças de cada uma.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Especie' }
  /pets:
    get:
      tags: [Pets]
      summary: Listar pets do tutor autenticado
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusPet' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de pets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPets' }
    post:
      tags: [Pets]
      summary: Cadastrar pet (UC-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '201':
          description: Pet criado com o tutor como responsável principal (RN09).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Consultar perfil do pet (UC-04, UC-22)
      description: Empresas só acessam com compartilhamento ativo ou agendamento (RN24, RN26).
      responses:
        '200':
          description: Perfil do pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Pets]
      summary: Editar pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '200':
          description: Pet atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    delete:
      tags: [Pets]
      summary: Excluir pet sem histórico (RN08)
      responses:
        '204': { description: "Pet excluído." }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/arquivamento:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Pets]
      summary: Arquivar pet
      responses:
        '204': { description: "Pet arquivado." }
  /pets/{petId}/responsaveis:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Pets]
      summary: Vincular responsável (UC-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, tipo]
              properties:
                email: { type: string, format: email }
                tipo: { $ref: '#/components/schemas/TipoResponsavel' }
      responses:
        '201': { description: "Vínculo criado." }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/compartilhamentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Pets]
      summary: Compartilhar perfil do pet (UC-11)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompartilhamentoEntrada' }
      responses:
        '201':
          description: Compartilhamento ativo com os escopos informados (RN15).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compartilhamento' }
  /pets/{petId}/linha-do-tempo:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Consultar linha do tempo do pet (UC-35)
      responses:
        '200':
          description: Eventos em ordem cronológica.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemLinhaDoTempo' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /pets/{petId}/vacinacoes:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Visualizar vacinação (UC-12)
      description: Retorna apenas registros válidos (RN16).
      responses:
        '200':
          description: Histórico vacinal.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vacinacao' }
    post:
      tags: [Saúde]
      summary: Cadastrar vacinação (UC-13)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacinacaoEntrada' }
      responses:
        '201':
          description: Vacinação registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacinacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/tratamentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Listar tratamentos medicamentosos (UC-14)
      responses:
        '200':
          description: Tratamentos do pet, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tratamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Cadastrar tratamento medicamentoso (UC-14)
      description: |
        Agenda um lembrete por dose para cada responsável do pet, da primeira dose até o fim do
        último dia (sem data de fim, os próximos 30 dias; no máximo 120 doses).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TratamentoEntrada' }
      responses:
        '201':
          description: Tratamento ativo com lembretes agendados (RN18).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tratamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /tratamentos/{tratamentoId}/finalizacao:
    parameters:
      - in: path
        name: tratamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Saúde]
      summary: Finalizar tratamento e cancelar lembretes
      responses:
        '204': { description: "Tratamento finalizado." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/exames:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Histórico de exames (UC-36)
      responses:
        '200':
          description: Exames válidos, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exame' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Registrar exame (UC-36)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExameEntrada' }
      responses:
        '201':
          description: Exame registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exame' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/alergias:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Saúde]
      summary: Registrar alergia ou restrição (UC-37)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlergiaEntrada' }
      responses:
        '201': { description: "Alergia registrada." }
  /pets/{petId}/documentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Saúde]
      summary: Iniciar envio de documento (UC-34)
      description: Retorna uma URL assinada de envio válida por 5 minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo, nomeArquivo, tamanhoBytes]
              properties:
                titulo: { type: string }
                tipo: { $ref: '#/components/schemas/TipoDocumento' }
                nomeArquivo: { type: string }
                tamanhoBytes: { type: integer, maximum: 10485760 }
      responses:
        '201':
          description: Documento criado e URL de envio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentoId: { type: string, format: uuid }
                  urlEnvio: { type: string, format: uri }
  /pets/{petId}/eventos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Listar eventos do calendário (UC-10)
      parameters:
        - in: query
          name: de
          schema: { type: string, format: date-time }
        - in: query
          name: ate
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Eventos no período.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evento' }
    post:
      tags: [Rotina]
      summary: Criar evento (UC-10)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoEntrada' }
      responses:
        '201':
          description: Evento criado e lembrete agendado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/refeicoes:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Rotina]
      summary: Registrar refeição (UC-08)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataHora, alimento, quantidadeGramas]
              properties:
                dataHora: { type: string, format: date-time }
                alimento: { type: string }
                quantidadeGramas: { type: number, exclusiveMinimum: 0 }
      responses:
        '201':
          description: Refeição registrada; `limiteExcedido` indica alerta (RN12).
          content:
            application/json:
              schema:
                type: object
                properties:
                  consumoDoDia: { type: number }
                  limiteExcedido: { type: boolean }
  /categorias-despesa:
    get:
      tags: [Financeiro]
      summary: Listar as categorias de despesa (RN10)
      responses:
        '200':
          description: Categorias disponíveis, em ordem alfabética.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    nome: { type: string }
                    descricao: { type: string }
  /pets/{petId}/despesas:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Financeiro]
      summary: Listar despesas (UC-06)
      parameters:
        - in: query
          name: de
          schema: { type: string, format: date }
        - in: query
          name: ate
          schema: { type: string, format: date }
        - in: query
          name: categoriaId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Despesas do pet.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Despesa' }
    post:
      tags: [Financeiro]
      summary: Registrar despesa (UC-06)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DespesaEntrada' }
      responses:
        '201':
          description: Despesa registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Despesa' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /relatorios/despesas:
    get:
      tags: [Financeiro]
      summary: Emitir relatório de despesas (UC-07)
      parameters:
        - in: query
          name: petId
          schema: { type: string, format: uuid }
        - in: query
          name: de
          required: true
          schema: { type: string, format: date }
        - in: query
          name: ate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Relatório em JSON ou PDF (RN11), conforme o cabeçalho Accept.
          content:
            application/json:
              schema: { type: object }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }

  /empresas:
    get:
      tags: [Catálogo e agenda]
      summary: Buscar empresas com serviços ativos (UC-33)
      parameters:
        - in: query
          name: busca
          description: Trecho do nome da empresa ou de um serviço.
          schema: { type: string }
        - in: query
          name: tipo
          schema:
            type: string
            enum: [CLINICA_VETERINARIA, PET_SHOP, HOTEL_PET, CRECHE, CASA_DE_CUIDADO]
        - in: query
          name: categoria
          description: Categoria de serviço oferecida.
          schema:
            type: string
            enum: [CONSULTA, EXAME, CIRURGIA, VACINACAO, BANHO_TOSA, HOSPEDAGEM, PET_SITTER, CRECHE, OUTRO]
        - in: query
          name: cidade
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Empresas encontradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaEmpresas' }
  /empresas/{empresaId}:
    parameters:
      - $ref: '#/components/parameters/EmpresaId'
    get:
      tags: [Catálogo e agenda]
      summary: Ver o perfil público da empresa (UC-33)
      responses:
        '200':
          description: Dados públicos da empresa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpresaPublica' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /empresas/{empresaId}/servicos:
    parameters:
