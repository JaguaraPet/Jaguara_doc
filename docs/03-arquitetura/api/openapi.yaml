openapi: 3.1.0
info:
  title: Jaguara API
  version: 1.38.0
  summary: API REST da plataforma Jaguara (tutores e empresas Enterprise).
  description: |
    Contrato da API do Jaguara (tarefa JAG-68). Os recursos seguem o modelo de classes
    (docs/04-modelagem/MOD-01-modelo-de-classes.md) e os casos de uso (docs/02-requisitos/REQ-04).
    Erros usam o formato application/problem+json (RFC 9457) com o campo `codigo` de negócio.
    Datas em ISO 8601 (UTC). Paginação por `pagina` e `tamanho`.

    Tempo real (ADR-011): Socket.IO no namespace `/tempo-real`, com o access token em
    `auth.token`. O servidor emite `mensagem:nova` (schema Mensagem) para o tutor e a empresa
    da conversa; o cliente envia com `mensagem:enviar` ({ conversaId, conteudo }) e recebe
    na confirmação `{ ok: true, mensagem }` ou `{ ok: false, codigo, detalhe }`.
    Quando o status de um pagamento muda, o servidor emite `pagamento:atualizado` (schema
    Pagamento) para o tutor e, na confirmação, também para a empresa.
  contact:
    name: Equipe Jaguara
  license:
    name: Uso acadêmico
    identifier: CC-BY-4.0
servers:
  - url: https://api.homologacao.jaguarapet.com.br/v1
    description: Homologação
  - url: http://localhost:3000/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Autenticação
  - name: Pets
  - name: Saúde
  - name: Rotina
  - name: Financeiro
  - name: Catálogo e agenda
  - name: Solicitações e agendamentos
  - name: Atendimentos
  - name: Empresa
  - name: Comunicação
  - name: Privacidade
  - name: Administração
  - name: Webhooks

paths:
  /auth/cadastro/tutor:
    post:
      tags: [Autenticação]
      summary: Cadastrar tutor (UC-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroTutor' }
      responses:
        '201':
          description: Conta criada com status PENDENTE_CONFIRMACAO; e-mail de confirmação enviado (RN02).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/cadastro/empresa:
    post:
      tags: [Autenticação]
      summary: Cadastrar empresa Enterprise (UC-32)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroEmpresa' }
      responses:
        '201':
          description: Conta criada; aguardando confirmação do e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/confirmacao:
    post:
      tags: [Autenticação]
      summary: Confirmar e-mail (RN02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: "Conta ativada." }
        '410': { $ref: '#/components/responses/Expirado' }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar usuário (UC-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string, format: password }
      responses:
        '200':
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '423':
          description: Conta bloqueada por 5 minutos após 5 falhas (RN03).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /auth/login/social:
    post:
      tags: [Autenticação]
      summary: Entrar com Google ou Apple (UC-02, RF46, ADR-012)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provedor, idToken, nonce]
              properties:
                provedor: { type: string, enum: [GOOGLE, APPLE] }
                idToken: { type: string, description: "id_token OpenID Connect emitido pelo provedor." }
                nonce: { type: string }
      responses:
        '200':
          description: Identidade já ligada a uma conta; sessão criada com os tokens do Jaguara.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '409':
          description: Já existe conta com o mesmo e-mail; o usuário confirma a senha dela para ligar a identidade.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '428':
          description: Primeiro acesso; conclua o cadastro em /auth/cadastro/social com o cadastroToken devolvido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cadastroToken: { type: string }
                  nome: { type: string }
                  email: { type: string, format: email }
  /auth/cadastro/social:
    post:
      tags: [Autenticação]
      summary: Concluir o cadastro de tutor iniciado pelo login social (UC-01, RF46)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cadastroToken, nome, cpf, aceiteTermos]
              properties:
                cadastroToken: { type: string }
                nome: { type: string }
                cpf: { type: string, pattern: '^[0-9]{11}$' }
                aceiteTermos: { type: boolean, const: true }
      responses:
        '201':
          description: Conta criada com o e-mail já confirmado pelo provedor e sessão aberta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/Validacao' }
  /auth/renovacao:
    post:
      tags: [Autenticação]
      summary: Renovar o access token
      description: Lê a sessão no banco, aplica a inatividade de 4 h (RN04), atualiza a última atividade e relê as permissões do perfil (ADR-012).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Novos tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerrar a sessão atual
      responses:
        '204': { description: "Sessão encerrada." }
  /auth/senha/recuperacao:
    post:
      tags: [Autenticação]
      summary: Solicitar link de recuperação de senha (UC-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: |
            Se o e-mail tiver conta ativa, um link `<URL_WEB>/redefinir-senha?token=...` válido por
            2 horas e uso único é enviado (RN05); um link novo invalida os anteriores. A resposta
            é a mesma para qualquer e-mail.
  /auth/senha/redefinicao:
    post:
      tags: [Autenticação]
      summary: Redefinir senha com o token recebido (UC-03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, novaSenha]
              properties:
                token: { type: string }
                novaSenha: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: "Senha redefinida; a conta é desbloqueada e as sessões abertas são encerradas." }
        '410': { $ref: '#/components/responses/Expirado' }
        '422':
          description: Senha fora da política ou igual a uma das três últimas (RN06).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /especies:
    get:
      tags: [Pets]
      summary: Listar espécies e raças cadastradas (RN07)
      responses:
        '200':
          description: Espécies com as raças de cada uma.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Especie' }
  /pets:
    get:
      tags: [Pets]
      summary: Listar pets do tutor autenticado
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StatusPet' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de pets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPets' }
    post:
      tags: [Pets]
      summary: Cadastrar pet (UC-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '201':
          description: Pet criado com o tutor como responsável principal (RN09).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Consultar perfil do pet (UC-04, UC-22)
      description: Empresas só acessam com compartilhamento ativo ou agendamento (RN24, RN26).
      responses:
        '200':
          description: Perfil do pet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Pets]
      summary: Editar pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetEntrada' }
      responses:
        '200':
          description: Pet atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    delete:
      tags: [Pets]
      summary: Excluir pet sem histórico (RN08)
      responses:
        '204': { description: "Pet excluído." }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/arquivamento:
    parameters:
      - $ref: '#/components/parameters/PetId'
    delete:
      tags: [Pets]
      summary: Desarquivar pet
      description: Só o responsável principal. O pet arquivado volta para a lista de ativos; pet falecido não volta.
      responses:
        '204': { description: Pet de volta à lista de ativos. }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
    post:
      tags: [Pets]
      summary: Arquivar pet
      responses:
        '204': { description: "Pet arquivado." }
  /pets/{petId}/responsaveis:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Listar responsáveis pelo pet (UC-05)
      responses:
        '200':
          description: Responsáveis ativos, principais primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Responsavel' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Pets]
      summary: Vincular responsável (UC-05)
      description: Só o responsável principal vincula; a outra pessoa precisa ter conta de tutor ativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, tipo]
              properties:
                email: { type: string, format: email }
                tipo: { $ref: '#/components/schemas/TipoResponsavel' }
      responses:
        '201':
          description: Vínculo criado; devolve os responsáveis.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Responsavel' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/responsaveis/{tutorId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - in: path
        name: tutorId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Pets]
      summary: Trocar entre principal e adicional (UC-05, RN09)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo: { $ref: '#/components/schemas/TipoResponsavel' }
      responses:
        '200':
          description: Responsáveis atualizados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Responsavel' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/Conflito' }
    delete:
      tags: [Pets]
      summary: Remover responsável (UC-05)
      description: O principal remove qualquer um; o adicional só sai do próprio vínculo. O pet nunca fica sem principal (RN09_SEM_PRINCIPAL).
      responses:
        '204': { description: "Vínculo removido." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/compartilhamentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Listar compartilhamentos do pet (UC-11)
      responses:
        '200':
          description: Compartilhamentos com a situação atual (ativo, revogado ou expirado).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Compartilhamento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Pets]
      summary: Compartilhar perfil do pet (UC-11)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompartilhamentoEntrada' }
      responses:
        '201':
          description: |
            Compartilhamento ativo com os escopos informados (RN15). Com `destinatarioEmail`, o
            destinatário recebe por e-mail um link de leitura sem conta; o `link` só aparece nesta
            resposta. Com `empresaId`, o acesso vale dentro do sistema. Informe um dos dois.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compartilhamento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /compartilhamentos/{compartilhamentoId}/revogacao:
    parameters:
      - in: path
        name: compartilhamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pets]
      summary: Revogar compartilhamento (UC-11)
      responses:
        '204': { description: "Acesso revogado na hora." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /compartilhados/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
    get:
      tags: [Pets]
      summary: Ver o perfil compartilhado por link (UC-11)
      security: []
      responses:
        '200':
          description: Nome do pet, dados básicos se liberados e as seções compartilhadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pet:
                    type: object
                    properties:
                      nome: { type: string }
                      especie: { type: string }
                      raca: { type: string }
                      sexo: { type: string }
                      castrado: { type: boolean }
                      idadeAnos: { type: integer }
                  escopos: { type: array, items: { type: string } }
                  secoes:
                    type: array
                    items: { type: string, enum: [vacinas, exames, medicamentos, alergias] }
                  dataExpiracao: { type: string, format: date-time }
        '410': { $ref: '#/components/responses/Expirado' }
  /compartilhados/{token}/{secao}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
      - in: path
        name: secao
        required: true
        schema: { type: string, enum: [vacinas, exames, medicamentos, alergias] }
    get:
      tags: [Pets]
      summary: Ver uma seção do perfil compartilhado (UC-11)
      security: []
      responses:
        '200':
          description: Registros da seção, só se o escopo foi compartilhado (CT-11-02).
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '410': { $ref: '#/components/responses/Expirado' }
  /pets/{petId}/linha-do-tempo:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Consultar linha do tempo do pet (UC-35)
      description: Vacinas, exames, tratamentos, compromissos e atendimentos. A empresa precisa do escopo LINHA_DO_TEMPO (RN26).
      responses:
        '200':
          description: Eventos em ordem cronológica, do mais antigo para o mais recente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemLinhaDoTempo' }
        '403': { $ref: '#/components/responses/SemPermissao' }
  /pets/{petId}/vacinacoes:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Visualizar vacinação (UC-12)
      description: Retorna apenas registros válidos (RN16).
      responses:
        '200':
          description: Histórico vacinal.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vacinacao' }
    post:
      tags: [Saúde]
      summary: Cadastrar vacinação (UC-13)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacinacaoEntrada' }
      responses:
        '201':
          description: Vacinação registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacinacao' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/tratamentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Listar tratamentos medicamentosos (UC-14)
      responses:
        '200':
          description: Tratamentos do pet, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tratamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Cadastrar tratamento medicamentoso (UC-14)
      description: |
        Agenda um lembrete por dose para cada responsável do pet, da primeira dose até o fim do
        último dia (sem data de fim, os próximos 30 dias; no máximo 120 doses).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TratamentoEntrada' }
      responses:
        '201':
          description: Tratamento ativo com lembretes agendados (RN18).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tratamento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /tratamentos/{tratamentoId}/finalizacao:
    parameters:
      - in: path
        name: tratamentoId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Saúde]
      summary: Finalizar tratamento e cancelar lembretes
      responses:
        '204': { description: "Tratamento finalizado." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/exames:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Histórico de exames (UC-36)
      responses:
        '200':
          description: Exames válidos, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exame' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Registrar exame (UC-36)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExameEntrada' }
      responses:
        '201':
          description: Exame registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exame' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/alergias:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Listar alergias e restrições (UC-37)
      responses:
        '200':
          description: As graves primeiro, com `destaque` para o perfil do pet (CT-37-01).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alergia' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Registrar alergia ou restrição (UC-37)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlergiaEntrada' }
      responses:
        '201':
          description: Alergia registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alergia' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /alergias/{alergiaId}:
    parameters:
      - in: path
        name: alergiaId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Saúde]
      summary: Alterar alergia ou restrição (UC-37)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlergiaEntrada' }
      responses:
        '200':
          description: Alergia alterada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alergia' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Saúde]
      summary: Excluir alergia ou restrição (UC-37)
      description: Edição clínica; empresa precisa de ALERGIAS e EDICAO_CLINICA (RN30, CT-37-02).
      responses:
        '204': { description: "Alergia excluída." }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /pets/{petId}/documentos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Saúde]
      summary: Listar documentos do pet (UC-34)
      description: Tutor responsável ou empresa com o escopo DOCUMENTOS (RN15). A lista não traz endereço de arquivo.
      responses:
        '200':
          description: Documentos, do envio mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Documento' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Saúde]
      summary: Iniciar envio de documento (UC-34)
      description: |
        Registra o documento e devolve a URL assinada para o aparelho enviar o arquivo com PUT,
        válida por 5 minutos (ADR-005). Aceita PDF, JPG, PNG, WEBP e HEIC até 10 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo, nomeArquivo, tamanhoBytes]
              properties:
                titulo: { type: string, maxLength: 255 }
                tipo: { $ref: '#/components/schemas/TipoDocumento' }
                nomeArquivo: { type: string, maxLength: 255 }
                tamanhoBytes: { type: integer, minimum: 1, maximum: 10485760 }
                dataEmissao: { type: string, format: date }
                dataValidade: { type: string, format: date }
      responses:
        '201':
          description: Documento criado e URL de envio.
          content:
            application/json:
              schema:
                type: object
                required: [documentoId, urlEnvio, expiraEm]
                properties:
                  documentoId: { type: string, format: uuid }
                  urlEnvio: { type: string, format: uri }
                  expiraEm: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /documentos/{documentoId}/download:
    parameters:
      - in: path
        name: documentoId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Saúde]
      summary: Baixar documento do pet (UC-34)
      description: URL assinada de download, válida por 5 minutos, que baixa com o nome original (CT-34-02).
      responses:
        '200':
          description: URL de download.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiraEm]
                properties:
                  url: { type: string, format: uri }
                  expiraEm: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /documentos/{documentoId}:
    parameters:
      - in: path
        name: documentoId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Saúde]
      summary: Excluir documento do pet (UC-34)
      responses:
        '204': { description: Documento excluído e auditado. }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: "O documento é o laudo de um exame (DOCUMENTO_EM_USO)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /pets/{petId}/eventos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Listar eventos do calendário (UC-10)
      description: Eventos do tutor e agendamentos ativos com empresas (origem AGENDAMENTO). Sem período, de agora a 30 dias.
      parameters:
        - in: query
          name: de
          schema: { type: string, format: date-time }
        - in: query
          name: ate
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Eventos no período.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evento' }
    post:
      tags: [Rotina]
      summary: Criar evento (UC-10)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventoEntrada' }
      responses:
        '201':
          description: Evento criado e lembrete agendado uma hora antes para os responsáveis (RN37).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: O pet já tem compromisso no horário (RN14_CONFLITO_PET). Evento sem fim ocupa uma hora.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/Validacao' }
  /eventos/{eventoId}:
    parameters:
      - in: path
        name: eventoId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Rotina]
      summary: Excluir evento manual e cancelar o lembrete (UC-10)
      responses:
        '204': { description: "Evento excluído." }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
  /pets/{petId}/plano-alimentar:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Ver o plano alimentar ativo (UC-08)
      responses:
        '200':
          description: Plano ativo, ou `plano` nulo quando não há.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plano:
                    oneOf:
                      - $ref: '#/components/schemas/PlanoAlimentar'
                      - type: 'null'
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Rotina]
      summary: Definir meta e limite diários (UC-08, RN12)
      description: Substitui o plano ativo; o anterior fica no histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alimento, metaDiariaGramas, refeicoesPorDia]
              properties:
                alimento: { type: string }
                metaDiariaGramas: { type: number, exclusiveMinimum: 0 }
                limiteDiarioGramas:
                  type: number
                  exclusiveMinimum: 0
                  description: Não pode ser menor que a meta.
                refeicoesPorDia: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: Plano ativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanoAlimentar' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /pets/{petId}/refeicoes:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Rotina]
      summary: Refeições do dia com o consumo (UC-08)
      parameters:
        - in: query
          name: data
          description: Dia em Brasília; padrão, hoje.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Refeições do dia e o resumo do consumo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResumoAlimentar'
                  - type: object
                    properties:
                      data: { type: string, format: date }
                      refeicoes:
                        type: array
                        items: { $ref: '#/components/schemas/Refeicao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Rotina]
      summary: Registrar refeição (UC-08)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataHora, alimento, quantidadeGramas]
              properties:
                dataHora: { type: string, format: date-time }
                alimento: { type: string }
                quantidadeGramas: { type: number, exclusiveMinimum: 0 }
                observacao: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Refeição registrada; `limiteExcedido` indica alerta (RN12, CT-08-02).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Refeicao'
                  - $ref: '#/components/schemas/ResumoAlimentar'
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422': { $ref: '#/components/responses/Validacao' }
  /notificacoes:
    get:
      tags: [Rotina]
      summary: Notificações do usuário, enviadas e agendadas (UC-31)
      responses:
        '200':
          description: As 50 mais recentes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notificacao' }
  /notificacoes/configuracoes:
    get:
      tags: [Rotina]
      summary: Preferências de notificação por tipo de compromisso (RN37)
      responses:
        '200':
          description: Uma configuração por tipo, com o padrão onde o usuário não mudou.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfiguracaoNotificacao' }
  /notificacoes/configuracoes/{tipoEvento}:
    parameters:
      - in: path
        name: tipoEvento
        required: true
        schema:
          type: string
          enum: [CONSULTA, VACINA, MEDICAMENTO, EXAME, CIRURGIA, BANHO_TOSA, HOSPEDAGEM, COMPROMISSO, OUTRO]
    put:
      tags: [Rotina]
      summary: Definir canal, antecedência e liga/desliga de um tipo (RN37, CT-31-01)
      description: Vale para os lembretes agendados daqui em diante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canal, antecedenciaMinutos, ativa]
              properties:
                canal: { type: string, enum: [PUSH, EMAIL] }
                antecedenciaMinutos: { type: integer, minimum: 0, maximum: 10080 }
                ativa: { type: boolean }
      responses:
        '200':
          description: Configuração salva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracaoNotificacao' }
        '422': { $ref: '#/components/responses/Validacao' }
  /categorias-despesa:
    get:
      tags: [Financeiro]
      summary: Listar as categorias de despesa (RN10)
      responses:
        '200':
          description: Categorias disponíveis, em ordem alfabética.
          content:
